      stdout.write("  mount github:user/repo /mymount    attach a GitHub repo\n");
      stdout.write("  mount --bind <src> <dst>           re-expose a directory (admin only)\n");
      stdout.write("  unmount /path                      detach a user mount\n");
      return 0;
    }
    if (args[0] === "--bind") {
      if (!isPrivilegedUser()) {
        stderr.write("mount: operation not permitted (admin only)\n");
        return 1;
      }
      const bindSrc = args[1], bindDst = args[2];
      if (!bindSrc || !bindDst) {
        stderr.write("mount: usage: mount --bind <src> <dst>\n");
        return 2;
      }
      const dr = fs._resolve(bindDst);
      if (fs.mounts.some((m) => m.prefix === dr)) {
        stderr.write(`mount: ${dr}: already a mount point (unmount ${dr} first)\n`);
        return 1;
      }
      try {
        fs.bindMount(fs._resolve(bindSrc), dr);
        stdout.write(`mounted ${bindSrc} on ${bindDst} (bind)\n`);
        return 0;
      } catch (e) {
        stderr.write(`mount: ${e.message}\n`);
        return 1;
      }
    }
    const spec = args[0], target = args[1];
    if (!target) { stderr.write("mount: usage: mount github:user/repo /mymount\n"); return 2; }
    const r = fs._resolve(target);
    if (fs.mounts.some((m) => m.prefix === r)) {
      stderr.write(`mount: ${r}: already a mount point (unmount ${r} first)\n`);
      return 1;
    }
    try {
      const record = fs.mountSpec(spec, r);
      stdout.write(`mounted ${record.name} at ${record.prefix}\n`);
      return 0;
    } catch (e) {
      stderr.write(`mount: ${e.message}\n`);
      return 1;
    }
  },

  async unmount(args) {
    if (args.length === 0) { stderr.write("unmount: missing mount point\n"); return 2; }
    const r = fs._resolve(args[0]);
    const record = fs.mounts.find((m) => m.prefix === r && m.user);
    if (!record) {
      stderr.write(`unmount: ${args[0]}: not a user-created mount\n`);
      return 1;
    }
    fs.mounts = fs.mounts.filter((m) => m !== record);
    fs.binds.delete(r);
    stdout.write(`unmounted ${r}\n`);
    return 0;
  },

  async chroot(args) {
    // chroot <dir>   — confine the shell to a new root (admin only)
    // chroot -       — return to the real root
    if (!isPrivilegedUser()) {
      stderr.write("chroot: operation not permitted (admin only)\n");
      return 1;
    }
    if (args.length === 0 || args[0] === "-h" || args[0] === "--help") {
      stdout.write("chroot <dir> — confine the shell to a new root\n");
      stdout.write("chroot -      — return to the real root\n");
      return args.length ? 0 : 2;
    }
    if (args[0] === "-" || args[0] === "/") {
      if (fs.root && fs.root !== "/") {
        fs.cwd = fs.chrootSavedCwd || "/home";
        fs.root = "/";
        stdout.write("chroot: returned to the real root\n");
      } else {
        stdout.write("chroot: not inside a chroot\n");
      }
      updatePrompt();
      return 0;
    }
    const r = fs._resolve(args[0]);
    let st;
    try { st = await fs.stat(r); } catch (e) {
      stderr.write(`chroot: ${args[0]}: ${e.message}\n`);
      return 1;
    }
    if (!st || st.type !== "dir") {
      stderr.write(`chroot: ${args[0]}: not a directory\n`);
      return 1;
    }
    fs.chrootSavedCwd = fs.cwd;
    fs.root = r;
    fs.cwd = r;
    stdout.write(`chroot: changed root to ${args[0]} — "/" is now ${r}\n`);
    updatePrompt();
    return 0;
  },

  async exit(args) {
    write("Goodbye.\n", "info");
    input.disabled = true;
    return 0;
  }
};

// ─── Command Resolution ─────────────────────────────────────────

// Unprivileged users (su nobody/daemon/guest/...) may only run
// admin-trusted code: builtins and .js/.wasm files owned by tinysh.
// Custom code (anything they — or another non-admin — created) is
// refused, so an unprivileged session can't escalate by dropping a
// .js/.wasm file and running it.
function isPrivilegedUser() {
  const u = env.USER || "tinysh";
  return u === "tinysh" || u === "root";
}
function customExecDenied(path) {
  if (isPrivilegedUser()) return null;
  const a = fs.attrOf(path);
  const owner = a ? a.owner : "tinysh";
  if (owner === "tinysh") return null;
  return {
    type: "badpath",
    path,
    err: "operation not permitted: unprivileged users cannot run custom code (owned by " + owner + ")",
  };
}

async function resolveCommand(name) {
  // vim is an alias for vi
  if (name === "vim") name = "vi";

  // A name containing a "/" is an explicit path, like in /bin/sh: it is
  // resolved against the cwd and run directly (./a.wasm, /home/x.js,
  // ../run.mjs) instead of being looked up in $PATH. Bare names never
  // fall back to the cwd — that's what the leading ./ is for.
  if (name.includes("/")) {
    const resolved = fs._resolve(name);
    let st;
    try {
      st = await fs.stat(resolved);
    } catch {
      return null; // no such file
    }
    if (!st) return null;
    if (st.type === "dir") {
      return { type: "badpath", path: resolved, err: "Is a directory" };
    }
    if (/\.wasm$/i.test(resolved)) {
      const denied = customExecDenied(resolved);
      if (denied) return denied;
      return { type: "wasm", path: resolved };
    }
    if (/\.(js|mjs)$/i.test(resolved)) {
      const denied = customExecDenied(resolved);
      if (denied) return denied;
      return { type: "jsfile", path: resolved };
    }
    // The file exists but the shell can't run it (no interpreter here).
    return {
      type: "badpath",
      path: resolved,
      err: "cannot execute: only .js/.mjs/.wasm files are runnable",
    };
  }

  // A wasm32-wasi binary in the command path is a "native command" and
  // shadows the builtin of the same name — so `wasmer install grep`
  // (which drops /bin/grep.wasm) makes `grep` run real grep compiled
  // to WASM instead of the JS fallback.
  const searchPaths = env.PATH.split(":").filter(Boolean);
  for (const dir of searchPaths) {
    try {
      const entries = await fs.list(dir);
      if (entries.includes(name + ".wasm")) {
        const p = dir + "/" + name + ".wasm";
        const denied = customExecDenied(p);
        if (denied) return denied;
        return { type: "wasm", path: p };
      }
    } catch {}
  }

  if (builtins[name]) return { type: "builtin", fn: builtins[name] };
  // Walk the command path from $PATH (colon-separated, like POSIX)
  for (const dir of searchPaths) {
    try {
      for (const entry of await fs.list(dir)) {
        const clean = entry.replace(/\/$/, "");
        if (clean === name || clean === name + ".js") {
          const p = dir + "/" + clean;
          const denied = customExecDenied(p);
          if (denied) return denied;
          return { type: "jsfile", path: p };
        }
        if (clean === name + ".wasm") {
          const p = dir + "/" + clean;
          const denied = customExecDenied(p);
          if (denied) return denied;
          return { type: "wasm", path: p };
        }
      }
    } catch {}
  }

  // Auto-load WASM binary from local server on first use.
  // cc is an alias for the compiler binary.
  // (Explicit paths like ./a.wasm are never auto-loaded.)
  if (name.includes("/")) return null;
  // Unprivileged users never auto-load (and couldn't write to /usr/bin anyway).
  if (!isPrivilegedUser()) return null;
  let wasmName = name;
  if (name === "cc") wasmName = "compiler";
  try {
    const resp = await fetch("wasm-bin/" + wasmName + ".wasm");
    if (resp.ok) {
      const blob = await resp.blob();
      const destPath = "/usr/bin/" + name + ".wasm";
      await fs.writeBlob(destPath, blob);
      return { type: "wasm", path: destPath };
    }
  } catch {}

  return null;
}

// ─── Command Handler ────────────────────────────────────────────

// Tokenize a pipeline segment into words the way a shell does:
//   whitespace separates words (outside quotes)
//   '...'  single quotes — everything literal until the closing quote
//   "..."  double quotes — backslash escapes only " \ $ and ` (POSIX),
//          everything else (spaces, |, *...) stays literal
//   \x     outside quotes — escapes the next character ("\ " → space)
//   "" / ''               — produce an empty word
// Throws an Error with a shell-style message if a quote is left open.
function tokenize(segment) {
  const tokens = [];
  let cur = "";
  let started = false;  // have we begun a word?
  let quoted = false;   // did this word contain an explicit quote? (so '' → "")
  let inSingle = false;
  let inDouble = false;

  const push = () => {
    if (started || quoted) tokens.push(cur);
    cur = "";
    started = false;
    quoted = false;
  };

  for (let i = 0; i < segment.length; i++) {
    const ch = segment[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      else cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      else if (ch === "\\" && ['"', "\\", "$", "`"].includes(segment[i + 1])) {
        cur += segment[++i]; // escaped char loses its special meaning
      } else if (ch === "$") {
        // $NAME / ${NAME} expansion (valid inside double quotes too)
        const ref = expandRef(segment, i);
        cur += ref.value;
        i = ref.end - 1;
      } else {
        cur += ch;
      }
      continue;
    }
    if (ch === "'") { inSingle = true; started = true; quoted = true; continue; }
    if (ch === '"') { inDouble = true; started = true; quoted = true; continue; }
    if (ch === "\\") {
      if (i + 1 < segment.length) cur += segment[++i];
      started = true;
      continue;
    }
    if (ch === "~" && !started && !quoted) {
      // ~ / ~/path → $HOME / $HOME/path (tilde expansion)
      cur += env.HOME;
      started = true;
      continue;
    }
    if (ch === "$") {
      // $NAME / ${NAME} expansion outside quotes
      const ref = expandRef(segment, i);
      cur += ref.value;
      i = ref.end - 1;
      started = true;
      continue;
    }
    if (/\s/.test(ch)) { push(); continue; }
    cur += ch;
    started = true;
  }
  if (inSingle) throw new Error(`unexpected EOF while looking for matching "'"`);
  if (inDouble) throw new Error(`unexpected EOF while looking for matching '"'`);
  push();
  return tokens;
}

// Split a line into pipeline segments on `|`, respecting quotes and
// backslash escapes (a \| outside quotes is a literal pipe char).
function splitPipe(line) {
  const segments = [];
  let cur = "";
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      cur += ch;
      continue;
    }
    if (ch === "\\") {
      cur += ch;
      if (i + 1 < line.length) { cur += line[i + 1]; i++; }
      continue;
    }
    if (ch === "'") { inSingle = true; cur += ch; continue; }
    if (ch === '"') { inDouble = true; cur += ch; continue; }
    if (ch === "|") { segments.push(cur); cur = ""; continue; }
    cur += ch;
  }
  segments.push(cur);
  return segments;
}

// Split a line into conditional segments on `&&` and `||`, respecting
// quotes and backslash escapes (a `\&&` outside quotes is a literal
// ampersand, not an operator). Returns { text, op } parts where `op`
// is the operator preceding the part ('&&' or '||'), or null for the
// first part. A lone `&` is a syntax error (no background jobs here).
function splitConditionals(line) {
  const parts = [];
  let cur = "";
  let op = null;
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      cur += ch;
      continue;
    }
    if (ch === "\\") {
      cur += ch;
      if (i + 1 < line.length) { cur += line[i + 1]; i++; }
      continue;
    }
    if (ch === "'") { inSingle = true; cur += ch; continue; }
    if (ch === '"') { inDouble = true; cur += ch; continue; }
    if ((ch === "&" || ch === "|") && line[i + 1] === ch) {
      parts.push({ text: cur, op });
      cur = "";
      op = ch + ch;
      i++;
      continue;
    }
    if (ch === "&") {
      throw new Error("syntax error near unexpected token '&'");
    }
    cur += ch;
  }
  parts.push({ text: cur, op });
  return parts;
}

// python — run through the MicroPython reactor (src/py.js). The engine
// is a singleton, so state persists across lines and invocations.
async function runPythonCmd(args, stdin, isLast, outputRedirect) {
  if (args.length === 0) {
    if (stdin && stdin.trim()) {
      args = ["-"];
    } else {
      enterPythonRepl();
      return { ok: true, code: 0, output: "" };
    }
  }
  let source = null;
  if (args[0] === "-c" || args[0] === "-e") {
    source = args.slice(1).join(" ");
  } else if (args[0] === "-") {
    source = stdin;
  } else if (!args[0].startsWith("-")) {
    try {
      source = await fs.read(args[0]);
    } catch (e) {
      stderr.write(`python: ${args[0]}: ${e.message}\n`);
      return { ok: false, code: 1, output: "" };
    }
  } else {
    stderr.write(`python: unknown option ${args[0]}\n`);
    return { ok: false, code: 2, output: "" };
  }
  if (source === null) {
    stderr.write("python: no script given (python -c CODE | script.py | - for stdin)\n");
    return { ok: false, code: 2, output: "" };
  }
  const { pyExec } = await import("../src/py.js");
  let output = "";
  const origWrite = stdout.write;
  stdout.write = (s) => { output += s; return true; };
  let code;
  try {
    code = await pyExec(source, { stdout, stderr });
  } catch (e) {
    stderr.write(`python: ${e.message}\n`);
    code = 1;
  } finally {
    stdout.write = origWrite;
  }
  if (outputRedirect) {
    await fs.write(outputRedirect, output);
    output = "";
  } else if (isLast) {
    stdout.write(output);
    output = "";
  }
  return { ok: code === 0, code, output };
}

// Run one pipeline (`|`-separated commands), feeding each command's
// stdout to the next command's stdin. Returns the pipeline's exit
// status: the first failing command's status, else the last one's.
async function runPipeline(pipelineText, initialStdin = "") {
  const segments = splitPipe(pipelineText);
  let stdin = initialStdin;
  let exitCode = 0;
  for (let i = 0; i < segments.length; i++) {
    if (!segments[i].trim()) {
      stderr.write(`tinysh: syntax error near unexpected token '|'\n`);
      return 2;
    }
    const result = await runSegment(segments[i], stdin, i === segments.length - 1);
    if (!result.ok) return result.code ?? 1;
    stdin = result.output;
    exitCode = result.code ?? 0;
  }
  return exitCode;
}

// Run a nested command line from generated JS (pipelines and command
// substitution inside a `bash` script) through the shell itself, and
// return its captured stdout plus exit status. This is what rt.exec /
// rt.pipe / rt.pipeCond in the generated JS call: sh2perl shells out
// to 'bash -c "..."' for pipes, and we route that back through the
// shell's own pipeline machinery.
async function runNestedCommand(cmdLine, stdin = "") {
  let captured = "";
  let capturedErr = "";
  const origWrite = stdout.write;
  const origErrWrite = stderr.write;
  stdout.write = (chunk) => {
    captured += chunk;
    return true;
  };
  stderr.write = (chunk) => {
    capturedErr += chunk;
    return true;
  };
  let code = 0;
  try {
    code = (await handleLine(cmdLine, stdin)) ?? 0;
  } finally {
    stdout.write = origWrite;
    stderr.write = origErrWrite;
  }
  return { out: captured, err: capturedErr, code };
}

// ─── Per-pane command runner (used by /bin/screen.js) ───────────
// screen.js splits the terminal into tmux-style panes, each a mini-
// shell with its own working directory and output. It calls this hook
// to run a line the way the shell would, but routed to per-pane
// writers. The pane's cwd is captured after the run (commands may cd)
// and the main shell's cwd is restored.
window.shellPaneRun = async (line, opts = {}) => {
  const saveCwd = fs.cwd;
  const paneCwd = opts.cwd || saveCwd;
  const out = opts.out || null;
  const err = opts.err || null;
  fs.cwd = paneCwd;
  env.PWD = paneCwd;
  const origOut = stdout.write;
  const origErr = stderr.write;
  stdout.write = (chunk) => { if (out) out(chunk); return true; };
  stderr.write = (chunk) => { if (err) err(chunk); return true; };
  let code = 0;
  try {
    code = (await handleLine(line)) ?? 0;
  } catch (e) {
    code = 1;
  } finally {
    stdout.write = origOut;
    stderr.write = origErr;
  }
  const newCwd = fs.cwd;
  fs.cwd = saveCwd;
  env.PWD = saveCwd;
  return { code, cwd: newCwd };
};

// Execute one pipeline segment. `stdin` carries the previous segment's
// stdout. Returns { ok, code, output } — `code` is the command's exit
// status (0 success), `output` is the captured stdout that should be
// fed to the next segment (empty for the last segment).
async function runSegment(segmentText, stdin, isLast) {
  let tokens;
  try {
    tokens = tokenize(segmentText);
  } catch (e) {
    stderr.write(`tinysh: ${e.message}\n`);
    return { ok: false, code: 2, output: "" };
  }
  if (tokens.length === 0) return { ok: false, code: 2, output: "" };
  const cmd = tokens[0];
  const args = tokens.slice(1);

  let outputRedirect = null;
  const redirectIndex = args.indexOf(">");
  if (redirectIndex !== -1) {
    outputRedirect = args[redirectIndex + 1];
    args.splice(redirectIndex, 2);
  }

  // python — MicroPython engine (reactor, src/py.js): REPL, -c, script
  // files and stdin. Intercepted before resolveCommand so it never
  // auto-loads python.wasm or needs a worker/SAB.
  if (cmd === "python" && !cmd.includes("/")) {
    return await runPythonCmd(args, stdin, isLast, outputRedirect);
  }
  // perl — bare `perl` with no script/stdin opens the interactive REPL
  // (the /bin perl command handles -e / script / stdin as before).
  if (cmd === "perl" && !cmd.includes("/") && args.length === 0 && !(stdin && stdin.trim())) {
    enterPerlRepl();
    return { ok: true, code: 0, output: "" };
  }

  let output = "";

  const resolved = await resolveCommand(cmd);
  if (resolved && resolved.type === "badpath") {
    // The path exists but can't be executed (a directory, or not a
    // .js/.mjs/.wasm file) — exit 126, POSIX "found but not executable".
    stderr.write(`${cmd}: ${resolved.err}\n`);
    return { ok: false, code: 126, output: "" };
  }
  if (!resolved) {
    const hints = {
      "nano": "edit", "emacs": "edit",
      "more": "cat", "less": "cat",
      "cls": "clear", "quit": "exit", "q": "exit",
      "?": "help", "dir": "ls", "ll": "ls", "la": "ls",
      "chdir": "cd",
      "apt": "wasmer", "apt-get": "wasmer", "yum": "wasmer",
      "dnf": "wasmer", "brew": "wasmer", "pacman": "wasmer",
      "apk": "wasmer", "pip": "wasmer", "npm": "wasmer install",
      "sh": "bash",
    };
    const hint = hints[cmd];
    if (hint) {
      stderr.write(`${cmd}: command not found — try "${hint}" instead\n`);
    } else {
      stderr.write(`${cmd}: command not found\n`);
    }
    return { ok: false, code: 127, output: "" };
  }

  // Make pipe input available to builtins (head etc.)
  stdinBuffer = stdin;

  try {
    if (resolved.type === "wasm") {
      try {
        // cc: compile C → WAT, then to a .wasm binary.
        //   cc prog.c            → writes a.wasm (like gcc's a.out)
        //   cc -o out.wasm prog.c → writes out.wasm
        //   cc -S prog.c          → emits WAT to stdout (assembly)
        //
        // The compiler (compiler.wasm) sees the WASI filesystem rooted at
        // '/', so relative paths like 't.c' must be resolved to absolute
        // VFS paths (/home/t.c) or it looks for /t.c and fails.
        let ccOutput = null;
        let ccWatOnly = false;
        if ((cmd === "cc" || cmd === "compiler") && args.length > 0) {
          let srcFile = null;
          const resolveSrc = (p) => (p && p.startsWith("/") ? p : fs._resolve(p));
          if (args[0] === "-o" && args[1]) {
            ccOutput = resolveSrc(args[1]);
            srcFile = resolveSrc(args[2]);
          } else if (args[0] === "-S") {
            ccWatOnly = true;
            srcFile = resolveSrc(args[1]);
          } else if (args[0].endsWith(".wasm") && args[1]) {
            ccOutput = resolveSrc(args[0]);
            srcFile = resolveSrc(args[1]);
          } else {
            ccOutput = resolveSrc("a.wasm");  // default, like gcc's a.out
            srcFile = resolveSrc(args[0]);
          }

          // This compiler is a C subset: no preprocessor, no printf. Pre-
          // process standard C: strip #lines, inject the runtime function
          // declarations, and rewrite printf → print/println/println_int.
          if (srcFile) {
            try {
              const original = await fs.read(srcFile);
              const prepped = preprocessC(original);
              const tmpSrc = "/tmp/cc-src-" + (ccCounter++) + ".c";
              await fs.write(tmpSrc, prepped);
              srcFile = tmpSrc;
            } catch (e) {
              // read failed — leave srcFile as-is (compiler will report)
            }
          }
          wasmArgs = [cmd, srcFile];
        }

        await wasmRunner.run(resolved.path, wasmArgs, stdin);
        const exitCode = wasmRunner.getExitCode();
        let wasmOut = wasmRunner.getStdout();
        const wasmErr = wasmRunner.getStderr();

        // Convert WAT → WASM binary (skip for -S which wants the WAT)
        if (!ccWatOnly && ccOutput && exitCode === 0) {
          try {
            const bytes = await watToWasm(wasmOut, "cc-output.wat");
            await fs.writeBlob(ccOutput, new Blob([bytes], { type: "application/wasm" }));
            stdout.write(`${ccOutput}: ${bytes.length} bytes\n`);
            wasmOut = "";  // binary written to file, not stdout
          } catch (e) {
            stderr.write(`cc: ${e.message}\n`);
            return { ok: false, code: 1, output: "" };
          }
        }

        if (outputRedirect) {
          await fs.write(outputRedirect, wasmOut);
        } else if (isLast) {
          if (wasmOut) stdout.write(wasmOut);
        } else {
          output = wasmOut;
        }
        if (wasmErr) {
          stderr.write(wasmErr);
        }
        if (exitCode !== 0) {
          stderr.write(`${cmd}: exited with code ${exitCode}\n`);
          return { ok: false, code: exitCode, output: "" };
        }
        return { ok: true, code: 0, output };
      } catch (e) {
        if (e instanceof InterruptError) throw e;
        stderr.write(`${cmd}: wasm error: ${e.message}\n`);
        return { ok: false, code: 1, output: "" };
      }
    }

    if (resolved.type === "builtin") {
      const origWrite = stdout.write;
      const chunks = [];
      const capture = outputRedirect || !isLast;
      if (capture) {
        stdout.write = (chunk) => { chunks.push(chunk); return true; };
      }
      let code = 0;
      try {
        code = (await resolved.fn(args)) ?? 0;
      } finally {
        if (capture) {
          stdout.write = origWrite;
          const captured = chunks.join("");
          if (outputRedirect) await fs.write(outputRedirect, captured);
          else output = captured;
        }
      }
      return { ok: code === 0, code, output };
    }

    // Run a .js command file from /commands/ (or /bin/, /usr/bin/)
    const content = await fs.read(resolved.path);
    const fn = new Function("args", "fs", "console", "stdin", "env", "sh2", "sh2lib", "shell", `
        return (async () => { ${content} })();
      `);
    const logChunks = [];
    const fakeConsole = { log: (...msgs) => logChunks.push(msgs.join(" ") + "\n") };
    // `sh2` — the bash runtime (saved bash2js output calls sh2.exec & co.)
    const sh2rt = createSh2Runtime({
      fs, env,
      shellExec: runNestedCommand,
      stdout, stderr,
      args: args.slice(1),
      argv0: cmd,
    });
    // `shell` — lets commands run lines through the shell itself (the
    // floating xterm terminal uses this); returns { out, err, code }.
    const shellApi = { runLine: (cmdLine) => runNestedCommand(cmdLine) };
    const ret = await fn(args, fs, fakeConsole, stdin, env, sh2rt.sh2, sh2libFacade, shellApi);
    // A command file may return a number to set its exit status
    const code = typeof ret === "number" ? ret : 0;
    output = logChunks.join("");
    if (outputRedirect) {
      await fs.write(outputRedirect, output);
      output = "";
    } else if (isLast) {
      stdout.write(output);
      output = "";
    }
    return { ok: code === 0, code, output };
  } catch (e) {
    if (e instanceof InterruptError) throw e;
    stderr.write(`${cmd}: error: ${e.message}\n`);
    return { ok: false, code: 1, output: "" };
  }
}

async function handleLine(line, initialStdin) {
  const trimmed = line.trim();
  if (!trimmed) return;

  // Split on && / || and run left to right. `&&` runs the next command
  // only if the previous one succeeded (exit 0); `||` runs it only if
  // the previous one failed. Each conditional part is itself a pipeline.
  let parts;
  try {
    parts = splitConditionals(trimmed);
  } catch (e) {
    stderr.write(`tinysh: ${e.message}\n`);
    return;
  }
  // An empty segment means the line started with an operator, ended
  // with one, or had two operators in a row (`&& echo hi`, `echo hi &&`,
  // `a && || b`) — all syntax errors.
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].text.trim()) {
      const nextOp = i + 1 < parts.length ? parts[i + 1].op : null;
      const token = nextOp ? `'${nextOp}'` : "newline";
      stderr.write(`tinysh: syntax error near unexpected token ${token}\n`);
      return;
    }
  }

  let exitCode = 0;
  for (let i = 0; i < parts.length; i++) {
    if (i > 0) {
      if (parts[i].op === "&&" && exitCode !== 0) continue;
      if (parts[i].op === "||" && exitCode === 0) continue;
    }
    exitCode = await runPipeline(parts[i].text, initialStdin);
  }
  return exitCode;
}

// ─── Startup config (~/.tinyshrc) ─────────────────────────────
// Like a Unix shell's rc file (.bashrc / .zshrc), $HOME/.tinyshrc
// is read at startup and each non-comment line is run as a shell
// command — set environment variables, tweak the path, print a
// banner, whatever. Lines starting with # are comments; a missing
// file is not an error.
async function loadConfig() {
  const configPath = (env.HOME.replace(/\/+$/, "") || "/") + "/.tinyshrc";
  let content;
  try {
    content = await fs.read(configPath);
  } catch {
    return; // no config file — not an error
  }
  for (const line of content.split("\n")) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith("#")) continue;
    await handleLine(trimmed);
  }
  updatePrompt();
}

// ─── Command History (persists across refreshes) ───────────────

const HISTORY_KEY = "tinysh:history";
const HISTORY_MAX = 500;

// Load history from localStorage (browser) or empty
let history = [];
try {
  const saved = localStorage.getItem(HISTORY_KEY);
  if (saved) history = JSON.parse(saved);
} catch {}
let historyIndex = history.length;

function saveHistory() {
  try {
    // Keep only the most recent HISTORY_MAX entries
    if (history.length > HISTORY_MAX) {
      history = history.slice(-HISTORY_MAX);
    }
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch {}
}

function addHistory(line) {
  const trimmed = line.trim();
  if (!trimmed) return;
  // Don't duplicate the last command
  if (history[history.length - 1] === trimmed) return;
  history.push(trimmed);
  historyIndex = history.length;
  saveHistory();
}

// ─── Tab Completion ─────────────────────────────────────────────

async function complete(line, cursorPos) {
  const beforeCursor = line.slice(0, cursorPos);

  // Find the start of the current word
  const wordStart = Math.max(beforeCursor.lastIndexOf(" ") + 1, 0);
  const prefix = beforeCursor.slice(wordStart);

  if (!prefix) return { line, cursorPos, matches: [] };

  let matches = [];
  const isPath = prefix.includes("/");

  if (isPath) {
    // Filesystem path completion
    const lastSlash = prefix.lastIndexOf("/");
    const dir = prefix.slice(0, lastSlash + 1);
    const filePrefix = prefix.slice(lastSlash + 1);

    try {
      const resolvedDir = dir === "/" ? "/" : fs._resolve(dir.replace(/\/$/, ""));
      const entries = await fs.list(resolvedDir);
      matches = entries
        .filter(e => e.startsWith(filePrefix))
        .map(e => {
          const isDir = e.endsWith("/");
          return isDir ? dir + e : dir + e;
        });
    } catch { /* directory doesn't exist or no permission */ }
  } else {
    // Command completion
    matches.push(...Object.keys(builtins).filter(name => name.startsWith(prefix)));

    // Search command paths: /bin (.js commands) and /usr/bin (.wasm)
    for (const dir of ["/bin", "/usr/bin"]) {
      try {
        const cmdEntries = await fs.list(dir);
        for (const e of cmdEntries) {
          const name = e.replace(/\/$/, "").replace(/\.(js|wasm)$/, "");
          if (name.startsWith(prefix) && !matches.includes(name)) {
            matches.push(name);
          }
        }
      } catch { /* dir doesn't exist */ }
    }
  }

  matches = [...new Set(matches)].sort();

  if (matches.length === 1) {
    const m = matches[0];
    const suffix = isPath && m.endsWith("/") ? "" : " ";
    const newLine = beforeCursor.slice(0, wordStart) + m + suffix + line.slice(cursorPos);
    const newPos = wordStart + m.length + suffix.length;
    return { line: newLine, cursorPos: newPos, matches: [] };
  }

  if (matches.length > 1) {
    const common = longestCommonPrefix(matches);
    if (common !== prefix && common.length > prefix.length) {
      const newLine = beforeCursor.slice(0, wordStart) + common + line.slice(cursorPos);
      const newPos = wordStart + common.length;
      return { line: newLine, cursorPos: newPos, matches };
    }
    // Show all matches on a new line
    return { line, cursorPos, matches };
  }

  return { line, cursorPos, matches: [] };
}

function longestCommonPrefix(strings) {
  if (!strings.length) return "";
  let prefix = strings[0];
  for (let i = 1; i < strings.length; i++) {
    while (strings[i].indexOf(prefix) !== 0) {
      prefix = prefix.slice(0, -1);
      if (!prefix) return "";
    }
  }
  return prefix;
}

// ─── Input Handling ─────────────────────────────────────────────

let lastTabPress = 0;
let lastPrefix = "";
let lastMatches = [];

// ─── Python REPL (worker-based, WASI-level blocking stdin) ─────

// ─── Interactive REPLs (reactor-based — no worker, no SAB) ───────
// python runs the micropython classic build (src/py.js, asyncify'd) and
// perl runs zeroperl — both state-preserving engines driven line by
// line by the shell. No SharedArrayBuffer, no COOP/COEP: the whole
// shell now works on plain GitHub Pages.
const replState = {
  active: false,
  mode: null,        // "python" | "perl"
  perl: null,        // ZeroPerl instance (perl mode)
  perlReady: null,   // promise that resolves when the perl instance is up
  perlSession: [],   // accumulated REPL lines — replayed on every line so
                     // `my` lexicals persist (Perl scopes `my` to one
                     // eval; replaying the whole session keeps them alive)
  perlOut: "",       // stdout captured during one run, split at the marker
  perlMarker: "",    // unique string printed between old and new code
  history: [],       // per-session REPL history (Up/Down)
  histIdx: 0,
};

function decChunk(chunk) {
  if (typeof chunk === "string") return chunk;
  return new TextDecoder().decode(chunk);
}

function enterPythonRepl() {
  spinnerStop();  // modal mode takes over the prompt slot
  replState.active = true;
  replState.mode = "python";
  replState.history = [];
  replState.histIdx = 0;
  stdout.write("MicroPython REPL — state persists per line · exit() or Ctrl-D to leave\n");
  updatePrompt();
  recordReplPrompt();
}

function enterPerlRepl() {
  spinnerStop();  // modal mode takes over the prompt slot
  replState.active = true;
  replState.mode = "perl";
  replState.history = [];
  replState.histIdx = 0;
  stdout.write("Perl REPL (zeroperl) — state persists per line · exit or Ctrl-D to leave\n");
  updatePrompt();
  recordReplPrompt();
  replState.perlSession = [];
  replState.perlMarker = "__perl_repl_" + Date.now() + "_" +
    Math.floor(Math.random() * 1e9) + "__";
  // The interpreter loads lazily (fetch + instantiate ~300KB wasm).
  replState.perlReady = (async () => {
    try {
      const mod = await import("@6over3/zeroperl-ts");
      const perl = await mod.ZeroPerl.create({
        env: env || {},
        fileSystem: null,
        stdout: (d) => { replState.perlOut += decChunk(d); },
        stderr: (d) => stderr.write(decChunk(d)),
        fetch: () => fetch("vendor/zeroperl.wasm"),
      });
      replState.perl = perl;
    } catch (e) {
      stderr.write(`perl: ${e.message}\n`);
      exitRepl();
    }
  })();
}

function exitRepl() {
  if (!replState.active) return;
  const mode = replState.mode;
  if (replState.perl) {
    try { replState.perl.shutdown(); } catch (e) {}
  }
  replState.active = false;
  replState.mode = null;
  replState.perl = null;
  replState.perlReady = null;
  stdout.write(`\nLeaving ${mode === "perl" ? "Perl" : "Python"} REPL.\n`);
  updatePrompt();
  writeShellPrompt();
}

async function runReplLine(line) {
  if (!replState.active) return;
  const trimmed = line.trim();
  if (trimmed && replState.history[replState.history.length - 1] !== trimmed) {
    replState.history.push(trimmed);
  }
  replState.histIdx = replState.history.length;
  if (replState.mode === "python") {
    if (trimmed === "exit()" || trimmed === "quit()") { exitRepl(); return; }
    try {
      const { pyExec } = await import("../src/py.js");
      await pyExec(line, { stdout, stderr });
    } catch (e) {
      stderr.write(`python: ${e.message}\n`);
    }
  } else {
    if (trimmed === "exit" || trimmed === "quit" || trimmed === ":q") { exitRepl(); return; }
    try {
      await replState.perlReady;
      if (!replState.active) return;  // load failed and exited
      // Session replay: re-run every line so far plus the new one, with
      // a marker printed between the old code and the new line. `my`
      // lexicals from earlier lines survive because they're re-declared
      // in the same eval; only the output after the marker is shown.
      replState.perlOut = "";
      const session = replState.perlSession;
      // Separate statements with ";" — a bare newline doesn't end a Perl
      // statement (my $x=9 works as the last line of an eval but breaks
      // when more code follows), and only successful lines join the
      // session so an error never poisons the replay.
      const code = (session.length > 0 ? session.join(";\n") + ";\n" : "") +
        "print " + JSON.stringify(replState.perlMarker + "\n") + ";\n" +
        line;
      const res = await replState.perl.eval(code, []);
      try { replState.perl.flush(); } catch (e) {}
      const marker = replState.perlMarker;
      const splitAt = replState.perlOut.lastIndexOf(marker + "\n");
      if (splitAt !== -1) {
        const fresh = replState.perlOut.slice(splitAt + marker.length + 1);
        if (fresh) stdout.write(fresh);
      }
      if (res && res.success && line.trim()) session.push(line);
      if (res && !res.success && res.error) stderr.write(String(res.error));
    } catch (e) {
      stderr.write(`perl: ${e.message}\n`);
    }
  }
  updatePrompt();
  recordReplPrompt();
}

// ─── Pager (more/less) ──────────────────────────────────────────

const pagerState = {
  active: false,
  lines: [],
  pos: 0,
  pageSize: 20,
  name: "less",
  search: null,
};

function startPager(lines, filename, name) {
  spinnerStop();  // modal mode takes over the prompt slot
  pagerState.active = true;
  pagerState.lines = lines;
  pagerState.pos = 0;
  pagerState.pageSize = 20;
  pagerState.name = name || "less";
  pagerState.search = null;
  stdout.write(`── ${filename} ──\n`);
  renderPagerPage();
  updatePrompt();
}

function renderPagerPage() {
  const end = Math.min(pagerState.pos + pagerState.pageSize, pagerState.lines.length);
  for (let i = pagerState.pos; i < end; i++) {
    stdout.write(pagerState.lines[i] + "\n");
  }
  // Pager prompt
  const pct = pagerState.lines.length === 0
    ? 100
    : Math.min(100, Math.round((end / pagerState.lines.length) * 100));
  const label = pagerState.name === "more" ? "More" : "Less";
  write(`─${label}─(${pct}%)─ `, "info");
}

function exitPager() {
  pagerState.active = false;
  pagerState.lines = [];
  pagerState.search = null;
  stdout.write("\n");
  updatePrompt();
  writeShellPrompt();
}

async function handlePagerInput(line) {
  const t = line.trim().toLowerCase();

  if (t === "q" || t === "quit" || t === ":q") {
    exitPager();
    return;
  }
  if (t === "" || t === " " || t === "f" || t === "\uf000" || t === "next") {
    // space / enter / f → next page
    pagerState.pos += pagerState.pageSize;
    if (pagerState.pos >= pagerState.lines.length) {
      exitPager();
    } else {
      renderPagerPage();
    }
    return;
  }
  if (t === "b" || t === "prev" || t === "page-up") {
    pagerState.pos = Math.max(0, pagerState.pos - pagerState.pageSize);
    renderPagerPage();
    return;
  }
  if (t === "g" || t === "home") {
    pagerState.pos = 0;
    renderPagerPage();
    return;
  }
  if (t === "g" || t === "end" || t === "$" || t === "100%" || t === "last") {
    pagerState.pos = Math.max(0, pagerState.lines.length - pagerState.pageSize);
    renderPagerPage();
    return;
  }
  if (t.startsWith("/")) {
    // search forward
    const pattern = t.slice(1);
    try {
      const re = new RegExp(pattern, "i");
      for (let i = pagerState.pos + 1; i < pagerState.lines.length; i++) {
        if (re.test(pagerState.lines[i])) {
          pagerState.pos = Math.max(0, i - 5);
          renderPagerPage();
          return;
        }
      }
      stdout.write(`Pattern not found: ${pattern}\n`);
      write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    } catch {
      stdout.write(`Invalid pattern: ${pattern}\n`);
      write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    }
    return;
  }
  if (t === "h" || t === "help" || t === "?") {
    stdout.write("  space/f  next page   b  back page   g  first   G  last\n");
    stdout.write("  /pattern search       q  quit\n");
    write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    return;
  }
  // Default: next page (like more)
  pagerState.pos += pagerState.pageSize;
  if (pagerState.pos >= pagerState.lines.length) {
    exitPager();
  } else {
    renderPagerPage();
  }
}

// ─── Status bar ─────────────────────────────────────────────────

function updateStatusBar() {
  const cwd = fs.view ? fs.view(fs.cwd) : fs.cwd;
  statusContext.textContent = env.USER && env.USER !== "tinysh" ? `${env.USER}:${cwd}` : cwd;

  // REPL mode hint
  if (pagerState.active) {
    statusHint.textContent = "Pager: space/f next · b back · /search · q quit";
    return;
  }
  if (replState.active) {
    statusHint.textContent = replState.mode === "perl"
      ? "Perl REPL · exit or Ctrl-D to leave"
      : "Python REPL · exit() or Ctrl-D to leave";
    return;
  }

  // Context-sensitive hints
  if (env.USER && env.USER !== "tinysh") {
    statusHint.textContent = "running as " + env.USER + " (su) — 'su tinysh' returns";
    return;
  }
  if (cwd.startsWith("/github") || cwd.startsWith("/mount/github")) {
    statusHint.textContent = "Browse any GitHub repo. 'browse' opens in tab.";
  } else if (cwd.startsWith("/gitlab") || cwd.startsWith("/mount/gitlab")) {
    statusHint.textContent = "Browse any GitLab project. 'browse' opens in tab.";
  } else if (cwd.startsWith("/git") || cwd.startsWith("/mount/git")) {
    statusHint.textContent = "Any git repo as a filesystem (real git protocol). 'browse' opens it.";
  } else if (cwd.startsWith("/http")) {
    statusHint.textContent = "CORS-enabled fetch. Public CDNs and APIs only. 'browse' opens URL.";
  } else if (cwd.startsWith("/dev")) {
    statusHint.textContent = "Browser devices: info, cpu, webgl, camera, audio, clipboard...";
  } else if (cwd.startsWith("/tmp")) {
    statusHint.textContent = "Ephemeral — lost on reload.";
  } else if (cwd.startsWith("/home")) {
    statusHint.textContent = "Persistent storage (localStorage). edit: text editor.";
  } else if (cwd.startsWith("/bin") || cwd.startsWith("/usr/bin") || cwd.startsWith("/commands")) {
    statusHint.textContent = "Executable commands. .js (in /bin/) and .wasm (in /usr/bin/) files.";
  } else if (cwd.startsWith("/mount")) {
    statusHint.textContent = "Mounted filesystems. ls /mount/github/ for repos.";
  } else {
    statusHint.textContent = "Type inline on the prompt · Tab: complete · Ctrl+L: clear · Ctrl+C: interrupt · ↑/↓: history";
  }
}

// ─── Inline line editing ────────────────────────────────────────
// The prompt, the typed line and the blinking block cursor all live in
// #prompt-line, the last child of the terminal — exactly like a real
// shell, where you type directly on the prompt line in the scrollback.
// A hidden input element captures keystrokes (and opens the soft
// keyboard on mobile); every key updates currentLine/cursorPos and
// re-renders the line.

// Record a plain character appended at the end of the line (the common
// case) so asciinema playback shows progressive typing.
function recordTypedChar(ch) {
  if (recording.active) recordOutput(ch);
}

// Record a full-line redraw (backspace mid-line, completion, history,
// cursor moves...) — \r back to column 0, the prompt + line, then erase
// to end of line, exactly what a real terminal would emit.
function recordLineRedraw() {
  if (recording.active) recordOutput("\r" + sgrWrap(getPromptStr(), "prompt") + currentLine + "\x1b[K");
}

// Record the REPL prompt when it is drawn (">>> "/"... ").
function recordReplPrompt() {
  if (recording.active) recordOutput(sgrWrap(getPromptStr(), "prompt"));
}

// Insert a character at the cursor position and re-render.
function insertChar(ch) {
  if (cursorPos === currentLine.length) {
    currentLine += ch;
    cursorPos++;
    recordTypedChar(ch);
  } else {
    currentLine = currentLine.slice(0, cursorPos) + ch + currentLine.slice(cursorPos);
    cursorPos++;
    recordLineRedraw();
  }
  renderInput();
}

function updatePrompt() {
  renderInput();
  updateStatusBar();
}

async function onCommand() {
  const line = currentLine;
  // Move the committed line into the scrollback: prompt + text + newline.
  // Recording happens piecewise (prompt when drawn, chars as typed, the
  // newline here), so the echo itself must not double-record.
  write(`${getPromptStr()}${line}\n`, "prompt", { record: false });
  recordOutput("\r\n");
  currentLine = "";
  cursorPos = 0;
  renderInput();

  // Pager mode: input is a pager key
  if (pagerState.active) {
    await handlePagerInput(line);
    input.focus();
    return;
  }

  // Reactor REPL (python / perl): run the line, keep state, re-prompt.
  if (replState.active) {
    await runReplLine(line);
    input.focus();
    return;
  }

  addHistory(line);

  // Slow commands (ls /github/..., remote reads) get a spinner where
  // the next prompt will be; the prompt itself is only drawn after the
  // command's output has been printed.
  spinnerStart(line.trim());
  await runInterruptible(handleLine(line));
  spinnerStop();
  // Print the next prompt line so it's clear the command finished.
  // Modal modes (pager/REPL) manage their own prompts.
  if (!pagerState.active && !replState.active) {
    writeShellPrompt();
  }
  input.focus();
  lastMatches = [];
}

// Clicking the terminal (or anywhere outside the editor) focuses the
// hidden input, so keys keep flowing and mobile keyboards open. This must
// be on click, not pointerdown: the browser's default mousedown action
// blurs the previously focused element when the click target isn't
// focusable, which would undo an earlier focus() and swallow typing.
// (Drags never produce a click — those are covered by the dragend/drop
// refocus handlers below.)
//
// But focusing a real <input> clears the document selection, so a click
// that just made a text selection must NOT refocus — otherwise you could
// never select-and-copy terminal output.
let justSelected = false;
document.addEventListener("mousedown", (e) => {
  if (e.target.closest("#editor-container") || e.target.closest(".xterm-window") || e.target.closest(".screen-root")) return;
  justSelected = false;
  // Drop stale selections so they can't block the next click's focus.
  const sel = window.getSelection();
  if (sel && sel.rangeCount) sel.removeAllRanges();
});
document.addEventListener("mouseup", (e) => {
  if (e.target.closest("#editor-container") || e.target.closest(".xterm-window") || e.target.closest(".screen-root")) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) justSelected = true;
});
document.addEventListener("click", (e) => {
  if (e.target.closest("#editor-container") || e.target.closest(".xterm-window") || e.target.closest(".screen-root")) return;
  if (justSelected) return;  // user selected text — keep it
  input.focus();
});

// Ctrl/Cmd+C with a text selection copies it, like a real terminal:
// the browser's native copy does the work (no preventDefault), then we
// deselect and hand focus to the hidden input so Ctrl+V pastes
// straight into the line — no manual deselect step in between. The
// event is stopped so the shell's own Ctrl+C (interrupt) handler never
// sees it. Without a selection this handler does nothing and Ctrl+C
// stays interrupt.
document.addEventListener("keydown", (e) => {
  if (!((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C"))) return;
  if (e.target && e.target.closest &&
      (e.target.closest("#editor-container") || e.target.closest(".xterm-window"))) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString()) return;
  e.stopPropagation();  // let the copy happen, keep interrupt out
  setTimeout(() => {
    sel.removeAllRanges();  // deselect
    justSelected = false;
    input.focus();          // so Ctrl+V lands in the line
  }, 0);
}, true);

// Ctrl/Cmd+C in the editor copies the selection. Vim mode maps Ctrl+C to
// ESC, so without this "select with the mouse, Ctrl+C to copy" can't
// work. No preventDefault: vim still gets its ESC when the key falls
// through, and with no selection Ctrl+C stays plain vim ESC.
editorContainer.addEventListener("keydown", (e) => {
  if (!((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C"))) return;
  if (!cm || !cm.getSelection()) return;
  copyTextToClipboard(cm.getSelection());
}, true);

function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
    return;
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;pointer-events:none;";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  } catch {}
}

// Typing while a mouse selection exists clears the selection and types
// normally. After a selection the hidden input deliberately isn't focused
// (so the selection survives), which means a printable key would otherwise
// vanish into the page — route it into the shell line instead.
document.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length !== 1) return;  // printable characters only
  if (e.target && e.target.closest && (e.target.closest("#editor-container") || e.target.closest(".xterm-window") || e.target.closest(".screen-root"))) return;
  if (document.activeElement === input) return;  // normal typing path
  e.preventDefault();
  const sel = window.getSelection();
  if (sel && sel.rangeCount) sel.removeAllRanges();
  input.focus();
  insertChar(e.key);
});

// ─── Drag & drop: copy files into ~/uploads ─────────────────────
// Dropping a file on the terminal writes it into $HOME/uploads (like
// scp'ing it in) and reports the destination in the status bar. /home is
// localStorage (~5MB) — big files get a hint to use /big/ (IndexedDB).
term.addEventListener("dragover", (e) => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
});
term.addEventListener("drop", async (e) => {
  e.preventDefault();
  const files = [...(e.dataTransfer ? e.dataTransfer.files : [])];
  if (files.length === 0) {
    input.focus();  // text drag, not files — just give focus back
    return;
  }
  const destDir = (env.HOME || "/home").replace(/\/+$/, "") + "/uploads";
  let uploaded = [];
  for (const file of files) {
    try {
      await fs.writeBlob(destDir + "/" + file.name, file);
      uploaded.push(file.name);
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      const big = /quota/i.test(msg) || (err && err.name === "QuotaExceededError");
      stderr.write(`upload: ${file.name}: ${msg}${big ? " — ~/uploads is localStorage (~5MB), try /big/ for large files" : ""}\n`);
    }
  }
  if (uploaded.length > 0) {
    const one = uploaded.length === 1 ? uploaded[0] : `${uploaded.length} files`;
    write(`Uploaded ${one} → ${destDir}/\n`, "info");
    statusHint.textContent =
      uploaded.length === 1 ? `uploaded to ~/uploads/${uploaded[0]}`
                            : `uploaded ${uploaded.length} files to ~/uploads/`;
  }
  input.focus();
});

// Starting a drag (of text or files) steals focus from the hidden input,
// and the term drop handler only runs when the drop lands on us — so
// after any drag that ends elsewhere (dropped on the page, cancelled,
// released outside), give focus back or typing silently goes nowhere.
const refocusAfterDrag = () => {
  if (editorContainer.classList.contains("active")) return;  // editor owns focus
  if (document.querySelector(".screen-root")) return;      // screen mode owns focus
  input.focus();
};
document.addEventListener("dragend", refocusAfterDrag);
document.addEventListener("drop", (e) => {
  if (e.target.closest("#editor-container") || e.target.closest(".xterm-window") || e.target.closest(".screen-root")) return;  // editor owns focus
  refocusAfterDrag();
});

// IME composition / pasting lands in the hidden input (those key events
// can't be intercepted) — take its value into the inline line.
input.addEventListener("input", () => {
  if (!input.value) return;
  currentLine = currentLine.slice(0, cursorPos) + input.value + currentLine.slice(cursorPos);
  cursorPos += input.value.length;
  input.value = "";
  renderInput();
  recordLineRedraw();
});

// Ctrl-V / Shift-Insert paste, read straight off the clipboard event so
// it works even when the browser wouldn't echo the text into the hidden
// input. If clipboardData is empty (iOS quirks) we don't preventDefault
// and the input-event path above takes over.
input.addEventListener("paste", (e) => {
  const text = e.clipboardData && e.clipboardData.getData("text/plain");
  if (!text) return;
  e.preventDefault();
  currentLine = currentLine.slice(0, cursorPos) + text + currentLine.slice(cursorPos);
  cursorPos += text.length;
  renderInput();
  recordLineRedraw();  // one redraw in the cast, like a real terminal paste
});

// Focus/blur tracking: the block cursor blinks only while the shell
// is focused, like a real terminal's focus cursor.
input.addEventListener("focus", () => term.classList.add("focused"));
input.addEventListener("blur", () => term.classList.remove("focused"));

input.addEventListener("keydown", async (e) => {
  if (e.isComposing) return;  // let the input event handle IME text

  // Printable characters (including space) insert at the cursor.
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    insertChar(e.key);
    return;
  }

  if (e.key === "Enter") {
    e.preventDefault();
    await onCommand();
    return;
  }

  if (e.key === "Backspace") {
    e.preventDefault();
    if (cursorPos === 0) return;
    currentLine = currentLine.slice(0, cursorPos - 1) + currentLine.slice(cursorPos);
    cursorPos--;
    if (cursorPos === currentLine.length) {
      if (recording.active) recordOutput("\x08");  // plain backspace at end
    } else {
      recordLineRedraw();
    }
    renderInput();
    return;
  }

  if (e.key === "Delete") {
    e.preventDefault();
    if (cursorPos >= currentLine.length) return;
    currentLine = currentLine.slice(0, cursorPos) + currentLine.slice(cursorPos + 1);
    recordLineRedraw();
    renderInput();
    return;
  }

  // Arrow keys move the cursor; Home/End jump to line start/end.
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (cursorPos > 0) { cursorPos--; if (recording.active) recordOutput("\x1b[D"); renderInput(); }
    return;
  }
  if (e.key === "ArrowRight") {
    e.preventDefault();
    if (cursorPos < currentLine.length) { cursorPos++; if (recording.active) recordOutput("\x1b[C"); renderInput(); }
    return;
  }
  if (e.key === "Home") {
    e.preventDefault();
    cursorPos = 0;
    renderInput();
    recordLineRedraw();
    return;
  }
  if (e.key === "End") {
    e.preventDefault();
    cursorPos = currentLine.length;
    renderInput();
    recordLineRedraw();
    return;
  }

  // Ctrl+A / Ctrl+E — start/end of line (readline bindings)
  if (e.ctrlKey && e.key === "a") {
    e.preventDefault();
    cursorPos = 0;
    renderInput();
    recordLineRedraw();
    return;
  }
  if (e.ctrlKey && e.key === "e") {
    e.preventDefault();
    cursorPos = currentLine.length;
    renderInput();
    recordLineRedraw();
    return;
  }

  // Ctrl+U — kill text before the cursor; Ctrl+K — kill after
  if (e.ctrlKey && e.key === "u") {
    e.preventDefault();
    currentLine = currentLine.slice(cursorPos);
    cursorPos = 0;
    renderInput();
    recordLineRedraw();
    return;
  }
  if (e.ctrlKey && e.key === "k") {
    e.preventDefault();
    currentLine = currentLine.slice(0, cursorPos);
    renderInput();
    recordLineRedraw();
    return;
  }

  // Ctrl+W — kill the word before the cursor
  if (e.ctrlKey && e.key === "w") {
    e.preventDefault();
    const before = currentLine.slice(0, cursorPos);
    const m = before.match(/\S+\s*$/);
    if (m) {
      const cut = before.length - m[0].length;
      currentLine = currentLine.slice(0, cut) + currentLine.slice(cursorPos);
      cursorPos = cut;
      renderInput();
      recordLineRedraw();
    }
    return;
  }

  // Tab completion
  if (e.key === "Tab") {
    e.preventDefault();
    const now = Date.now();
    const isDoubleTab = (now - lastTabPress < 500) && lastPrefix === currentLine;
    lastTabPress = now;

    const result = await complete(currentLine, cursorPos);
    if (result.matches && result.matches.length > 0 && isDoubleTab) {
      // Double-tab: show all matches
      write("\n" + result.matches.join("  ") + "\n", "info");
      currentLine = result.line;
      cursorPos = result.cursorPos;
      renderInput();
      recordLineRedraw();
    } else if (result.line !== currentLine) {
      currentLine = result.line;
      cursorPos = result.cursorPos;
      renderInput();
      lastPrefix = result.line;
      lastMatches = result.matches || [];
      recordLineRedraw();
    } else if (result.matches && result.matches.length > 1) {
      // Single tab with multiple matches: show them
      write("\n" + result.matches.join("  ") + "\n", "info");
      renderInput();
      lastPrefix = currentLine;
      recordLineRedraw();
    }
    return;
  }

  // Ctrl+C — interrupt the running command / cancel the current line
  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    e.preventDefault();
    handleInterrupt();
    return;
  }

  // Ctrl+D — exit REPL (EOF)
  if (e.ctrlKey && e.key === "d" && replState.active) {
    e.preventDefault();
    exitRepl();
    return;
  }

  // Ctrl+L — clear (keeps scrollback, like `clear`)
  if ((e.ctrlKey || e.metaKey) && e.key === "l") {
    e.preventDefault();
    clearViewport();
    renderInput();  // redraw the prompt line (current line is kept)
    return;
  }

  // Up/Down — history
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (replState.active) {
      if (replState.histIdx > 0) {
        replState.histIdx--;
        currentLine = replState.history[replState.histIdx];
        cursorPos = currentLine.length;
        renderInput();
        recordLineRedraw();
      }
      return;
    }
    if (historyIndex > 0) {
      historyIndex--;
      currentLine = history[historyIndex];
      cursorPos = currentLine.length;
      renderInput();
      recordLineRedraw();
    }
    return;
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (replState.active) {
      if (replState.histIdx < replState.history.length) {
        replState.histIdx++;
        currentLine = replState.histIdx === replState.history.length
          ? ""
          : replState.history[replState.histIdx];
        cursorPos = currentLine.length;
        renderInput();
        recordLineRedraw();
      }
      return;
    }
    if (historyIndex < history.length - 1) {
      historyIndex++;
      currentLine = history[historyIndex];
      cursorPos = currentLine.length;
      renderInput();
      recordLineRedraw();
    } else {
      historyIndex = history.length;
      currentLine = "";
      cursorPos = 0;
      renderInput();
      recordLineRedraw();
    }
    return;
  }

  lastMatches = [];
});

// ─── Welcome ────────────────────────────────────────────────────

// ─── Init ──────────────────────────────────────────────────────

(async () => {
  updateTermSize();
  // Welcome row: motd text in the left column, the xkcd comic to its
  // right when the terminal is wide enough (flex-wrap puts the comic
  // below the motd otherwise).
  const welcomeRow = document.createElement("div");
  welcomeRow.id = "welcome-row";
  welcomeText = document.createElement("div");
  welcomeText.id = "welcome-text";
  const welcomeXkcd = document.createElement("div");
  welcomeXkcd.id = "welcome-xkcd";
  welcomeRow.append(welcomeText, welcomeXkcd);
  term.insertBefore(welcomeRow, promptLine);
  write("╔══════════════════════════════════════╗\n", "info");
  write("║ j.cmd — A JavaScript Command Line OS ║\n", "info");
  write("║     JavaScript is the binary format  ║\n", "info");
  write("╚══════════════════════════════════════╝\n", "info");
  write("Type 'help' for available commands.\n\n", "info");
  write("Features: Tab completion · Ctrl+L clear · Ctrl+C copy/interrupt · Up/Down history\n", "info");
  write("          edit <file> — built-in text editor\n", "info");
  write("          vi <file> — vim-style editor (hjkl, :wq)\n", "info");
  write("          nano/emacs → edit · less/more → cat · cls → clear\n", "info");
  write("          ls /dev/ · cat /dev/info · cat /dev/cpu\n", "info");
  write("          cat image.png · play music.mp3\n", "info");
  write("          su — switch user (su → nobody · su tinysh/root → back) · whoami\n", "info");
  write("          chmod 600 file · chmod 755 dir — permissions (owner only)\n", "info");
  write("          browse /github/user/repo — open in tab\n", "info");
  write("          mail to@x.com — compose email in a new tab (mailto:)\n", "info");
  write("          screen — split the terminal into panes (+ split · x close · q exit)\n", "info");
  write("          xterm — floating terminal · arecord -d 5 rec.wav — record the mic\n", "info");
  write("          youtube · reddit · slashdot · lwn · hn — open sites in a tab (args search)\n", "info");
  write("          fun: cowsay moo · figlet -f impact -b hi · fortune · sl · cmatrix\n", "info");
  write("          python · perl · lua — interpreters (reactor-based, no wasm/worker)\n", "info");
  write("          history — persisted across refreshes\n", "info");
  write("          asciinema rec demo.cast · stop · play — record sessions\n", "info");
  write("          cp file /pc — download · cp /pc/file — upload\n", "info");
  write("          /big/ — IndexedDB storage (no 5MB limit)\n\n", "info");
  write("          echo $HOME · $PATH · $USER — environment variables\n\n", "info");
  welcomeText = null;  // banner done — writes go back to the terminal

  // xkcd comic of the day — a clickable image (xkcd.now.sh is a CORS
  // proxy for the official xkcd JSON API). Fetched lazily so a slow or
  // down proxy never delays the shell; skipped silently on failure.
  // The image itself is loaded defensively: imgs.xkcd.com is sometimes
  // blocked by networks/ad-blockers, so we try (1) fetch → object URL
  // (same CORS path as the JSON fetch above, which already works),
  // (2) the direct URL, (3) the images.weserv.nl proxy — and if all
  // fail, drop the img and keep the text link (never a broken icon).
  fetch("https://xkcd.now.sh/?comic=latest")
    .then((r) => r.json())
    .then((c) => {
      if (!c || !c.img) return;
      const a = document.createElement("a");
      a.href = "https://xkcd.com/" + c.num + "/";
      a.target = "_blank";
      a.rel = "noopener";
      a.style.textDecoration = "none";
      const img = document.createElement("img");
      img.alt = c.title;
      img.style.cssText = "display:block;margin:2px 0;border-radius:4px;";
      const fallbacks = [
        c.img,
        "https://images.weserv.nl/?url=" + encodeURIComponent(c.img),
      ];
      let fi = 0;
      const nextSource = () => {
        if (fi < fallbacks.length) {
          img.src = fallbacks[fi++];
        } else if (img.parentNode) {
          img.parentNode.removeChild(img);  // text link remains
        }
      };
      img.onerror = nextSource;
      fetch(c.img)
        .then((r) => (r.ok ? r.blob() : null))
        .then((b) => {
          if (b) {
            img.src = URL.createObjectURL(b);
            setTimeout(() => { try { URL.revokeObjectURL(img.src); } catch (e) {} }, 60000);
          } else {
            nextSource();
          }
        })
        .catch(() => nextSource());
      const cap = document.createElement("div");
      cap.style.cssText = "color:#8b949e;font-size:12px;margin:0 0 8px;";
      cap.textContent = "xkcd #" + c.num + " — " + c.title + " (click to open)";
      a.appendChild(img);
      a.appendChild(cap);
      welcomeXkcd.appendChild(a);  // right of the motd, or below if narrow
      term.scrollTop = term.scrollHeight;
    })
    .catch(() => {});

  // Read ~/.tinyshrc (persistent config in /home/) before the shell
  // is usable — exports, banner, aliases etc. take effect immediately.
  await loadConfig();
  writeShellPrompt();  // initial prompt line in the scrollback
  input.focus();
})();
</script>
