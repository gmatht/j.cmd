<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tinysh — browser shell</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  #terminal {
    flex: 1;
    min-height: 0;  /* allow shrink so flex layout works */
    padding: 16px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* ─── Status bar ──────────────────────────────────── */
  #status-bar {
    display: flex;
    flex-wrap: wrap;
    padding: 2px 16px;
    background: #0d1117;
    color: #8b949e;

    border-top: 1px solid #21262d;
    gap: 4px 16px;
    flex-shrink: 0;
  }
  #status-hint { flex: 1; min-width: 0; }
  #status-context { color: #7ec8e3; }
  
  #input-line {
    display: flex;
    padding: 4px 16px 16px;
    background: #1a1a2e;
    flex-shrink: 0;
  }
  
  #prompt {
    color: #7ec8e3; white-space: pre;
    padding: 4px 0;
    flex-shrink: 0;
  }
  
  #input {
    flex: 1;
    background: #16213e;
    border: 1px solid #2a2a4a;
    color: #e0e0e0;

    padding: 4px 8px;
    outline: none;
    border-radius: 4px;
  }
  #input:focus { border-color: #7ec8e3; }

  /* ─── Editor mode ─────────────────────────────────── */
  #editor-container {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 48px;
    background: #0d1117;
    z-index: 10;
  }
  #editor-container.active {
    display: flex;
    flex-direction: column;
  }
  #editor-header {
    background: #161b22;
    padding: 8px 16px;
    color: #8b949e;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #30363d;
  }
  #editor-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .CodeMirror {
    height: 100% !important;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  .cm-s-monokai .CodeMirror-cursor {
    border-color: #7ec8e3;
  }
  /* Vim command line — pin to bottom like real vim, not top */
  .CodeMirror-dialog {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #161b22;
    color: #e0e0e0;
    border-top: 1px solid #30363d;
    padding: 4px 8px;
    z-index: 15;
  }
  .CodeMirror-dialog input {
    border: none;
    background: transparent;
    color: #7ec8e3;
    outline: none;
    font-family: inherit;
    width: 90%;
  }
  .out { color: #a0d6a0; }
  .err { color: #d6a0a0; }
  .info { color: #7ec8e3; }
  .prompt { color: #7ec8e3; }
  .dir { color: #7ec8e3; }
  .file { color: #e0e0e0; }
</style>
</head>
<body>

<div id="terminal"></div>

<div id="status-bar">
  <span id="status-context">/home</span>
  <span id="status-hint">Tab: complete · Ctrl+L: clear · edit: text editor</span>
</div>

<div id="editor-container">
  <div id="editor-header">
    <span id="editor-filename">untitled</span>
    <span>Ctrl+S save · Esc cancel</span>
  </div>
  <div id="editor-body">
    <textarea id="editor-textarea" spellcheck="false"></textarea>
  </div>
</div>

<div id="input-line">
  <span id="prompt"></span>
  <input id="input" type="text" autofocus spellcheck="false" autocomplete="off" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/keymap/vim.min.js"></script>
<!-- pako (zlib): git object inflation for GitFS (served from node_modules by serve.py) -->
<script src="../node_modules/pako/dist/pako_inflate.min.js"></script>
<!-- Bare-specifier resolution for the WASM runtime packages (served from node_modules by serve.py) -->
<script type="importmap">
{
  "imports": {
    "@wasmer/wasi": "/node_modules/@wasmer/wasi/dist/Library.esm.js",
    "@wasmer/wasmfs": "/node_modules/@wasmer/wasmfs/lib/index.esm.js"
  }
}
</script>
<script type="module">
import { fs } from "../src/fs/index.js";
import { WasmRunner } from "../src/wasm.js";
import { WasmerRegistry } from "../src/wasmer.js";
import { env, expandRef } from "../src/env.js";
import { watToWasm } from "../src/wabt-loader.js";
import { bashToJS, runBash } from "../src/bash2js.js";
const wasmRunner = new WasmRunner(fs);
const wasmerReg = new WasmerRegistry(fs);

// Pipe input for the current command — the previous pipeline segment's
// captured stdout. Builtins that read stdin (head, ...) consume this.
let stdinBuffer = "";

// ─── Terminal Output ───────────────────────────────────────────

const term = document.getElementById("terminal");
const input = document.getElementById("input");
const promptEl = document.getElementById("prompt");
const statusContext = document.getElementById("status-context");
const statusHint = document.getElementById("status-hint");

function write(text, cls = "out") {
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = text;
  term.appendChild(span);
  term.scrollTop = term.scrollHeight;
}

function clearViewport() {
  // Erase only the visible viewport, keeping the scrollback (lines the
  // user has scrolled above) intact — like a real terminal's `clear`,
  // which blanks the screen but leaves saved lines reachable by
  // scrolling up (unlike `reset`, which wipes scrollback too).
  const children = Array.from(term.children);
  if (children.length === 0) return;

  const top = term.scrollTop;
  const bottom = top + term.clientHeight;

  // Find the first/last line intersecting the viewport. A line that
  // only peeks into the viewport is erased whole, just as a real
  // terminal erases entire rows.
  let y = 0;
  let first = -1;
  let last = -1;
  for (let i = 0; i < children.length; i++) {
    const h = children[i].offsetHeight;
    if (y + h > top && y < bottom) {
      if (first === -1) first = i;
      last = i;
    }
    y += h;
    if (y >= bottom && first !== -1) break;
  }
  if (first === -1) return;

  // Remove the visible lines (newest first so indices stay valid).
  for (let i = last; i >= first; i--) {
    children[i].remove();
  }

  // Pad below the scrollback with a blank area so the bottom of the
  // terminal looks empty; scroll up to reach the preserved history.
  const spacer = document.createElement("div");
  spacer.style.height = term.clientHeight + "px";
  term.appendChild(spacer);
  term.scrollTop = term.scrollHeight;
}

const stdout = { write: (s) => write(s, "out") };
const stderr = { write: (s) => write(s, "err") };

// ─── Text Editor ───────────────────────────────────────────────

const editorContainer = document.getElementById("editor-container");
const editorTextarea = document.getElementById("editor-textarea");
const editorFilename = document.getElementById("editor-filename");

let editorFilepath = null;
let editorCallback = null;
let cm = null;

function openEditor(filepath, initialContent, onSave) {
  editorFilepath = filepath;
  editorCallback = onSave;
  editorFilename.textContent = `Editing: ${filepath}`;
  editorContainer.classList.add("active");
  input.disabled = true;

  // Initialize CodeMirror on the textarea
  cm = CodeMirror.fromTextArea(editorTextarea, {
    value: initialContent,
    mode: "text/plain",
    theme: "monokai",
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
    extraKeys: {
      "Ctrl-S": () => closeEditor(true),
      "Cmd-S": () => closeEditor(true),
      "Esc": () => {
        const val = cm.getValue();
        if (val !== "") {
          if (confirm("Discard unsaved changes?")) closeEditor(false);
        } else {
          closeEditor(false);
        }
      }
    }
  });
  cm.setValue(initialContent);
  cm.focus();
  cm.setCursor(0, 0);
}

function closeEditor(save) {
  const doClose = () => {
    // Destroy CodeMirror and restore the textarea
    if (cm) {
      cm.toTextArea();
      cm = null;
    }
    editorContainer.classList.remove("active");
    input.disabled = false;
    editorFilepath = null;
    editorCallback = null;
    write(`[editor closed] ${save ? "saved" : "cancelled"}\n`, "info");
    input.focus();
  };

  if (save && editorCallback) {
    const content = cm.getValue();
    Promise.resolve(editorCallback(content))
      .then(doClose)
      .catch((e) => {
        stderr.write(`write failed: ${editorFilepath}: ${e.message}\n`);
      });
  } else {
    doClose();
  }
}

// ─── Vi-like editor (CodeMirror vim keymap) ─────────────────────

let viState = {
  filepath: null,
  callback: null,
  mode: "normal",
  dirty: false,
};

function updateViModeDisplay() {
  const modeLabel = document.getElementById("editor-mode");
  if (modeLabel) {
    modeLabel.textContent = viState.mode.toUpperCase();
    modeLabel.style.color = viState.mode === "insert" ? "#a0d6a0" : "#7ec8e3";
  }
}

function openViEditor(filepath, initialContent, onSave) {
  viState.filepath = filepath;
  viState.callback = onSave;
  viState.mode = "normal";
  viState.dirty = false;

  editorFilename.textContent = `Editing: ${filepath}`;
  editorContainer.classList.add("active");
  input.disabled = true;

  // Ensure the mode indicator element exists in the header
  const headerRight = document.querySelector("#editor-header span:last-child");
  if (headerRight) {
    headerRight.textContent = "";
    const mode = document.createElement("span");
    mode.id = "editor-mode";
    mode.textContent = "NORMAL";
    mode.style.marginLeft = "12px";
    mode.style.fontWeight = "bold";
    mode.style.color = "#7ec8e3";
    headerRight.appendChild(mode);
  }

  cm = CodeMirror.fromTextArea(editorTextarea, {
    value: initialContent,
    mode: "text/plain",
    theme: "monokai",
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
    keyMap: "vim",
  });

  // Track mode changes
  cm.on("vim-mode-change", (m) => {
    viState.mode = m.mode || "normal";
    updateViModeDisplay();
  });

  // Track dirty state — ignore the initial setValue (it's not a user edit)
  cm.on("change", (cm2, change) => {
    if (change.origin !== "setValue") viState.dirty = true;
  });

  cm.setValue(initialContent);
  cm.focus();
  cm.setCursor(0, 0);
  updateViModeDisplay();
}

async function saveViFile() {
  const content = cm.getValue();
  try {
    if (viState.callback) {
      await viState.callback(content);
    }
    viState.dirty = false;
    write(`[saved] ${viState.filepath}\n`, "info");
  } catch (e) {
    stderr.write(`write failed: ${viState.filepath}: ${e.message}\n`);
  }
}

function closeViEditor() {
  if (cm) cm.toTextArea();
  cm = null;
  editorContainer.classList.remove("active");
  input.disabled = false;
  const filepath = viState.filepath;
  viState = { filepath: null, callback: null, mode: "normal", dirty: false };
  write(`[vi closed] ${filepath}\n`, "info");
  input.focus();
}

// Register vim ex commands (:w, :q, :wq, :x, :q!)
function registerViExCommands() {
  if (!CodeMirror.Vim) return;
  const vim = CodeMirror.Vim;

  // defineEx(name, prefix, func) — name must start with prefix.
  vim.defineEx("write", "w", () => saveViFile());
  vim.defineEx("wq", "wq", () => { saveViFile().then(closeViEditor); });
  vim.defineEx("xit", "x", () => { saveViFile().then(closeViEditor); });
  vim.defineEx("quit", "q", (cm2, params) => {
    // :q! is parsed as command 'q' with '!' as an argument — detect it
    // by inspecting the full input string.
    const isForce = params && params.input && params.input.trim().endsWith("!");
    if (viState.dirty && !isForce) {
      write("E37: No write since last change (use :q! to discard)\n", "err");
    } else {
      closeViEditor();
    }
  });
}

// Call after CodeMirror + vim keymap load
registerViExCommands();

// ─── Binary content detection ───────────────────────────────────
// If a text read contains NUL bytes or an unusual ratio of control
// characters, it's binary — don't dump it as garbage.
function looksBinary(text) {
  if (!text || text.length === 0) return false;
  let control = 0;
  const sample = Math.min(text.length, 4096);
  for (let i = 0; i < sample; i++) {
    const c = text.charCodeAt(i);
    // NUL, control chars, or UTF-8 replacement char (0xFFFD = mangled binary)
    if (c === 0 || (c < 32 && c !== 9 && c !== 10 && c !== 13) || c === 0xFFFD) {
      control++;
    }
  }
  return control > sample * 0.10;  // >10% binary-ish chars → binary
}

// ─── Built-in Commands ─────────────────────────────────────────

const builtins = {
  async ls(args) {
    // Parse flags: -l (long format with permissions/size/date)
    let long = false;
    const dirs = [];
    for (const a of args) {
      if (a === "-l" || a === "--long" || a === "-la" || a === "-al") {
        long = true;
      } else if (a.startsWith("-")) {
        stderr.write(`ls: invalid option -- '${a}'\n`);
        return 2;
      } else {
        dirs.push(a);
      }
    }
    if (dirs.length === 0) dirs.push(".");
    let hadError = false;
    for (const dir of dirs) {
      try {
        const output = await fs.formatList(dir, { long });
        if (!output) continue;
        if (dirs.length > 1) stdout.write(`${dir}:\n`);
        stdout.write(output);
      } catch (e) {
        hadError = true;
        stderr.write(`ls: ${dir}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  async cat(args) {
    if (args.length === 0) {
      // No files — read from stdin (pipe input)
      stdout.write(stdinBuffer);
      if (stdinBuffer && !stdinBuffer.endsWith("\n")) stdout.write("\n");
      return 0;
    }
    let hadError = false;
    for (const file of args) {
      const ext = file.split(".").pop().toLowerCase();
      const isImage = ["png", "jpg", "jpeg", "gif", "svg", "webp", "bmp", "ico"].includes(ext);
      const isAudio = ["mp3", "wav", "ogg", "m4a", "flac", "wma"].includes(ext);

      if (isImage || isAudio) {
        try {
          const blob = await fs.readBlob(file);
          // Set a proper MIME type so the browser renders correctly
          const extMime = {
            png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
            gif: "image/gif", svg: "image/svg+xml", webp: "image/webp",
            bmp: "image/bmp", ico: "image/x-icon",
            mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg",
            m4a: "audio/mp4", flac: "audio/flac", wma: "audio/x-ms-wma",
          }[ext];
          const typedBlob = blob.type
            ? blob
            : new Blob([blob], { type: extMime || "application/octet-stream" });
          const url = URL.createObjectURL(typedBlob);
          const el = isImage
            ? `<img src="${url}" style="max-width: 80vw; max-height: 60vh; border-radius: 4px; margin: 4px 0;" />`
            : `<audio controls src="${url}" style="width: 100%; max-width: 400px; margin: 4px 0;"></audio>`;
          const span = document.createElement("span");
          span.innerHTML = el;
          term.appendChild(span);
          term.scrollTop = term.scrollHeight;
          // Revoke blob URL after a delay to free memory
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) {
          hadError = true;
          stderr.write(`cat: ${file}: ${e.message}\n`);
        }
      } else {
        try {
          let content = await fs.read(file);
          // Refuse to dump binary content as text — show a warning instead
          if (looksBinary(content)) {
            stderr.write(`cat: ${file}: binary file (use 'cp ${file} /pc' to download or view via edit)\n`);
            continue;
          }
          stdout.write(content);
          if (!content.endsWith("\n")) stdout.write("\n");
        } catch (e) {
          hadError = true;
          stderr.write(`cat: ${file}: ${e.message}\n`);
        }
      }
    }
    return hadError ? 1 : 0;
  },

  async echo(args) {
    stdout.write(args.join(" ") + "\n");
    return 0;
  },

  async pwd(args) {
    stdout.write(fs.cwd + "\n");
    return 0;
  },

  async true(args) {
    // Always succeeds (exit 0) — handy with `&&`
    return 0;
  },

  async false(args) {
    // Always fails (exit 1) — handy with `||`
    return 1;
  },

  async cd(args) {
    const dir = args[0] || env.HOME;
    try {
      await fs.list(dir);
      fs.cwd = fs._resolve(dir);
      env.PWD = fs.cwd;
      return 0;
    } catch (e) {
      stderr.write(`cd: ${dir}: ${e.message}\n`);
      return 1;
    }
  },

  async export(args) {
    // export [NAME[=VALUE]...] — set environment variables.
    // `export` or `export -p` prints all variables in POSIX form.
    // `export NAME=value` sets NAME to value (split on the first '=');
    // `export NAME` sets NAME to an empty string, like bash.
    // Invalid identifiers are reported and skipped; exit status is 1
    // if any argument was invalid.
    if (args.length === 0 || (args.length === 1 && args[0] === "-p")) {
      for (const key of Object.keys(env).sort()) {
        stdout.write(`export ${key}=${env[key]}\n`);
      }
      return 0;
    }
    let hadError = false;
    for (const arg of args) {
      if (arg === "-p") continue; // harmless to accept alongside assignments
      const eq = arg.indexOf("=");
      const name = eq === -1 ? arg : arg.slice(0, eq);
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        hadError = true;
        stderr.write(`export: '${arg}': not a valid identifier\n`);
        continue;
      }
      env[name] = eq === -1 ? "" : arg.slice(eq + 1);
    }
    return hadError ? 1 : 0;
  },

  async vi(args) {
    if (args.length === 0) { stderr.write("vi: missing filename\n"); return 1; }
    const filepath = args[0];
    let content = "";
    try {
      content = await fs.read(filepath);
    } catch {}
    await new Promise((resolve) => {
      openViEditor(filepath, content, async (newContent) => {
        await fs.write(filepath, newContent);
        resolve();
      });
    });
  },

  async edit(args) {
    if (args.length === 0) { stderr.write("edit: missing filename\n"); return 1; }
    const filepath = args[0];
    let content = "";
    try {
      content = await fs.read(filepath);
    } catch {
      // File doesn't exist — start with empty content
    }
    // Open the editor — it blocks the shell until closed
    await new Promise((resolve) => {
      openEditor(filepath, content, async (newContent) => {
        await fs.write(filepath, newContent);
        resolve();
      });
    });
  },

  async rm(args) {
    if (args.length === 0) { stderr.write("rm: missing operand\n"); return 2; }
    let hadError = false;
    for (const file of args) {
      try {
        await fs.stat(file); // fail on nonexistent paths, like real rm
        await fs.remove(file);
      }
      catch (e) { hadError = true; stderr.write(`rm: ${file}: ${e.message}\n`); }
    }
    return hadError ? 1 : 0;
  },

  async mkdir(args) {
    if (args.length === 0) { stderr.write("mkdir: missing operand\n"); return 2; }
    let hadError = false;
    for (const dir of args) {
      try {
        const r = fs._resolve(dir);
        const parent = fs._resolve(r + "/..");
        // Create the directory by writing a marker
        await fs.write(r + "/.directory", "");
      } catch (e) {
        hadError = true;
        stderr.write(`mkdir: ${dir}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  async cp(args) {
    if (args.length < 2) { stderr.write("cp: missing operand\n"); return 2; }
    const src = args[0];
    let dest = args[1];
    // If dest is a directory (trailing /), a bare mount point like /pc,
    // or the current dir '.' — append the source basename
    const base = src.split("/").pop();
    if (dest.endsWith("/") || dest === "/pc" || dest === "." || dest === "..") {
      dest = dest.endsWith("/") ? dest + base : dest + "/" + base;
    }
    try {
      // Binary-aware copy: use readBlob/writeBlob when the backend supports it
      try {
        const blob = await fs.readBlob(src);
        await fs.writeBlob(dest, blob);
      } catch {
        const content = await fs.read(src);
        await fs.write(dest, content);
      }
      if (dest.startsWith("/pc")) {
        stdout.write(`Downloading: ${dest.split("/").pop()}\n`);
      }
      return 0;
    } catch (e) {
      stderr.write(`cp: ${src}: ${e.message}\n`);
      return 1;
    }
  },

  async mv(args) {
    if (args.length < 2) { stderr.write("mv: missing operand\n"); return 2; }
    try {
      const content = await fs.read(args[0]);
      await fs.write(args[1], content);
      await fs.remove(args[0]);
      return 0;
    } catch (e) {
      stderr.write(`mv: ${args[0]}: ${e.message}\n`);
      return 1;
    }
  },

  async head(args) {
    // head [-n N] [file...] — print the first N lines (default 10).
    // With no file arguments, reads from stdin (i.e. a pipe).
    let count = 10;
    const files = [];
    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "-n" || a === "--lines") {
        count = parseInt(args[i + 1], 10);
        if (isNaN(count)) {
          stderr.write(`head: invalid number of lines: '${args[i + 1]}'\n`);
          return 2;
        }
        i++;
      } else if (/^-\d+$/.test(a)) {
        count = parseInt(a.slice(1), 10);
      } else if (a.startsWith("-")) {
        stderr.write(`head: invalid option -- '${a}'\n`);
        return 2;
      } else {
        files.push(a);
      }
    }
    if (count < 0) count = 0;

    const printLines = (content) => {
      if (content === "") return;
      const lines = content.split("\n");
      if (lines[lines.length - 1] === "") lines.pop(); // drop trailing newline
      if (lines.length === 0) return;
      stdout.write(lines.slice(0, count).join("\n") + "\n");
    };

    if (files.length === 0) {
      printLines(stdinBuffer);
      return 0;
    }
    let hadError = false;
    for (const file of files) {
      try {
        const content = await fs.read(file);
        if (files.length > 1) stdout.write(`==> ${file} <==\n`);
        printLines(content);
      } catch (e) {
        hadError = true;
        stderr.write(`head: ${file}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  async grep(args) {
    // grep [-i] [-n] [-v] [-c] [-l] [-r] [-e PATTERN] [--] PATTERN [FILE...]
    // With no FILE arguments, searches stdin (pipe input).
    let ignoreCase = false, lineNumber = false, invert = false;
    let count = false, filesWithMatches = false, recursive = false;
    let pattern = null, patternExplicit = false;
    const patterns = [];
    const files = [];
    let optsDone = false;

    const shortFlags = {
      i: () => ignoreCase = true,
      n: () => lineNumber = true,
      v: () => invert = true,
      c: () => count = true,
      l: () => filesWithMatches = true,
      r: () => recursive = true,
      R: () => recursive = true,
    };

    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "--" && !optsDone) { optsDone = true; continue; }
      if (!optsDone && (a === "-i" || a === "--ignore-case")) ignoreCase = true;
      else if (!optsDone && (a === "-n" || a === "--line-number")) lineNumber = true;
      else if (!optsDone && (a === "-v" || a === "--invert-match")) invert = true;
      else if (!optsDone && (a === "-c" || a === "--count")) count = true;
      else if (!optsDone && (a === "-l" || a === "--files-with-matches")) filesWithMatches = true;
      else if (!optsDone && (a === "-r" || a === "-R" || a === "--recursive")) recursive = true;
      else if (!optsDone && (a === "-e" || a === "--regexp")) {
        if (i + 1 >= args.length) {
          stderr.write(`grep: option requires an argument -- '${a}'\n`);
          return 2;
        }
        pattern = args[++i];
        patterns.push(pattern);
        patternExplicit = true;
      } else if (!optsDone && a.startsWith("--")) {
        stderr.write(`grep: unrecognized option '${a}'\n`);
        return 2;
      } else if (!optsDone && a.startsWith("-") && a.length > 1) {
        // Bundled short flags, e.g. -in or -cv
        let ok = true;
        for (const ch of a.slice(1)) {
          if (shortFlags[ch]) shortFlags[ch]();
          else { ok = false; break; }
        }
        if (!ok) {
          stderr.write(`grep: invalid option -- '${a}'\n`);
          return 2;
        }
      } else if (!patternExplicit && pattern === null) {
        pattern = a;
        patterns.push(a);
      } else {
        files.push(a);
      }
    }

    if (patterns.length === 0) {
      stderr.write("grep: missing pattern\n");
      return 2;
    }
    // Multiple -e patterns match if ANY of them matches (OR)
    const patternSource = patterns.map(p => `(?:${p})`).join("|");

    let re;
    try {
      re = new RegExp(patternSource, ignoreCase ? "i" : "");
    } catch (e) {
      stderr.write(`grep: invalid regular expression: '${patterns.join("', '")}'\n`);
      return 2;
    }

    // Remote mounts would require crawling the network; refuse that and
    // only grep them when a specific file is named.
    const REMOTE = ["/http/", "/github/", "/mount/github/", "/gitlab/", "/mount/gitlab/", "/git/", "/mount/git/"];
    const isRemote = (p) => REMOTE.some(pre => p === pre.slice(0, -1) || p.startsWith(pre));

    const showLabel = files.length > 1 || recursive;

    const processContent = (content, label) => {
      const lines = content.split("\n");
      if (lines[lines.length - 1] === "") lines.pop(); // drop trailing newline
      const hits = [];
      for (let i = 0; i < lines.length; i++) {
        if (re.test(lines[i]) !== invert) hits.push({ num: i + 1, text: lines[i] });
      }
      if (count) {
        stdout.write((showLabel ? label + ":" : "") + hits.length + "\n");
      } else if (filesWithMatches) {
        if (hits.length > 0) stdout.write(label + "\n");
      } else {
        for (const h of hits) {
          stdout.write(
            (showLabel ? label + ":" : "") +
            (lineNumber ? h.num + ":" : "") +
            h.text + "\n"
          );
        }
      }
      return hits.length;
    };

    if (files.length === 0) {
      const hits = processContent(stdinBuffer, "(standard input)");
      return hits > 0 ? 0 : 1;
    }

    // grep exit status: 0 if any line matched, 1 if none did, 2 on error
    let hadError = false;
    let anyHits = 0;

    // Recursively collect files under a directory
    const walk = async (dir) => {
      if (isRemote(dir)) {
        hadError = true;
        stderr.write(`grep: skipping remote mount ${dir} (name specific files to search them)\n`);
        return;
      }
      let entries;
      try { entries = await fs.list(dir); } catch (e) {
        hadError = true;
        stderr.write(`grep: ${dir}: ${e.message}\n`);
        return;
      }
      for (const entry of entries) {
        const clean = entry.replace(/\/$/, "");
        const full = (dir === "/" ? "/" : dir + "/") + clean;
        let st;
        try { st = await fs.stat(full); } catch { continue; }
        if (st.type === "dir") await walk(full);
        else {
          try {
            const content = await fs.read(full);
            anyHits += processContent(content, full);
          } catch (e) {
            hadError = true;
            stderr.write(`grep: ${full}: ${e.message}\n`);
          }
        }
      }
    };

    const seen = new Set();
    for (const file of files) {
      const r = fs._resolve(file);
      if (seen.has(r)) continue;
      seen.add(r);
      if (recursive && isRemote(r)) {
        hadError = true;
        stderr.write(`grep: skipping remote mount ${r} (name specific files to search them)\n`);
        continue;
      }
      try {
        const st = await fs.stat(file);
        if (st.type === "dir") {
          if (recursive) await walk(r);
          else {
            hadError = true;
            stderr.write(`grep: ${file}: Is a directory\n`);
          }
          continue;
        }
        const content = await fs.read(file);
        anyHits += processContent(content, r);
      } catch (e) {
        hadError = true;
        stderr.write(`grep: ${file}: ${e.message}\n`);
      }
    }
    if (hadError) return 2;
    return anyHits > 0 ? 0 : 1;
  },

  async find(args) {
    // find [path...] [expression]
    //   -name PATTERN    match basename, * and ? wildcards (repeatable, AND)
    //   -iname PATTERN   case-insensitive -name
    //   -type f|d        match files or directories
    //   -maxdepth N      descend at most N levels below the start points
    //   -mindepth N      don't apply tests above level N (default 0)
    //   -print           print matching paths (default action)
    const paths = [];
    const namePatterns = [];      // { re } — all must match (AND)
    const types = new Set();
    let maxDepth = Infinity, minDepth = 0;
    let print = true;

    // Remote mounts would require crawling the network; refuse that and
    // only match them when a specific file is named.
    const REMOTE = ["/http/", "/github/", "/mount/github/", "/gitlab/", "/mount/gitlab/", "/git/", "/mount/git/"];
    const isRemote = (p) => REMOTE.some(pre => p === pre.slice(0, -1) || p.startsWith(pre));

    // Build a regex from a shell glob (* and ? wildcards)
    const globToRe = (glob, caseInsensitive) => {
      let reStr = "";
      for (const ch of glob) {
        if (ch === "*") reStr += ".*";
        else if (ch === "?") reStr += ".";
        else reStr += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      return new RegExp("^" + reStr + "$", caseInsensitive ? "i" : "");
    };

    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "-name" || a === "-iname") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '${a}'\n`);
          return;
        }
        namePatterns.push({ re: globToRe(args[++i], a === "-iname") });
      } else if (a === "-type") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '-type'\n`);
          return;
        }
        const t = args[++i];
        if (t !== "f" && t !== "d") {
          stderr.write(`find: unknown type '${t}' (use 'f' for file or 'd' for directory)\n`);
          return;
        }
        types.add(t);
      } else if (a === "-maxdepth" || a === "-mindepth") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '${a}'\n`);
          return;
        }
        const n = parseInt(args[++i], 10);
        if (isNaN(n) || n < 0) {
          stderr.write(`find: invalid depth '${args[i]}'\n`);
          return;
        }
        if (a === "-maxdepth") maxDepth = n;
        else minDepth = n;
      } else if (a === "-print") {
        print = true;
      } else if (a === "--") {
        // Everything after -- is a start path
        for (const rest of args.slice(i + 1)) paths.push(rest);
        break;
      } else if (a.startsWith("-")) {
        stderr.write(`find: unknown option '${a}'\n`);
        return;
      } else {
        paths.push(a);
      }
    }

    if (paths.length === 0) paths.push(".");

    // Do tests apply at this depth? (-mindepth/-maxdepth gate traversal
    // too, so we never descend past -maxdepth)
    const matched = (name, type, depth) => {
      if (depth < minDepth) return false;
      if (types.size > 0 && !types.has(type)) return false;
      for (const p of namePatterns) {
        if (!p.re.test(name)) return false;
      }
      return true;
    };

    let skippedRemote = false;

    // Recursive walk. `dir` is a resolved absolute path; `depth` is the
    // depth of `dir` itself (start points are depth 0).
    const walk = async (dir, depth) => {
      if (isRemote(dir)) {
        hadError = true;
        if (!skippedRemote) {
          stderr.write(`find: skipping remote mount ${dir} (name specific files to search them)\n`);
          skippedRemote = true;
        }
        return;
      }
      let entries;
      try { entries = await fs.list(dir); } catch (e) {
        hadError = true;
        stderr.write(`find: ${dir}: ${e.message}\n`);
        return;
      }
      for (const entry of entries) {
        const isDir = entry.endsWith("/");
        const name = isDir ? entry.slice(0, -1) : entry;
        const full = (dir === "/" ? "/" : dir + "/") + name;
        let st = null;
        try { st = await fs.stat(full); } catch { /* fall back to entry form */ }
        const type = isDir || (st && st.type === "dir") ? "d" : "f";
        if (matched(name, type, depth + 1) && print) {
          stdout.write(full + (type === "d" ? "/" : "") + "\n");
        }
        if (type === "d" && depth + 1 < maxDepth) {
          await walk(full, depth + 1);
        }
      }
    };

    let hadError = false;
    const seen = new Set();
    for (const path of paths) {
      const r = fs._resolve(path);
      if (seen.has(r)) continue;
      seen.add(r);
      let st;
      try { st = await fs.stat(r); } catch (e) {
        hadError = true;
        stderr.write(`find: ${path}: ${e.message}\n`);
        continue;
      }
      const type = st.type === "dir" ? "d" : "f";
      const base = r.split("/").pop() || "/";
      if (matched(base, type, 0) && print) {
        stdout.write((r === "/" ? "/" : r + (type === "d" ? "/" : "")) + "\n");
      }
      if (type !== "d") continue;
      if (isRemote(r)) {
        hadError = true;
        stderr.write(`find: skipping remote mount ${r} (name specific files to search them)\n`);
        continue;
      }
      if (0 < maxDepth) await walk(r, 0);
    }
    return hadError ? 1 : 0;
  },

  async wasmer(args) {

  Usage:\n
    wasmer list                    — list available packages\n
    wasmer search <term>           — search packages\n
    wasmer install <name>          — download package to /bin/\n
    wasmer help                    — this help\n
\n
  Installed packages are available as commands.\n
  Compile your own: Rust/wasm-pack → wasm32-wasi → /bin/\n`);

  async wat2wasm(args) {
    // wat2wasm <file.wat> [-o out.wasm]
    if (args.length === 0) { stderr.write("wat2wasm: missing input file\n"); return 2; }
    let input = args[0];
    let output = null;
    for (let i = 1; i < args.length; i++) {
      if (args[i] === "-o" && args[i + 1]) {
        output = args[++i];
      } else {
        stderr.write(`wat2wasm: unexpected argument '${args[i]}'\n`);
        return 2;
      }
    }
    if (!output) {
      // Default output: input with .wasm extension
      output = input.replace(/\.wat$/i, "") + ".wasm";
    }
    try {
      const wat = await fs.read(input);
      const bytes = await watToWasm(wat, input);
      await fs.writeBlob(output, new Blob([bytes], { type: "application/wasm" }));
      stdout.write(`${output}: ${bytes.length} bytes\n`);
      return 0;
    } catch (e) {
      stderr.write(`wat2wasm: ${e.message}\n`);
      return 1;
    }
  },

  async browse(args) {
    const target = args[0] || fs.cwd;
    const r = fs._resolve(target);
    let url = null;

    // Map virtual paths to real URLs
    const repoMatch = r.match(/^\/(?:github|mount\/github|gitlab|mount\/gitlab)\/([^\/]+)\/([^\/]+)/);
    if (repoMatch) {
      const base = (r.startsWith("/gitlab") || r.startsWith("/mount/gitlab"))
        ? "gitlab.com" : "github.com";
      url = `https://${base}/${repoMatch[1]}/${repoMatch[2]}`;
    } else if (r.startsWith("/http/")) {
      url = "https://" + r.slice(6);
    } else if (r.startsWith("/git/") || r.startsWith("/mount/git/")) {
      const backend = fs._getBackend("/git/");
      const rel = r.startsWith("/git/") ? r.slice(4) : r.slice("/mount/git/".length);
      if (backend && backend.browseUrl) url = await backend.browseUrl(rel);
    } else if (r.startsWith("/mount/github/")) {
      const m = r.match(/^\/mount\/github\/([^\/]+)\/([^\/]+)/);
      if (m) url = `https://github.com/${m[1]}/${m[2]}`;
    }

    // Fallback: user/org page for bare /github/{user} or /gitlab/{user}
    if (!url) {
      const userMatch = r.match(/^\/(?:github|mount\/github|gitlab|mount\/gitlab)\/([^\/]+)/);
      if (userMatch) {
        url = `https://github.com/${userMatch[1]}`;
        // If it's a gitlab path, use gitlab URL
        if (r.startsWith("/gitlab") || r.startsWith("/mount/gitlab")) {
          url = `https://gitlab.com/${userMatch[1]}`;
        }
      }
    }

    if (url) {
      window.open(url, "_blank");
      stdout.write(`Opening: ${url}\n`);
      return 0;
    }
    stderr.write(`browse: no URL mapping for ${r}\n`);
    return 1;
  },

  async play(args) {
    if (args.length === 0) { stderr.write("play: missing filename\n"); return 1; }
    let hadError = false;
    for (const file of args) {
      try {
        const blob = await fs.readBlob(file);
        const url = URL.createObjectURL(blob);
        const el = document.createElement("audio");
        el.controls = true;
        el.autoplay = true;
        el.src = url;
        el.style.width = "100%";
        el.style.maxWidth = "400px";
        el.style.margin = "4px 0";
        term.appendChild(el);
        term.scrollTop = term.scrollHeight;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (e) {
        hadError = true;
        stderr.write(`play: ${file}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

Usage:

  bash2js -f script.sh         transpile a file from the virtual FS
  cat script.sh | bash2js      transpile from a pipe

  async bash(args) {

    // bash script.sh          — execute a bash script from the VFS
    // bash -c 'echo hi'       — same as inline (-c accepted for familiarity)
    // cat script.sh | bash    — execute from a pipe
    //
    // Type bash, get generated JS executed:
    //   bash → Perl (sh2perl.wasm) → JS (perl2js) → run in the shell
    if (args[0] === "-h" || args[0] === "--help") {
      stdout.write(`bash — run bash commands by transpiling them to JS

Usage:
  bash 'echo hello world'  transpile + execute inline bash
  bash -c 'echo hi'        same as inline

  cat script.sh | bash     execute from a pipe
  bash -                   execute from a pipe (explicit)

Loops, conditionals, variables, arithmetic and pipes work:
  bash 'for i in 1 2 3; do echo $i; done'

`);
      return 0;
    }
    let source = null;
    if (args[0] === "-c" || args[0] === "-e") {
      source = args.slice(1).join(" ");
    } else if (args[0] === "-f" || args[0] === "--file") {
      const file = args[1];
      if (!file) { stderr.write("bash: -f needs a file name\n"); return 2; }
      try {
        source = await fs.read(file);
      } catch (e) {
        stderr.write(`bash: ${file}: ${e.message}\n`);
        return 1;
      }
    } else if (args.length === 0 || args[0] === "-") {
      if (stdinBuffer) {
        source = stdinBuffer; // piped in
      } else {

        return 2;
      }
    } else if (!args[0].startsWith("-")) {
      // A file name runs the script from the VFS (`bash script.sh`);
      // anything else is inline bash source (`bash 'echo hi'`).
      // A word that looks like a script path but doesn't exist is an
      // error; multi-word source (paths inside it, like `if [ -f /x`) is
      // always treated as inline bash.
      const file = args[0];
      let fileSource = null;
      try {
        fileSource = await fs.read(file);

      const looksLikePath = !/\s/.test(file) && (file.includes("/") || /\.sh$/.test(file));
      if (fileSource !== null) {
        source = fileSource;
      } else if (looksLikePath) {
        stderr.write(`bash: ${file}: No such file or directory\n`);

      } else {
        source = args.join(" ");
      }
    } else {
      source = args.join(" ");
    }
    try {
      return await runBash(fs, source, {
        wasmRunner,
        stdout,
        runCmd: runNestedCommand,
      });
    } catch (e) {
      stderr.write(`bash: ${e.message}\n`);
      return 1;
    }
  },

    cat x.js && echo ok || echo failed

  Vi editor keys:
    h j k l         move · i a o insert · x dd delete
    u undo · /search · :w save · :q quit · :wq save+quit

  Features:
    Tab completion   — complete commands and file paths
    Ctrl+L           — clear terminal
    Up/Down          — command history
    edit <file>      — built-in text editor
    cat image.png    — renders inline
    play music.mp3   — plays with audio controls
    /big/            — IndexedDB storage, no 5MB limit (cp big files here)
    /pc/             — bridge to your machine: cp file /pc downloads,
                    cp /pc/file uploads (file picker)

  Environment:
    $PATH  /commands:/usr/bin:/bin · $HOME /home · $USER tinysh · $PWD current dir
    Expand with $NAME or \${NAME}: echo $HOME · cd $HOME
    (single quotes or \$ keep the $ literal: echo '$HOME' prints $HOME)

  /dev/ devices: cat /dev/info · cat /dev/cpu · cat /dev/time
                cat /dev/webgl · cat /dev/webgl/extensions
                WebGL GPU: write /dev/webgl/shader/vertex · /dev/webgl/buffer/<name> · /dev/webgl/uniform/2f/uOffset
                draw via /dev/webgl/call ("clear", "draw arrays triangles 3 0", "swap") · demo: webgldemo
                Camera: cat /dev/camera/frame (capture → PNG) · cp /dev/camera/frame /pc/shot.png
                echo 1280x720 > /dev/camera/size · echo off > /dev/camera/off · cat /dev/camera/info
                Audio: echo 440 > /dev/audio/freq · echo sine > /dev/audio/wave · echo on > /dev/audio/on
                echo off > /dev/audio/off · echo A4 0.5 > /dev/audio/note · demo: audiodemo

  Aliases: nano/emacs = edit · less/more = cat · cls = clear
           dir = ls · ? = help · q/quit = exit

  Any other command runs a .js file from /commands/.
  `);
  },

  async clear(args) {
    // Respect scrollback: only blank the visible viewport, leaving
    // scrolled-above history intact (Ctrl+L does the same).
    clearViewport();
  },

  async history(args) {
    if (history.length === 0) {
      stdout.write("(empty history)\n");
      return;
    }
    history.forEach((cmd, i) => {
      stdout.write(`${String(i + 1).padStart(4)}  ${cmd}\n`);
    });
  },

  async locate(args) {
    if (args.length === 0) { stderr.write("locate: missing pattern\n"); return 2; }
    const pattern = args[0];
    // Build a regex from the pattern (support * and ? wildcards)
    let reStr = "";
    for (const ch of pattern) {
      if (ch === "*") reStr += ".*";
      else if (ch === "?") reStr += ".";
      else reStr += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
    const re = new RegExp(reStr, "i");

    const results = new Set();
    const visited = new Set();

    async function walk(dir) {
      if (visited.has(dir)) return;
      visited.add(dir);
      let entries;
      try { entries = await fs.list(dir); } catch { return; }
      for (const entry of entries) {
        const clean = entry.replace(/\/$/, "");
        const full = (dir === "/" ? "/" : dir + "/") + clean;
        if (re.test(clean)) {
          results.add(full + (entry.endsWith("/") ? "/" : ""));
        }
        if (entry.endsWith("/")) {
          await walk(full);
        }
      }
    }

    // 1. Walk local mounts only — /github & /gitlab would trigger a
    //    network crawl of every repo; remote content is searched via
    //    the visited-cache below instead.
    const tops = ["/tmp", "/home", "/commands", "/bin", "/dev", "/http"];
    for (const top of tops) {
      await walk(top);
    }

    // 2. Raw localStorage scan — catch files not reachable via the dirs
    //    index (e.g. written to a path whose parent dir wasn't recorded)
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("fs:file:")) {
          const p = key.slice("fs:file:".length);
          const name = p.split("/").pop();
          if (re.test(name)) {
            results.add("/home" + p);
          }
        }
      }
    } catch {}

    // 3. GitHub/GitLab visited-path cache — can't enumerate all of GitHub,
    //    so search what has actually been browsed in this session.
    const remote = ["/github", "/gitlab", "/git"];
    let remoteSearched = false;
    for (const mount of remote) {
      try {
        const backend = fs._getBackend(mount + "/");
        if (backend && backend.listVisited) {
          const visited = await backend.listVisited();
          for (const p of visited) {
            const clean = p.replace(/\/$/, "");
            const name = clean.split("/").pop();
            if (re.test(name)) {
              results.add(mount + clean + (p.endsWith("/") ? "/" : ""));
            }
          }
          remoteSearched = true;
        }
      } catch {}
    }

    if (remoteSearched) {
      write("# note: /github & /gitlab results limited to files visited this session\n", "info");
    }

    if (results.size === 0) {
      stdout.write(`locate: no files matching "${pattern}"\n`);
      return 1;
    }
    stdout.write([...results].sort().join("\n") + "\n");
    return 0;
  },

  async more(args) {
    if (args.length === 0) { stderr.write("more: missing filename\n"); return 2; }
    try {
      const content = await fs.read(args[0]);
      const lines = content.split("\n");
      startPager(lines, args[0], "more");
      return 0;
    } catch (e) {
      stderr.write(`more: ${args[0]}: ${e.message}\n`);
      return 1;
    }
  },

  async less(args) {
    if (args.length === 0) { stderr.write("less: missing filename\n"); return 2; }
    try {
      const content = await fs.read(args[0]);
      const lines = content.split("\n");
      startPager(lines, args[0], "less");
      return 0;
    } catch (e) {
      stderr.write(`less: ${args[0]}: ${e.message}\n`);
      return 1;
    }
  },

  async exit(args) {
    write("Goodbye.\n", "info");
    input.disabled = true;
    return 0;
  }
};

// ─── Command Resolution ─────────────────────────────────────────

async function resolveCommand(name) {
  // vim is an alias for vi
  if (name === "vim") name = "vi";
  // A wasm32-wasi binary in the command path is a "native command" and
  // shadows the builtin of the same name — so `wasmer install grep`
  // (which drops /bin/grep.wasm) makes `grep` run real grep compiled
  // to WASM instead of the JS fallback.
  const searchPaths = env.PATH.split(":").filter(Boolean);
  for (const dir of searchPaths) {
    try {
      const entries = await fs.list(dir);
      if (entries.includes(name + ".wasm")) {
        return { type: "wasm", path: dir + "/" + name + ".wasm" };
      }
    } catch {}
  }

  if (builtins[name]) return { type: "builtin", fn: builtins[name] };
  // Walk the command path from $PATH (colon-separated, like POSIX)
  for (const dir of searchPaths) {
    try {
      for (const entry of await fs.list(dir)) {
        const clean = entry.replace(/\/$/, "");
        if (clean === name || clean === name + ".js") {
          return { type: "jsfile", path: dir + "/" + clean };
        }
        if (clean === name + ".wasm") {
          return { type: "wasm", path: dir + "/" + clean };
        }
      }
    } catch {}
  }

  // Auto-load WASM binary from local server on first use.
  // cc is an alias for the compiler binary.
  let wasmName = name;
  if (name === "cc") wasmName = "compiler";
  try {
    const resp = await fetch("wasm-bin/" + wasmName + ".wasm");
    if (resp.ok) {
      const blob = await resp.blob();
      const destPath = "/bin/" + name + ".wasm";
      await fs.writeBlob(destPath, blob);
      return { type: "wasm", path: destPath };
    }
  } catch {}

  return null;
}

// ─── Command Handler ────────────────────────────────────────────

// Tokenize a pipeline segment into words the way a shell does:
//   whitespace separates words (outside quotes)
//   '...'  single quotes — everything literal until the closing quote
//   "..."  double quotes — backslash escapes only " \ $ and ` (POSIX),
//          everything else (spaces, |, *...) stays literal
//   \x     outside quotes — escapes the next character ("\ " → space)
//   "" / ''               — produce an empty word
// Throws an Error with a shell-style message if a quote is left open.
function tokenize(segment) {
  const tokens = [];
  let cur = "";
  let started = false;  // have we begun a word?
  let quoted = false;   // did this word contain an explicit quote? (so '' → "")
  let inSingle = false;
  let inDouble = false;

  const push = () => {
    if (started || quoted) tokens.push(cur);
    cur = "";
    started = false;
    quoted = false;
  };

  for (let i = 0; i < segment.length; i++) {
    const ch = segment[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      else cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      else if (ch === "\\" && ['"', "\\", "$", "`"].includes(segment[i + 1])) {
        cur += segment[++i]; // escaped char loses its special meaning
      } else if (ch === "$") {
        // $NAME / ${NAME} expansion (valid inside double quotes too)
        const ref = expandRef(segment, i);
        cur += ref.value;
        i = ref.end - 1;
      } else {
        cur += ch;
      }
      continue;
    }
    if (ch === "'") { inSingle = true; started = true; quoted = true; continue; }
    if (ch === '"') { inDouble = true; started = true; quoted = true; continue; }
    if (ch === "\\") {
      if (i + 1 < segment.length) cur += segment[++i];
      started = true;
      continue;
    }
    if (ch === "$") {
      // $NAME / ${NAME} expansion outside quotes
      const ref = expandRef(segment, i);
      cur += ref.value;
      i = ref.end - 1;
      started = true;
      continue;
    }
    if (/\s/.test(ch)) { push(); continue; }
    cur += ch;
    started = true;
  }
  if (inSingle) throw new Error(`unexpected EOF while looking for matching "'"`);
  if (inDouble) throw new Error(`unexpected EOF while looking for matching '"'`);
  push();
  return tokens;
}

// Split a line into pipeline segments on `|`, respecting quotes and
// backslash escapes (a \| outside quotes is a literal pipe char).
function splitPipe(line) {
  const segments = [];
  let cur = "";
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      cur += ch;
      continue;
    }
    if (ch === "\\") {
      cur += ch;
      if (i + 1 < line.length) { cur += line[i + 1]; i++; }
      continue;
    }
    if (ch === "'") { inSingle = true; cur += ch; continue; }
    if (ch === '"') { inDouble = true; cur += ch; continue; }
    if (ch === "|") { segments.push(cur); cur = ""; continue; }
    cur += ch;
  }
  segments.push(cur);
  return segments;
}

// Split a line into conditional segments on `&&` and `||`, respecting
// quotes and backslash escapes (a `\&&` outside quotes is a literal
// ampersand, not an operator). Returns { text, op } parts where `op`
// is the operator preceding the part ('&&' or '||'), or null for the
// first part. A lone `&` is a syntax error (no background jobs here).
function splitConditionals(line) {
  const parts = [];
  let cur = "";
  let op = null;
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inSingle) {
      if (ch === "'") inSingle = false;
      cur += ch;
      continue;
    }
    if (inDouble) {
      if (ch === '"') inDouble = false;
      cur += ch;
      continue;
    }
    if (ch === "\\") {
      cur += ch;
      if (i + 1 < line.length) { cur += line[i + 1]; i++; }
      continue;
    }
    if (ch === "'") { inSingle = true; cur += ch; continue; }
    if (ch === '"') { inDouble = true; cur += ch; continue; }
    if ((ch === "&" || ch === "|") && line[i + 1] === ch) {
      parts.push({ text: cur, op });
      cur = "";
      op = ch + ch;
      i++;
      continue;
    }
    if (ch === "&") {
      throw new Error("syntax error near unexpected token '&'");
    }
    cur += ch;
  }
  parts.push({ text: cur, op });
  return parts;
}

// Run one pipeline (`|`-separated commands), feeding each command's
// stdout to the next command's stdin. Returns the pipeline's exit
// status: the first failing command's status, else the last one's.
async function runPipeline(pipelineText) {
  const segments = splitPipe(pipelineText);
  let stdin = "";
  let exitCode = 0;
  for (let i = 0; i < segments.length; i++) {
    if (!segments[i].trim()) {
      stderr.write(`tinysh: syntax error near unexpected token '|'\n`);
      return 2;
    }
    const result = await runSegment(segments[i], stdin, i === segments.length - 1);
    if (!result.ok) return result.code ?? 1;
    stdin = result.output;
    exitCode = result.code ?? 0;
  }
  return exitCode;
}

// Run a nested command line from generated JS (pipelines and command
// substitution inside a `bash` script) through the shell itself, and
// return its captured stdout plus exit status. This is what rt.exec /
// rt.pipe / rt.pipeCond in the generated JS call: sh2perl shells out
// to 'bash -c "..."' for pipes, and we route that back through the
// shell's own pipeline machinery.
async function runNestedCommand(cmdLine) {
  let captured = "";
  const origWrite = stdout.write;
  stdout.write = (chunk) => {
    captured += chunk;
    return true;
  };
  let code = 0;
  try {
    code = (await handleLine(cmdLine)) ?? 0;
  } finally {
    stdout.write = origWrite;
  }
  return { out: captured, code };
}

// Execute one pipeline segment. `stdin` carries the previous segment's
// stdout. Returns { ok, code, output } — `code` is the command's exit
// status (0 success), `output` is the captured stdout that should be
// fed to the next segment (empty for the last segment).
async function runSegment(segmentText, stdin, isLast) {
  let tokens;
  try {
    tokens = tokenize(segmentText);
  } catch (e) {
    stderr.write(`tinysh: ${e.message}\n`);
    return { ok: false, code: 2, output: "" };
  }
  if (tokens.length === 0) return { ok: false, code: 2, output: "" };
  const cmd = tokens[0];
  const args = tokens.slice(1);

  let outputRedirect = null;
  const redirectIndex = args.indexOf(">");
  if (redirectIndex !== -1) {
    outputRedirect = args[redirectIndex + 1];
    args.splice(redirectIndex, 2);
  }

  let output = "";

  const resolved = await resolveCommand(cmd);
  if (!resolved) {
    const hints = {
      "nano": "edit", "emacs": "edit",
      "more": "cat", "less": "cat",
      "cls": "clear", "quit": "exit", "q": "exit",
      "?": "help", "dir": "ls", "ll": "ls", "la": "ls",
      "chdir": "cd",
      "apt": "wasmer", "apt-get": "wasmer", "yum": "wasmer",
      "dnf": "wasmer", "brew": "wasmer", "pacman": "wasmer",
      "apk": "wasmer", "pip": "wasmer", "npm": "wasmer install",
      "sh": "bash",
    };
    const hint = hints[cmd];
    if (hint) {
      stderr.write(`${cmd}: command not found — try "${hint}" instead\n`);
    } else {
      stderr.write(`${cmd}: command not found\n`);
    }
    return { ok: false, code: 127, output: "" };
  }

  // Make pipe input available to builtins (head etc.)
  stdinBuffer = stdin;

  try {
    if (resolved.type === "wasm") {
      try {
        // Interactive interpreters (python without args) enter a REPL.
        // We implement it at the shell level using session replay: each
        // line re-runs all previous snippets (preserving state) with a
        // marker, then we split the output at the marker to show only
        // the new output.
        if (cmd === "python" && args.length === 0) {
          enterPythonRepl();
          return { ok: true, code: 0, output: "" };
        }

        // python /path/to/script.py → read file from VirtualFS, run as -c
        let wasmArgs = [cmd, ...args];
        if (cmd === "python" && args.length === 1 && !args[0].startsWith("-")) {
          try {
            const script = await fs.read(args[0]);
            wasmArgs = [cmd, "-c", script];
          } catch (e) {
            stderr.write(`python: ${args[0]}: ${e.message}\n`);
            return { ok: false, code: 1, output: "" };
          }
        }

        // cc: compile C → WAT, then to a .wasm binary.
        //   cc prog.c            → writes a.wasm (like gcc's a.out)
        //   cc -o out.wasm prog.c → writes out.wasm
        //   cc -S prog.c          → emits WAT to stdout (assembly)
        let ccOutput = null;
        let ccWatOnly = false;
        if ((cmd === "cc" || cmd === "compiler") && args.length > 0) {
          let srcFile = null;
          if (args[0] === "-o" && args[1]) {
            ccOutput = args[1];
            srcFile = args[2];
            wasmArgs = [cmd, srcFile];
          } else if (args[0] === "-S") {
            ccWatOnly = true;
            srcFile = args[1];
            wasmArgs = [cmd, srcFile];
          } else if (args[0].endsWith(".wasm") && args[1]) {
            ccOutput = args[0];
            srcFile = args[1];
            wasmArgs = [cmd, srcFile];
          } else {
            ccOutput = "a.wasm";  // default, like gcc's a.out
            srcFile = args[0];
            wasmArgs = [cmd, srcFile];
          }
        }

        await wasmRunner.run(resolved.path, wasmArgs, stdin);
        const exitCode = wasmRunner.getExitCode();
        let wasmOut = wasmRunner.getStdout();
        const wasmErr = wasmRunner.getStderr();

        // Convert WAT → WASM binary (skip for -S which wants the WAT)
        if (!ccWatOnly && ccOutput && exitCode === 0) {
          try {
            const bytes = await watToWasm(wasmOut, "cc-output.wat");
            await fs.writeBlob(ccOutput, new Blob([bytes], { type: "application/wasm" }));
            stdout.write(`${ccOutput}: ${bytes.length} bytes\n`);
            wasmOut = "";  // binary written to file, not stdout
          } catch (e) {
            stderr.write(`cc: ${e.message}\n`);
            return { ok: false, code: 1, output: "" };
          }
        }

        if (outputRedirect) {
          await fs.write(outputRedirect, wasmOut);
        } else if (isLast) {
          if (wasmOut) stdout.write(wasmOut);
        } else {
          output = wasmOut;
        }
        if (wasmErr) {
          stderr.write(wasmErr);
        }
        if (exitCode !== 0) {
          stderr.write(`${cmd}: exited with code ${exitCode}\n`);
          return { ok: false, code: exitCode, output: "" };
        }
        return { ok: true, code: 0, output };
      } catch (e) {
        stderr.write(`${cmd}: wasm error: ${e.message}\n`);
        return { ok: false, code: 1, output: "" };
      }
    }

    if (resolved.type === "builtin") {
      const origWrite = stdout.write;
      const chunks = [];
      const capture = outputRedirect || !isLast;
      if (capture) {
        stdout.write = (chunk) => { chunks.push(chunk); return true; };
      }
      let code = 0;
      try {
        code = (await resolved.fn(args)) ?? 0;
      } finally {
        if (capture) {
          stdout.write = origWrite;
          const captured = chunks.join("");
          if (outputRedirect) await fs.write(outputRedirect, captured);
          else output = captured;
        }
      }
      return { ok: code === 0, code, output };
    }

    // Run a .js command file from /commands/ (or /bin/, /usr/bin/)
    const content = await fs.read(resolved.path);
    const fn = new Function("args", "fs", "console", "stdin", "env", `
        return (async () => { ${content} })();
      `);
    const logChunks = [];
    const fakeConsole = { log: (...msgs) => logChunks.push(msgs.join(" ") + "\n") };
    const ret = await fn(args, fs, fakeConsole, stdin, env);
    // A command file may return a number to set its exit status
    const code = typeof ret === "number" ? ret : 0;
    output = logChunks.join("");
    if (outputRedirect) {
      await fs.write(outputRedirect, output);
      output = "";
    } else if (isLast) {
      stdout.write(output);
      output = "";
    }
    return { ok: code === 0, code, output };
  } catch (e) {
    stderr.write(`${cmd}: error: ${e.message}\n`);
    return { ok: false, code: 1, output: "" };
  }
}

async function handleLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return;

  // Split on && / || and run left to right. `&&` runs the next command
  // only if the previous one succeeded (exit 0); `||` runs it only if
  // the previous one failed. Each conditional part is itself a pipeline.
  let parts;
  try {
    parts = splitConditionals(trimmed);
  } catch (e) {
    stderr.write(`tinysh: ${e.message}\n`);
    return;
  }
  // An empty segment means the line started with an operator, ended
  // with one, or had two operators in a row (`&& echo hi`, `echo hi &&`,
  // `a && || b`) — all syntax errors.
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].text.trim()) {
      const nextOp = i + 1 < parts.length ? parts[i + 1].op : null;
      const token = nextOp ? `'${nextOp}'` : "newline";
      stderr.write(`tinysh: syntax error near unexpected token ${token}\n`);
      return;
    }
  }

  let exitCode = 0;
  for (let i = 0; i < parts.length; i++) {
    if (i > 0) {
      if (parts[i].op === "&&" && exitCode !== 0) continue;
      if (parts[i].op === "||" && exitCode === 0) continue;
    }
    exitCode = await runPipeline(parts[i].text);
  }
  return exitCode;
}

// ─── Command History (persists across refreshes) ───────────────

const HISTORY_KEY = "tinysh:history";
const HISTORY_MAX = 500;

// Load history from localStorage (browser) or empty
let history = [];
try {
  const saved = localStorage.getItem(HISTORY_KEY);
  if (saved) history = JSON.parse(saved);
} catch {}
let historyIndex = history.length;

function saveHistory() {
  try {
    // Keep only the most recent HISTORY_MAX entries
    if (history.length > HISTORY_MAX) {
      history = history.slice(-HISTORY_MAX);
    }
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch {}
}

function addHistory(line) {
  const trimmed = line.trim();
  if (!trimmed) return;
  // Don't duplicate the last command
  if (history[history.length - 1] === trimmed) return;
  history.push(trimmed);
  historyIndex = history.length;
  saveHistory();
}

// ─── Tab Completion ─────────────────────────────────────────────

async function complete(line, cursorPos) {
  const beforeCursor = line.slice(0, cursorPos);

  // Find the start of the current word
  const wordStart = Math.max(beforeCursor.lastIndexOf(" ") + 1, 0);
  const prefix = beforeCursor.slice(wordStart);

  if (!prefix) return { line, cursorPos, matches: [] };

  let matches = [];
  const isPath = prefix.includes("/");

  if (isPath) {
    // Filesystem path completion
    const lastSlash = prefix.lastIndexOf("/");
    const dir = prefix.slice(0, lastSlash + 1);
    const filePrefix = prefix.slice(lastSlash + 1);

    try {
      const resolvedDir = dir === "/" ? "/" : fs._resolve(dir.replace(/\/$/, ""));
      const entries = await fs.list(resolvedDir);
      matches = entries
        .filter(e => e.startsWith(filePrefix))
        .map(e => {
          const isDir = e.endsWith("/");
          return isDir ? dir + e : dir + e;
        });
    } catch { /* directory doesn't exist or no permission */ }
  } else {
    // Command completion
    matches.push(...Object.keys(builtins).filter(name => name.startsWith(prefix)));

    // Search command paths
    try {
      const cmdEntries = await fs.list("/commands");
      for (const e of cmdEntries) {
        const name = e.replace(/\/$/, "").replace(/\.js$/, "");
        if (name.startsWith(prefix) && !matches.includes(name)) {
          matches.push(name);
        }
      }
    } catch { /* /commands doesn't exist */ }
  }

  matches = [...new Set(matches)].sort();

  if (matches.length === 1) {
    const m = matches[0];
    const suffix = isPath && m.endsWith("/") ? "" : " ";
    const newLine = beforeCursor.slice(0, wordStart) + m + suffix + line.slice(cursorPos);
    const newPos = wordStart + m.length + suffix.length;
    return { line: newLine, cursorPos: newPos, matches: [] };
  }

  if (matches.length > 1) {
    const common = longestCommonPrefix(matches);
    if (common !== prefix && common.length > prefix.length) {
      const newLine = beforeCursor.slice(0, wordStart) + common + line.slice(cursorPos);
      const newPos = wordStart + common.length;
      return { line: newLine, cursorPos: newPos, matches };
    }
    // Show all matches on a new line
    return { line, cursorPos, matches };
  }

  return { line, cursorPos, matches: [] };
}

function longestCommonPrefix(strings) {
  if (!strings.length) return "";
  let prefix = strings[0];
  for (let i = 1; i < strings.length; i++) {
    while (strings[i].indexOf(prefix) !== 0) {
      prefix = prefix.slice(0, -1);
      if (!prefix) return "";
    }
  }
  return prefix;
}

// ─── Input Handling ─────────────────────────────────────────────

let lastTabPress = 0;
let lastPrefix = "";
let lastMatches = [];

// ─── Python REPL (worker-based, WASI-level blocking stdin) ─────

const replState = {
  active: false,
  worker: null,
  sab: null,
};

const SAB_DATA_OFFSET = 64;
const SAB_BUF_SIZE = 65536;

// Try to create a SharedArrayBuffer (requires COOP/COEP headers)
function sabAvailable() {
  return typeof SharedArrayBuffer !== "undefined";
}

async function enterPythonRepl() {
  if (!sabAvailable()) {
    stderr.write("SharedArrayBuffer unavailable — serve with www/serve.py (COOP/COEP).\n");
    stderr.write("Falling back to session-replay REPL...\n");
    enterPythonReplReplay();
    return;
  }

  replState.active = true;
  replState.sab = new SharedArrayBuffer(SAB_DATA_OFFSET + SAB_BUF_SIZE);

  try {
    const wasmBytes = await fetch("wasm-bin/python.wasm").then(r => r.arrayBuffer());
    const blob = new Blob([wasmBytes]);

    replState.worker = new Worker("wasi-worker.js");

    replState.worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === "stdout") {
        stdout.write(msg.data);
      } else if (msg.type === "exit") {
        exitPythonRepl();
      }
    };

    replState.worker.postMessage({ type: "run", wasmBytes, args: ["python"], sab: replState.sab });
    stdout.write("MicroPython REPL (WASI-level stdin) — exit() or Ctrl-D to leave\n");
  } catch (e) {
    stderr.write(`python: ${e.message}\n`);
    exitPythonRepl();
  }

  updatePrompt();
}

function exitPythonRepl() {
  replState.active = false;
  if (replState.worker) {
    replState.worker.terminate();
    replState.worker = null;
  }
  replState.sab = null;
  stdout.write("\nLeaving Python REPL.\n");
  updatePrompt();
}

function sendPythonLine(line) {
  const control = new Int32Array(replState.sab);
  const dataView = new Uint8Array(replState.sab);

  // Write the line + newline into the SAB data region
  const enc = new TextEncoder();
  const bytes = enc.encode(line + "\n");
  const len = Math.min(bytes.length, SAB_BUF_SIZE);
  dataView.set(bytes.subarray(0, len), SAB_DATA_OFFSET);

  Atomics.store(control, 1, len);
  Atomics.store(control, 0, 1);  // data ready
  Atomics.notify(control, 0, 1);
}

function sendPythonEof() {
  const control = new Int32Array(replState.sab);
  Atomics.store(control, 0, 2);  // EOF state
  Atomics.notify(control, 0, 1);
}

// ─── Fallback: session replay REPL (no SharedArrayBuffer) ──────

const replReplayState = {
  active: false,
  snippets: [],
  pending: [],
};

function enterPythonReplReplay() {
  replReplayState.active = true;
  replReplayState.snippets = [];
  replReplayState.pending = [];
  stdout.write("MicroPython REPL (session replay) — exit() to leave\n");
  updatePrompt();
}

function exitPythonReplReplay() {
  replReplayState.active = false;
  replReplayState.snippets = [];
  replReplayState.pending = [];
  stdout.write("\nLeaving Python REPL.\n");
  updatePrompt();
}

function isComplete(source) {
  try {
    let depth = 0;
    for (const ch of source) {
      if ("([{".includes(ch)) depth++;
      if (")]}".includes(ch)) depth--;
    }
    const lines = source.split("\n");
    const last = lines[lines.length - 1].trimEnd();
    if (last.endsWith(":")) return false;
    return depth <= 0;
  } catch {
    return true;
  }
}

async function runPythonReplReplayLine(line) {
  if (line.trim() === "exit()" || line.trim() === "quit()") {
    exitPythonReplReplay();
    return;
  }

  replReplayState.pending.push(line);
  const source = replReplayState.pending.join("\n");

  if (!isComplete(source)) {
    updatePrompt();
    return;
  }
  replReplayState.pending = [];

  const marker = `__repl_marker_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}__`;
  const transcript = [
    ...replReplayState.snippets,
    `import sys as __rs; __rs.stdout.write(${JSON.stringify(marker)} + "\n")`,
    source,
  ].join("\n");

  try {
    await wasmRunner.run("/bin/python.wasm", ["python", "-c", transcript]);
    let output = wasmRunner.getStdout();
    const idx = output.indexOf(marker + "\n");
    if (idx !== -1) output = output.slice(idx + marker.length + 1);
    stdout.write(output);
    replReplayState.snippets.push(source);
  } catch (e) {
    stderr.write(`python: ${e.message}\n`);
  }

  updatePrompt();
}

// ─── Pager (more/less) ──────────────────────────────────────────

const pagerState = {
  active: false,
  lines: [],
  pos: 0,
  pageSize: 20,
  name: "less",
  search: null,
};

function startPager(lines, filename, name) {
  pagerState.active = true;
  pagerState.lines = lines;
  pagerState.pos = 0;
  pagerState.pageSize = 20;
  pagerState.name = name || "less";
  pagerState.search = null;
  stdout.write(`── ${filename} ──\n`);
  renderPagerPage();
  updatePrompt();
}

function renderPagerPage() {
  const end = Math.min(pagerState.pos + pagerState.pageSize, pagerState.lines.length);
  for (let i = pagerState.pos; i < end; i++) {
    stdout.write(pagerState.lines[i] + "\n");
  }
  // Pager prompt
  const pct = pagerState.lines.length === 0
    ? 100
    : Math.min(100, Math.round((end / pagerState.lines.length) * 100));
  const label = pagerState.name === "more" ? "More" : "Less";
  write(`─${label}─(${pct}%)─ `, "info");
}

function exitPager() {
  pagerState.active = false;
  pagerState.lines = [];
  pagerState.search = null;
  stdout.write("\n");
  updatePrompt();
}

async function handlePagerInput(line) {
  const t = line.trim().toLowerCase();

  if (t === "q" || t === "quit" || t === ":q") {
    exitPager();
    return;
  }
  if (t === "" || t === " " || t === "f" || t === "\uf000" || t === "next") {
    // space / enter / f → next page
    pagerState.pos += pagerState.pageSize;
    if (pagerState.pos >= pagerState.lines.length) {
      exitPager();
    } else {
      renderPagerPage();
    }
    return;
  }
  if (t === "b" || t === "prev" || t === "page-up") {
    pagerState.pos = Math.max(0, pagerState.pos - pagerState.pageSize);
    renderPagerPage();
    return;
  }
  if (t === "g" || t === "home") {
    pagerState.pos = 0;
    renderPagerPage();
    return;
  }
  if (t === "g" || t === "end" || t === "$" || t === "100%" || t === "last") {
    pagerState.pos = Math.max(0, pagerState.lines.length - pagerState.pageSize);
    renderPagerPage();
    return;
  }
  if (t.startsWith("/")) {
    // search forward
    const pattern = t.slice(1);
    try {
      const re = new RegExp(pattern, "i");
      for (let i = pagerState.pos + 1; i < pagerState.lines.length; i++) {
        if (re.test(pagerState.lines[i])) {
          pagerState.pos = Math.max(0, i - 5);
          renderPagerPage();
          return;
        }
      }
      stdout.write(`Pattern not found: ${pattern}\n`);
      write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    } catch {
      stdout.write(`Invalid pattern: ${pattern}\n`);
      write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    }
    return;
  }
  if (t === "h" || t === "help" || t === "?") {
    stdout.write("  space/f  next page   b  back page   g  first   G  last\n");
    stdout.write("  /pattern search       q  quit\n");
    write(`─${pagerState.name === "more" ? "More" : "Less"}─ `, "info");
    return;
  }
  // Default: next page (like more)
  pagerState.pos += pagerState.pageSize;
  if (pagerState.pos >= pagerState.lines.length) {
    exitPager();
  } else {
    renderPagerPage();
  }
}

// ─── Status bar ─────────────────────────────────────────────────

function updateStatusBar() {
  const cwd = fs.cwd;
  statusContext.textContent = cwd;

  // REPL mode hint
  if (pagerState.active) {
    statusHint.textContent = "Pager: space/f next · b back · /search · q quit";
    return;
  }
  if (replState.active || replReplayState.active) {
    statusHint.textContent = "Python REPL · exit() or Ctrl-D to leave";
    return;
  }

  // Context-sensitive hints
  if (cwd.startsWith("/github") || cwd.startsWith("/mount/github")) {
    statusHint.textContent = "Browse any GitHub repo. 'browse' opens in tab.";
  } else if (cwd.startsWith("/gitlab") || cwd.startsWith("/mount/gitlab")) {
    statusHint.textContent = "Browse any GitLab project. 'browse' opens in tab.";
  } else if (cwd.startsWith("/git") || cwd.startsWith("/mount/git")) {
    statusHint.textContent = "Any git repo as a filesystem (real git protocol). 'browse' opens it.";
  } else if (cwd.startsWith("/http")) {
    statusHint.textContent = "CORS-enabled fetch. Public CDNs and APIs only. 'browse' opens URL.";
  } else if (cwd.startsWith("/dev")) {
    statusHint.textContent = "Browser devices: info, cpu, webgl, camera, audio, clipboard...";
  } else if (cwd.startsWith("/tmp")) {
    statusHint.textContent = "Ephemeral — lost on reload.";
  } else if (cwd.startsWith("/home")) {
    statusHint.textContent = "Persistent storage (localStorage). edit: text editor.";
  } else if (cwd.startsWith("/bin") || cwd.startsWith("/commands")) {
    statusHint.textContent = "Executable commands. .js and .wasm files.";
  } else if (cwd.startsWith("/mount")) {
    statusHint.textContent = "Mounted filesystems. ls /mount/github/ for repos.";
  } else {
    statusHint.textContent = "Tab: complete · Ctrl+L: clear · Up/Down: history";
  }
}

function updatePrompt() {
  if (pagerState.active) {
    promptEl.textContent = "";
  } else if (replState.active) {
    promptEl.textContent = ">>> ";
  } else if (replReplayState.active) {
    promptEl.textContent = replReplayState.pending.length > 0 ? "... " : ">>> ";
  } else {
    promptEl.textContent = `tinysh:${fs.cwd}$ `;
  }
  updateStatusBar();
}

async function onCommand() {
  const line = input.value;
  input.value = "";

  // Pager mode: input is a pager key
  if (pagerState.active) {
    write(`${line}\n`, "prompt");
    await handlePagerInput(line);
    input.focus();
    return;
  }

  // Worker-based REPL: send line to WASM via SAB
  if (replState.active) {
    write(`>>> ${line}\n`, "prompt");
    if (line.trim() === "exit()" || line.trim() === "quit()") {
      sendPythonEof();
    } else {
      sendPythonLine(line);
    }
    input.focus();
    return;
  }

  // Session-replay REPL (fallback)
  if (replReplayState.active) {
    const promptText = replReplayState.pending.length > 0 ? "... " : ">>> ";
    write(`${promptText}${line}\n`, "prompt");
    await runPythonReplReplayLine(line);
    input.focus();
    return;
  }

  addHistory(line);

  write(`tinysh:${fs.cwd}$ ${line}\n`, "prompt");

  await handleLine(line);
  updatePrompt();
  input.focus();
  lastMatches = [];
}

input.addEventListener("keydown", async (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    await onCommand();
    return;
  }

  // Tab completion
  if (e.key === "Tab") {
    e.preventDefault();
    const now = Date.now();
    const isDoubleTab = (now - lastTabPress < 500) && lastPrefix === input.value;
    lastTabPress = now;

    const result = await complete(input.value, input.selectionStart);
    if (result.matches && result.matches.length > 0 && isDoubleTab) {
      // Double-tab: show all matches
      write("\n" + result.matches.join("  ") + "\n", "info");
      write(`${promptEl.textContent}${result.line}`, "prompt");
      input.value = result.line;
      input.setSelectionRange(result.cursorPos, result.cursorPos);
    } else if (result.line !== input.value) {
      input.value = result.line;
      input.setSelectionRange(result.cursorPos, result.cursorPos);
      lastPrefix = result.line;
      lastMatches = result.matches || [];
    } else if (result.matches && result.matches.length > 1) {
      // Single tab with multiple matches: show them
      write("\n" + result.matches.join("  ") + "\n", "info");
      write(`${promptEl.textContent}${input.value}`, "prompt");
      lastPrefix = input.value;
    }
    return;
  }

  // Ctrl+D — exit REPL (EOF)
  if (e.ctrlKey && e.key === "d" && (replState.active || replReplayState.active)) {
    e.preventDefault();
    if (replState.active) {
      sendPythonEof();
    } else {
      exitPythonReplReplay();
    }
    return;
  }

  // Ctrl+L — clear (keeps scrollback, like `clear`)
  if ((e.ctrlKey || e.metaKey) && e.key === "l") {
    e.preventDefault();
    clearViewport();
    write(`${promptEl.textContent}${input.value}`, "prompt");
    return;
  }

  // Up/Down — history
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex];
    }
    return;
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex++;
      input.value = history[historyIndex];
    } else {
      historyIndex = history.length;
      input.value = "";
    }
    return;
  }

  lastMatches = [];
});
