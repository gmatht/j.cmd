<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>j.cmd — A JavaScript Command Line OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  #terminal {
    flex: 1;
    min-height: 0;  /* allow shrink so flex layout works */
    padding: 16px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* Hidden probe used to measure the monospace cell size for the
     COLUMNS/LINES terminal geometry. Kept off-screen (and out of the
     terminal's scroll area) so it never affects layout or scrollbars;
     visibility:hidden still leaves its metrics measurable. */
  .term-probe {
    position: fixed;
    left: -9999px;
    top: 0;
    visibility: hidden;
    white-space: pre;
    display: inline-block;
    pointer-events: none;
    font: inherit;  /* body font == #terminal font (14px monospace) */
  }

  /* ─── Status bar ──────────────────────────────────── */
  #status-bar {
    display: flex;
    flex-wrap: wrap;
    padding: 2px 16px;
    background: #0d1117;
    color: #8b949e;
    font-size: 11px;
    align-items: center;
    border-top: 1px solid #21262d;
    gap: 4px 16px;
    flex-shrink: 0;
  }
  #status-hint { flex: 1; min-width: 0; }
  #status-context { color: #7ec8e3; }
  
  #prompt-line {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  /* Welcome banner: motd text left, xkcd comic right when there's room;
     flex-wrap drops the comic below the motd on narrow terminals. */
  #welcome-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  #welcome-text {
    white-space: pre-wrap;
    flex: 1 1 480px;
    min-width: 260px;
  }
  #welcome-xkcd {
    flex: 0 1 auto;
    align-self: flex-start;
  }
  #welcome-xkcd img {
    max-width: min(42vw, 500px);
    max-height: 32vh;
    border-radius: 4px;
  }
  #prompt {
    color: #7ec8e3;
  }
  #input-span .cursor {
    display: inline-block;
    width: 0.6em;
    background: #7ec8e3;
    color: #1a1a2e;
    animation: cursor-blink 1s steps(1) infinite;
  }
  /* When the hidden input isn't focused the shell is idle — the cursor
     stops blinking (like a real terminal's focus cursor) */
  #terminal:not(.focused) .cursor {
    animation: none;
    opacity: 0.35;
  }
  @keyframes cursor-blink {
    50% { opacity: 0; }
  }
  #hidden-input {
    position: fixed;
    top: -100px;
    left: 0;
    opacity: 0;
    width: 1px;
    height: 1px;
    border: none;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: transparent;
  }

  /* ─── Editor mode ─────────────────────────────────── */
  #editor-container {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 48px;
    background: #0d1117;
    z-index: 10;
  }
  #editor-container.active {
    display: flex;
    flex-direction: column;
  }
  #editor-header {
    background: #161b22;
    padding: 8px 16px;
    color: #8b949e;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #30363d;
  }
  #editor-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .CodeMirror {
    height: 100% !important;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  .cm-s-monokai .CodeMirror-cursor {
    border-color: #7ec8e3;
  }
  /* Vim command line — pin to bottom like real vim, not top */
  .CodeMirror-dialog {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #161b22;
    color: #e0e0e0;
    border-top: 1px solid #30363d;
    padding: 4px 8px;
    z-index: 15;
  }
  .CodeMirror-dialog input {
    border: none;
    background: transparent;
    color: #7ec8e3;
    outline: none;
    font-family: inherit;
    width: 90%;
  }
  .out { color: #a0d6a0; }
  .err { color: #d6a0a0; }
  .info { color: #7ec8e3; }
  .prompt { color: #7ec8e3; }
  .dir { color: #7ec8e3; }
  .file { color: #e0e0e0; }
</style>
</head>
<body>

<div id="terminal">
  <div id="prompt-line"><span id="prompt" class="prompt"></span><span id="input-span"></span></div>
</div>

<div id="status-bar">
  <span id="status-context">/home</span>
  <span id="status-hint">Tab: complete · Ctrl+L: clear · edit: text editor</span>
</div>

<div id="editor-container">
  <div id="editor-header">
    <span id="editor-filename">untitled</span>
    <span>Ctrl+S save · Esc cancel</span>
  </div>
  <div id="editor-body">
    <textarea id="editor-textarea" spellcheck="false"></textarea>
  </div>
</div>

<input id="hidden-input" type="text" autofocus spellcheck="false" autocomplete="off" aria-hidden="true" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/keymap/vim.min.js"></script>
<!-- pako (zlib): git object inflation for GitFS (vendored in www/vendor/) -->
<script src="vendor/pako.min.js"></script>
<!-- Bare-specifier resolution for the WASM runtime packages (vendored in www/vendor/) -->
<script type="importmap">
{
  "imports": {
    "@wasmer/wasi": "./vendor/wasmer-wasi.mjs",
    "@wasmer/wasmfs": "./vendor/wasmer-wasmfs.mjs",
    "@6over3/zeroperl-ts": "./vendor/zeroperl.mjs"
  }
}
</script>
<script type="module">
import { fs } from "../src/fs/index.js";
import { formatAge } from "../src/fs/lscache.js";
import { WasmRunner } from "../src/wasm.js";
import { WasmerRegistry } from "../src/wasmer.js";
import { env, expandRef } from "../src/env.js";
import { watToWasm } from "../src/wabt-loader.js";
import { bashToJS, runBash, buildSh2LibFacade } from "../src/bash2js.js";
import { createSh2Runtime } from "../src/sh2runtime.js";
import { getManPage, manIndex, searchManPages, MAN_PAGES } from "../src/manpages.js";
const wasmRunner = new WasmRunner(fs);
const sh2libFacade = buildSh2LibFacade(fs);  // debashl toolchain, injected into .js commands

// Writes to read-only mounts (github/gitlab/http/git) land in a local
// overlay via OverlayFS — surface the fork/login notice to the user.
fs.onOverlayWrite = (path, mountName) => {
  write(`Warning: ${path} is on the read-only ${mountName} mount. Your write is saved locally in an overlay — you will not be able to commit until you fork or (re)login.\n`, "err");
};
const wasmerReg = new WasmerRegistry(fs);

// Pipe input for the current command — the previous pipeline segment's
// captured stdout. Builtins that read stdin (head, ...) consume this.
let stdinBuffer = "";

// ─── Terminal Output ───────────────────────────────────────────

const term = document.getElementById("terminal");
const input = document.getElementById("hidden-input");
const promptLine = document.getElementById("prompt-line");
const promptEl = document.getElementById("prompt");
const inputSpan = document.getElementById("input-span");
const statusContext = document.getElementById("status-context");
const statusHint = document.getElementById("status-hint");

// Inline line editing (like a real shell): the prompt + typed line + a
// blinking block cursor live in #prompt-line, the last child of the
// terminal. Typing updates currentLine; Enter commits it.
let currentLine = "";
// While non-null, write() appends into this element instead of the
// terminal — the init banner routes into the motd column of the
// welcome row so the xkcd comic can sit to its right.
let welcomeText = null;
// su — remembers the previous user context so `su tinysh` returns home.
const suState = { prev: null };
let cursorPos = 0;

// ANSI SGR palette mapped onto the terminal's colors (used by `ls`:
// dirs blue, executables green, files white).
const ansiPalette = {
  "30": "#333333", "31": "#d6a0a0", "32": "#a0d6a0", "33": "#d6d6a0",
  "34": "#7ec8e3", "35": "#d6a0d6", "36": "#a0d6d6", "37": "#e0e0e0",
  "90": "#8b949e", "91": "#d6a0a0", "92": "#a0d6a0", "93": "#d6d6a0",
  "94": "#7ec8e3", "95": "#d6a0d6", "96": "#a0d6d6", "97": "#e0e0e0",
};

// Tracks whether the last thing written to the terminal ended with a
// newline — used so the next prompt line always starts on a fresh row.
let lastCharNewline = true;

function write(text, cls = "out", opts = {}) {
  if (opts.record !== false) recordOutput(sgrWrap(text, cls));  // asciinema capture (no-op unless recording)
  const appendSpan = (span) => {
    if (welcomeText) {
      // init banner: motd goes into the left column of the welcome row
      welcomeText.appendChild(span);
    } else {
      // Output goes before the prompt line so it stays the last visible
      // line. While a command is running, output goes above the busy
      // spinner instead, so the spinner always sits where the next
      // prompt will be.
      term.insertBefore(span, spinner.active ? spinner.el : promptLine);
    }
    term.scrollTop = term.scrollHeight;
  };
  // Fast path: plain text (the common case) — no escape processing.
  if (!text.includes("\x1b[")) {
    const plain = document.createElement("span");
    plain.className = cls;
    plain.textContent = text;
    appendSpan(plain);
    lastCharNewline = text.endsWith("\n");
    return;
  }
  // ANSI SGR sequences (\x1b[<code>m) → colored spans. Only `ls` emits
  // these today; anything else would have shown the escapes literally.
  const re = /\x1b\[([0-9;]*)m/g;
  let last = 0, m, color = "";
  const appendChunk = (chunk, c) => {
    const span = document.createElement("span");
    span.className = cls;
    if (c) span.style.color = c;
    span.textContent = chunk;
    appendSpan(span);
  };
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) appendChunk(text.slice(last, m.index), color);
    const code = m[1] || "0";
    color = code === "0" ? "" : (ansiPalette[code] || "");
    last = m.index + m[0].length;
  }
  if (last < text.length) appendChunk(text.slice(last), color);
  term.scrollTop = term.scrollHeight;
  lastCharNewline = text.endsWith("\n");
}

// The prompt string for the current mode (shell / REPL / pager).
function getPromptStr() {
  if (pagerState.active) return "";       // pager draws its own marker
  if (replState.active) return replState.mode === "perl" ? "perl> " : ">>> ";
  const user = env.USER && env.USER !== "tinysh" ? env.USER : "tinysh";
  return `${user}:${fs.view ? fs.view(fs.cwd) : fs.cwd}$ `;
}

// Redraw the inline input line: prompt + typed text + blinking cursor.
function renderInput() {
  promptEl.textContent = getPromptStr();
  inputSpan.textContent = "";
  const before = document.createTextNode(currentLine.slice(0, cursorPos));
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.textContent = currentLine[cursorPos] || " ";
  const after = document.createTextNode(currentLine.slice(cursorPos + 1));
  inputSpan.append(before, cursor, after);
  term.scrollTop = term.scrollHeight;
}

// Print a fresh shell prompt line into the scrollback, so it's clear
// the previous command finished and the shell is ready again.
function writeShellPrompt() {
  if (!lastCharNewline) write("\n");
  currentLine = "";
  cursorPos = 0;
  // Keep asciinema recordings faithful: the prompt is visible on screen
  recordOutput(sgrWrap(getPromptStr(), "prompt"));
  renderInput();
  updateStatusBar();
}

// ─── Busy spinner ──────────────────────────────────────────────
// Slow commands (ls /github/..., cat of a remote file, ...) take a
// visible while — the GitHub API call alone is a network round-trip.
// While one runs we draw an ASCII spinner where the next prompt will
// appear and only draw the prompt once the command's output has been
// printed, so the shell never looks idle mid-command. Fast commands
// finish before the debounce and never flicker. The spinner is pure
// DOM — it is not recorded into asciinema casts (it isn't real
// terminal output).
const spinner = {
  active: false,
  el: null,
  timer: null,
  interval: null,
  token: 0,
  frame: 0,
  label: "",
  frames: ["/", "|", "\\", "-"],
};

// Begin the spinner for a command; debounced so quick commands
// (echo, cd, ...) don't flash a frame.
function spinnerStart(label) {
  const token = ++spinner.token;
  spinner.label = (label || "").slice(0, 40);
  spinner.frame = 0;
  spinner.timer = setTimeout(() => {
    if (spinner.token !== token) return;
    spinner.active = true;
    const el = document.createElement("span");
    el.className = "info";
    el.textContent = spinner.frames[0] + " " + spinner.label;
    term.insertBefore(el, promptLine);
    spinner.el = el;
    spinner.interval = setInterval(() => {
      if (spinner.token !== token) return;
      spinner.frame = (spinner.frame + 1) % spinner.frames.length;
      if (spinner.el) spinner.el.textContent = spinner.frames[spinner.frame] + " " + spinner.label;
    }, 100);
  }, 120);
}

// End the spinner: invalidate any pending timers and remove the line.
function spinnerStop() {
  spinner.token++;  // stale start/interval callbacks bail out
  if (spinner.timer) { clearTimeout(spinner.timer); spinner.timer = null; }
  if (spinner.interval) { clearInterval(spinner.interval); spinner.interval = null; }
  if (spinner.el) { spinner.el.remove(); spinner.el = null; }
  spinner.active = false;
}

// ─── asciinema recording (v2 cast format) ──────────────────────
// Hooks write() to capture terminal output with cumulative timestamps
// (seconds since the recording started — the v2 spec; the asciinema
// player derives per-event delays from these), so a session can be
// replayed later. Native JS is far better here than compiling the
// Python asciinema to WASM — it sees the shell's actual output stream
// directly.
const recording = {
  active: false,
  filepath: null,
  startTime: null,
  events: [],
  width: 80,
  height: 24,
  editor: null,  // GUI editor buffer rendered into the cast as a TUI region
};

// Map write classes to ANSI SGR colours so casts keep the shell's
// colours when played on a real terminal / asciinema.org: the prompt is
// blue (#7ec8e3 ≈ 34), errors red (31), notices gray (90).
const castSgr = { prompt: "34", err: "31", info: "90", out: "" };
function sgrWrap(text, cls) {
  const code = castSgr[cls] || "";
  return code ? `\x1b[${code}m${text}\x1b[0m` : text;
}

// ── GUI editor → cast rendering ─────────────────────────────────
// The vi/edit editors are browser GUI overlays, so a recording would
// otherwise show just a silent gap. While recording, we render the
// buffer into the cast as a TUI-style region (the way a real terminal
// editor would): on open the buffer is printed, and on every CodeMirror
// change the region is redrawn with ANSI cursor-up + erase sequences.
// The browser screen itself is untouched — this is cast-only.
// Region layout: buffer lines L1..Ln, each followed by \r\n, then the
// cursor parks on the empty row below (the "parking row"). A redraw
// moves up n rows, rewrites the lines with \x1b[K per line, then erases
// everything below (\x1b[J) to remove shrunken leftovers.
function recordEditorOpen(content) {
  if (!recording.active) return;
  const width = Number(env.COLUMNS) || 80;
  const height = Number(env.LINES) || 24;
  recording.editor = {
    active: true,
    lines: [],
    width,
    maxVis: Math.max(2, height - 3),  // leave room for prompt + parking row
  };
  recordEditorRedraw(content);
}

function recordEditorRedraw(content) {
  const ed = recording.editor;
  if (!recording.active || !ed || !ed.active) return;
  const lines = (content || "").split("\n");
  if (lines[lines.length - 1] === "") lines.pop();
  // Truncate to the visible area; over-long lines would wrap and break
  // the row math of the redraws.
  const truncated = lines.slice(0, ed.maxVis).map(l =>
    l.length >= ed.width ? l.slice(0, ed.width - 1) : l);
  const n = ed.lines.length;
  let out = "";
  if (n > 0) out += `\x1b[${n}A\r`;  // up to the first buffer row
  for (const l of truncated) out += l + "\x1b[K\r\n";
  out += "\x1b[J";  // erase leftovers below (shrinks, old parking row)
  recordOutput(out);
  ed.lines = truncated;
}

function recordEditorClose() {
  if (recording.editor) recording.editor = null;
}

function startRecording(filepath) {
  recording.active = true;
  recording.filepath = filepath;
  recording.startTime = Date.now();
  recording.events = [];
  recording.width = Number(env.COLUMNS) || 80;
  recording.height = Number(env.LINES) || 24;
}

function recordOutput(text) {
  if (!recording.active || text.length === 0) return;
  // Real terminals need \r\n: a bare \n (line feed) moves down WITHOUT
  // returning the cursor to column 0, so playback would drift right on
  // every line. The browser DOM doesn't care about \r, but asciinema
  // playback does — normalize to \r\n here.
  const data = text.replace(/\r?\n/g, "\r\n");
  // v2 cast timestamps are cumulative: seconds since the recording
  // started. (The asciinema player computes delays between consecutive
  // events itself — feeding it per-event durations makes every delay
  // after the first negative, i.e. instant playback.)
  const t = (Date.now() - recording.startTime) / 1000;
  // Coalesce rapid writes (e.g. per-char prompts) into one event
  const last = recording.events[recording.events.length - 1];
  if (last && last[1] === "o" && t - last[0] < 0.05) {
    last[2] += data;
  } else {
    recording.events.push([t, "o", data]);
  }
}

function stopRecording() {
  if (!recording.active) return null;
  recording.active = false;
  recording.editor = null;
  const cast = {
    version: 2,
    width: recording.width,
    height: recording.height,
    timestamp: Math.floor(recording.startTime / 1000),
    env: { SHELL: "/bin/tinysh" },
  };
  const lines = [JSON.stringify(cast)];
  for (const ev of recording.events) lines.push(JSON.stringify(ev));
  const result = { filepath: recording.filepath, content: lines.join("\n") };
  recording.filepath = null;
  recording.events = [];
  return result;
}

// Replay a v2 cast file with a mini terminal framebuffer.
// Real casts contain \r, backspaces, ANSI cursor movement (CSI A/B/C/D/H/G,
// K, J) and SGR color codes — naive text dumping jams them together and
// loses colour. We render into a character grid, then paint the final
// screen (with colour) through the normal ANSI-aware write().
async function playCast(content) {
  const lines = content.trim().split("\n");
  if (lines.length === 0) return;
  const header = JSON.parse(lines[0]);
  if (header.version !== 2) {
    throw new Error("only v2 cast files are supported");
  }

  const W = Math.max(10, Math.min(500, Number(header.width) || 80));
  const H = Math.max(5, Math.min(200, Number(header.height) || 24));
  // screen[r][c] = { ch, code } where code is the SGR code ('' = default)
  let screen = Array.from({ length: H }, () =>
    Array.from({ length: W }, () => ({ ch: " ", code: "" })));
  let row = 0, col = 0, cur = "";  // cur = current SGR code

  const blankRow = () => Array.from({ length: W }, () => ({ ch: " ", code: "" }));
  const scroll = () => {
    screen.shift();
    screen.push(blankRow());
    row = Math.max(0, row - 1);
  };
  const put = (ch) => {
    if (col >= W) { col = 0; row++; if (row >= H) scroll(); }
    screen[row][col] = { ch, code: cur };
    col++;
  };

  // Handle a CSI sequence like "2J", "5;10H", "31m", "2K", "3A"
  const csi = (seq) => {
    const m = seq.match(/^([0-9;]*)([A-Za-z])$/);
    if (!m) return;
    const params = m[1] ? m[1].split(";").map(Number) : [];
    // Default parameter: K/J erase default to 0 (to end), the rest to 1
    const def = (m[2] === "K" || m[2] === "J") ? 0 : 1;
    const n = params.length ? (params[0] || def) : def;
    switch (m[2]) {
      case "m": // SGR — record the raw code (e.g. "31"), reset on 0
        cur = m[1] === "" || m[1] === "0" ? "" : m[1];
        break;
      case "A": row = Math.max(0, row - n); break;
      case "B": row = Math.min(H - 1, row + n); break;
      case "C": col = Math.min(W - 1, col + n); break;
      case "D": col = Math.max(0, col - n); break;
      case "G": col = Math.max(0, Math.min(W - 1, n - 1)); break;
      case "H": row = Math.max(0, Math.min(H - 1, (params[0] || 1) - 1));
                col = Math.max(0, Math.min(W - 1, (params[1] || 1) - 1)); break;
      case "K": // erase line: 0=to end, 1=from start, 2=whole
        if (n === 2) screen[row] = blankRow();
        else if (n === 1) for (let c = 0; c <= col; c++) screen[row][c] = { ch: " ", code: "" };
        else for (let c = col; c < W; c++) screen[row][c] = { ch: " ", code: "" };
        break;
      case "J": // erase screen
        if (n === 2) {
          screen = Array.from({ length: H }, blankRow);
          row = 0; col = 0;
        } else if (n === 1) {
          for (let r = 0; r <= row; r++) screen[r] = blankRow();
          col = 0;
        } else {
          for (let r = row; r < H; r++) screen[r] = blankRow();
        }
        break;
    }
  };

  const feed = (text) => {
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === "\r") { col = 0; continue; }
      if (ch === "\n") { col = 0; row++; if (row >= H) scroll(); continue; }
      if (ch === "\b") { col = Math.max(0, col - 1); continue; }
      if (ch === "\t") { col = Math.min(W - 1, Math.ceil((col + 1) / 8) * 8); continue; }
      if (ch === "\x1b") {
        if (text[i + 1] === "[") {
          let k = i + 2;
          while (k < text.length && !/[A-Za-z]/.test(text[k])) k++;
          if (k < text.length) { csi(text.slice(i + 2, k + 1)); i = k; }
        } else if (text[i + 1] === "]") {
          // OSC (e.g. title) — skip until BEL or ST
          let k = i + 2;
          while (k < text.length && text[k] !== "\x07" && !(text[k] === "\x1b" && text[k + 1] === "\\")) k++;
          i = k;  // consume the terminator too via loop increment
        }
        continue;
      }
      put(ch);
    }
  };

  // Playback renders into a container we rebuild per frame, so the cast
  // plays progressively (the spinner sits below the output meanwhile).
  const player = document.createElement("div");
  player.className = "cast-player";
  term.insertBefore(player, spinner.active ? spinner.el : promptLine);
  term.scrollTop = term.scrollHeight;

  // Paint the current screen as DOM (rows carry SGR codes → colored
  // spans, exactly like write()); a blinking block cursor marks the
  // terminal's cursor cell.
  let lastPaint = 0;
  const paint = () => {
    player.textContent = "";
    let lastCode = null, buf = "";
    const flushBuf = () => {
      if (!buf) return;
      const span = document.createElement("span");
      span.className = "out";
      if (lastCode && ansiPalette[lastCode]) span.style.color = ansiPalette[lastCode];
      span.textContent = buf;
      player.appendChild(span);
      buf = "";
    };
    const setCode = (code) => { if (code !== lastCode) { flushBuf(); lastCode = code; } };
    const newline = () => {
      flushBuf();
      const nl = document.createElement("span");
      nl.className = "out";
      nl.textContent = "\n";
      player.appendChild(nl);
    };
    const isCursorCell = (r, c) => (r === row && c === col);

    // Trim trailing blank rows (and rows below the cursor) so playback
    // doesn't leave a stack of empty lines.
    let lastRow = 0;
    for (let r = 0; r < H; r++) {
      let end = W - 1;
      while (end >= 0 && screen[r][end].ch === " ") end--;
      if (end >= 0 || isCursorCell(r, 0)) lastRow = r;
    }
    for (let r = 0; r <= lastRow; r++) {
      let end = W - 1;
      while (end >= 0 && screen[r][end].ch === " ") end--;
      const rowEnd = isCursorCell(r, 0)
        ? Math.max(end, Math.min(W - 1, col))
        : end;
      for (let c = 0; c <= rowEnd; c++) {
        const cell = screen[r][c];
        if (isCursorCell(r, c)) {
          setCode(cell.code);
          flushBuf();
          const cur = document.createElement("span");
          cur.className = "cursor";
          cur.textContent = cell.ch === " " ? " " : cell.ch;
          player.appendChild(cur);
        } else {
          setCode(cell.code);
          buf += cell.ch;
        }
      }
      setCode("");
      newline();
    }
    flushBuf();
    term.scrollTop = term.scrollHeight;
  };
  const maybePaint = () => {
    const now = Date.now();
    if (now - lastPaint >= 60) { lastPaint = now; paint(); }
  };

  // v2 cast timestamps are cumulative (seconds since recording start)
  // — the delay between consecutive events is what we wait for.
  let prevTime = 0;
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    let ev;
    try { ev = JSON.parse(line); } catch { continue; }
    if (ev[1] !== "o") continue;
    const t = Math.max(0, Number(ev[0]) || 0);
    const delta = t - prevTime;
    prevTime = t;
    if (delta > 0) await new Promise((r) => setTimeout(r, delta * 1000));
    feed(String(ev[2]));
    maybePaint();
  }

  paint();  // final frame
}

function clearViewport() {
  // Erase only the visible viewport, keeping the scrollback (lines the
  // user has scrolled above) intact — like a real terminal's `clear`,
  // which blanks the screen but leaves saved lines reachable by
  // scrolling up (unlike `reset`, which wipes scrollback too).
  const children = Array.from(term.children);
  if (children.length === 0) return;

  const top = term.scrollTop;
  const bottom = top + term.clientHeight;

  // Find the first/last line intersecting the viewport. A line that
  // only peeks into the viewport is erased whole, just as a real
  // terminal erases entire rows.
  let y = 0;
  let first = -1;
  let last = -1;
  for (let i = 0; i < children.length; i++) {
    const h = children[i].offsetHeight;
    if (y + h > top && y < bottom) {
      if (first === -1) first = i;
      last = i;
    }
    y += h;
    if (y >= bottom && first !== -1) break;
  }
  if (first === -1) return;

  // Remove the visible lines (newest first so indices stay valid),
  // but never the prompt line itself.
  for (let i = last; i >= first; i--) {
    if (children[i] !== promptLine) children[i].remove();
  }

  // Pad below the scrollback with a blank area so the bottom of the
  // terminal looks empty; scroll up to reach the preserved history.
  // The spacer goes before the prompt line, which stays last.
  const spacer = document.createElement("div");
  spacer.style.height = term.clientHeight + "px";
  term.insertBefore(spacer, promptLine);
  term.scrollTop = term.scrollHeight;
}

const stdout = { write: (s) => { if (!suppressOutput) write(s, "out"); } };
const stderr = { write: (s) => { if (!suppressOutput) write(s, "err"); } };

// ─── Ctrl+C (SIGINT) interruption ──────────────────────────────
// A real shell delivers SIGINT to the foreground process; here that
// means: abort the running command and return to the prompt with
// status 130 (128 + SIGINT). JavaScript can't hard-kill an in-flight
// async function, so we race the command against an interrupt signal
// and abandon it — remaining output from the aborted command is
// suppressed until it settles (or a newer command takes over), and
// the shell is immediately usable again. At an idle prompt, Ctrl+C
// cancels the current input line.
class InterruptError extends Error {
  constructor() { super("interrupt"); this.name = "InterruptError"; }
}
let running = false;        // a command is executing right now
let interruptSignal = null; // rejects the running command's race
let suppressOutput = false; // drop output from an aborted command
let runId = 0;              // bumped per command — stale aborts don't linger

// Run a command's promise so that Ctrl+C can abort it. Returns the
// command's exit code (130 if interrupted).
async function runInterruptible(promise) {
  const myId = ++runId;
  suppressOutput = false;
  running = true;
  let rejectFn = null;
  interruptSignal = () => { if (rejectFn) rejectFn(new InterruptError()); };
  const interruptible = new Promise((_, reject) => { rejectFn = reject; });

  let code = 0;
  try {
    code = await Promise.race([promise, interruptible]);
  } catch (e) {
    if (e instanceof InterruptError) {
      code = 130; // 128 + SIGINT, like a real shell
      suppressOutput = true;
      // The aborted command is still winding down in the background;
      // drop its remaining output until it settles (unless a newer
      // command has already started and taken over the terminal).
      Promise.resolve(promise).catch(() => {}).finally(() => {
        if (runId === myId) suppressOutput = false;
      });
    } else {
      throw e;
    }
  } finally {
    running = false;
    interruptSignal = null;
  }
  return code;
}

// Ctrl+C entry point — what happens depends on what's on screen:
// a pager exits, the Python REPLs bail out, a running command is
// aborted, and an idle prompt just gets a fresh line.
function handleInterrupt() {
  if (pagerState.active) {
    write("^C\n", "info");
    exitPager();
    input.focus();
    return;
  }
  if (replState.active) {
    // Reactor REPL: can't interrupt a running asyncify'd line, but ^C
    // clears the current line and gives a fresh prompt (like
    // KeyboardInterrupt); Ctrl+D exits.
    write("^C\n", "info");
    write("KeyboardInterrupt\n", "err");
    currentLine = "";
    cursorPos = 0;
    updatePrompt();
    input.focus();
    return;
  }
  if (running) {
    // Abort the foreground command: print ^C, then reject its race.
    write("^C\n", "info");
    suppressOutput = true;
    if (interruptSignal) interruptSignal();
    input.focus();
    return;
  }
  // Idle — cancel the current input line and redraw the prompt.
  currentLine = "";
  cursorPos = 0;
  write("^C\n", "info");
  writeShellPrompt();
  input.focus();
  lastMatches = [];
}

// ─── Terminal size (COLUMNS × LINES) ────────────────────────────
// Like a real tty, the terminal is a monospace character grid. We
// measure the cell from a hidden probe (same font as the shell) and
// keep COLUMNS/LINES in sync as the window resizes, so width-aware
// commands (`ls`, `stty size`, `resize`) adapt to the live size.

const termProbe = document.createElement("div");
termProbe.className = "term-probe";
termProbe.textContent = "M";
document.body.appendChild(termProbe);

function measureTermCell() {
  // visibility:hidden keeps layout metrics measurable; inline-block
  // shrink-wraps the probe around the single monospace glyph.
  const charW = termProbe.offsetWidth;
  const lineH = termProbe.offsetHeight;
  return { charW: charW || 8, lineH: lineH || 16 };
}

function updateTermSize() {
  const { charW, lineH } = measureTermCell();
  const cs = getComputedStyle(term);
  const width = Math.max(40, term.clientWidth
    - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const height = Math.max(10, term.clientHeight
    - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  const cols = Math.max(2, Math.floor(width / charW));
  const rows = Math.max(1, Math.floor(height / lineH));
  env.COLUMNS = String(cols);
  env.LINES = String(rows);
  return { cols, rows };
}

// Re-measure whenever the browser window changes size (this also
// covers zoom) and once fonts are ready, in case metrics shift.
window.addEventListener("resize", updateTermSize);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => updateTermSize());
}

// ─── Text Editor ───────────────────────────────────────────────

const editorContainer = document.getElementById("editor-container");
const editorTextarea = document.getElementById("editor-textarea");
const editorFilename = document.getElementById("editor-filename");

let editorFilepath = null;
let editorCallback = null;
let editorOnClose = null;
let cm = null;

function openEditor(filepath, initialContent, onSave, onClose) {
  spinnerStop();  // editor is a modal overlay — nothing to spin behind it
  editorFilepath = filepath;
  editorCallback = onSave;
  editorOnClose = onClose;
  editorFilename.textContent = `Editing: ${filepath}`;
  editorContainer.classList.add("active");
  input.disabled = true;
  if (recording.active) recordEditorOpen(initialContent);

  // Initialize CodeMirror on the textarea
  cm = CodeMirror.fromTextArea(editorTextarea, {
    value: initialContent,
    mode: "text/plain",
    theme: "monokai",
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
    extraKeys: {
      "Ctrl-S": () => closeEditor(true),
      "Cmd-S": () => closeEditor(true),
      "Esc": () => {
        const val = cm.getValue();
        if (val !== "") {
          if (confirm("Discard unsaved changes?")) closeEditor(false);
        } else {
          closeEditor(false);
        }
      }
    }
  });
  // Render buffer changes into the cast while recording (skip the
  // initial setValue — recordEditorOpen already drew the buffer)
  cm.on("change", (cm2, change) => {
    if (recording.active && change.origin !== "setValue") recordEditorRedraw(cm.getValue());
  });
  cm.setValue(initialContent);
  cm.focus();
  cm.setCursor(0, 0);
}

function closeEditor(save) {
  const doClose = () => {
    // Destroy CodeMirror and restore the textarea
    if (cm) {
      cm.toTextArea();
      cm = null;
    }
    editorContainer.classList.remove("active");
    input.disabled = false;
    const onClose = editorOnClose;
    editorFilepath = null;
    editorCallback = null;
    editorOnClose = null;
    recordEditorClose();
    write(`[editor closed] ${save ? "saved" : "cancelled"}\n`, "info");
    if (onClose) onClose();
    input.focus();
  };

  if (save && editorCallback) {
    const content = cm.getValue();
    Promise.resolve(editorCallback(content))
      .then(doClose)
      .catch((e) => {
        stderr.write(`write failed: ${editorFilepath}: ${e.message}\n`);
      });
  } else {
    doClose();
  }
}

// ─── Vi-like editor (CodeMirror vim keymap) ─────────────────────

let viState = {
  filepath: null,
  callback: null,
  onClose: null,
  mode: "normal",
  dirty: false,
};

function updateViModeDisplay() {
  const modeLabel = document.getElementById("editor-mode");
  if (modeLabel) {
    modeLabel.textContent = viState.mode.toUpperCase();
    modeLabel.style.color = viState.mode === "insert" ? "#a0d6a0" : "#7ec8e3";
  }
}

function openViEditor(filepath, initialContent, onSave, onClose) {
  spinnerStop();  // editor is a modal overlay — nothing to spin behind it
  viState.filepath = filepath;
  viState.callback = onSave;
  viState.onClose = onClose;
  viState.mode = "normal";
  viState.dirty = false;

  editorFilename.textContent = `Editing: ${filepath}`;
  editorContainer.classList.add("active");
  input.disabled = true;
  if (recording.active) recordEditorOpen(initialContent);

  // Ensure the mode indicator element exists in the header
  const headerRight = document.querySelector("#editor-header span:last-child");
  if (headerRight) {
    headerRight.textContent = "";
    const mode = document.createElement("span");
    mode.id = "editor-mode";
    mode.textContent = "NORMAL";
    mode.style.marginLeft = "12px";
    mode.style.fontWeight = "bold";
    mode.style.color = "#7ec8e3";
    headerRight.appendChild(mode);
  }

  cm = CodeMirror.fromTextArea(editorTextarea, {
    value: initialContent,
    mode: "text/plain",
    theme: "monokai",
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
    keyMap: "vim",
  });

  // Track mode changes
  cm.on("vim-mode-change", (m) => {
    viState.mode = m.mode || "normal";
    updateViModeDisplay();
  });

  // Track dirty state — ignore the initial setValue (it's not a user edit)
  cm.on("change", (cm2, change) => {
    if (change.origin !== "setValue") {
      viState.dirty = true;
      if (recording.active) recordEditorRedraw(cm.getValue());
    }
  });

  cm.setValue(initialContent);
  cm.focus();
  cm.setCursor(0, 0);
  updateViModeDisplay();
}

async function saveViFile() {
  const content = cm.getValue();
  try {
    if (viState.callback) {
      await viState.callback(content);
    }
    viState.dirty = false;
    write(`[saved] ${viState.filepath}\n`, "info");
  } catch (e) {
    stderr.write(`write failed: ${viState.filepath}: ${e.message}\n`);
  }
}

function closeViEditor() {
  if (cm) cm.toTextArea();
  cm = null;
  editorContainer.classList.remove("active");
  input.disabled = false;
  const filepath = viState.filepath;
  const onClose = viState.onClose;
  viState = { filepath: null, callback: null, onClose: null, mode: "normal", dirty: false };
  recordEditorClose();
  write(`[vi closed] ${filepath}\n`, "info");
  if (onClose) onClose();
  input.focus();
}

// Register vim ex commands (:w, :q, :wq, :x, :q!)
function registerViExCommands() {
  if (!CodeMirror.Vim) return;
  const vim = CodeMirror.Vim;

  // defineEx(name, prefix, func) — name must start with prefix.
  vim.defineEx("write", "w", () => saveViFile());
  vim.defineEx("wq", "wq", () => { saveViFile().then(closeViEditor); });
  vim.defineEx("xit", "x", () => { saveViFile().then(closeViEditor); });
  vim.defineEx("quit", "q", (cm2, params) => {
    // :q! is parsed as command 'q' with '!' as an argument — detect it
    // by inspecting the full input string.
    const isForce = params && params.input && params.input.trim().endsWith("!");
    if (viState.dirty && !isForce) {
      write("E37: No write since last change (use :q! to discard)\n", "err");
    } else {
      closeViEditor();
    }
  });
}

// Call after CodeMirror + vim keymap load
registerViExCommands();

// ─── C pre-processing for the subset compiler ───────────────────
// The c-to-wasm-compiler supports a C subset: no preprocessor, no
// stdio printf. It exposes custom runtime functions that must be
// declared: print/println/print_int/println_real/etc. (its own test
// files do exactly this). preprocessC() lets users write standard-ish
// C — #include <stdio.h> + printf — by stripping #lines, injecting
// the runtime declarations, and rewriting printf calls.
let ccCounter = 0;

const C_RUNTIME_DECLS =
  `void _ln();\n` +
  `void print(const char*);\n` +
  `void println(const char*);\n` +
  `void print_int(int);\n` +
  `void print_real(float);\n` +
  `void println_int(int);\n` +
  `void println_real(float);\n`;

function rewritePrintf(code) {
  // printf("text\n") → println("text")  ;  printf("text") → print("text")
  code = code.replace(/printf\s*\(\s*("(?:[^"\\]|\\.)*")\s*\)\s*;/g,
    (m, lit) => lit.endsWith('\\n"')
      ? "println(" + lit.slice(0, -3) + '");'
      : "print(" + lit + ");");
  // printf("%d\n", x) → println_int(x)  ;  printf("%d", x) → print_int(x)
  code = code.replace(/printf\s*\(\s*("(?:[^"\\]|\\.)*")\s*,\s*([^;]+?)\s*\)\s*;/g,
    (m, fmt, arg) => {
      const nl = fmt.endsWith('\\n"');
      if (/%d|%i/.test(fmt)) return (nl ? "println_int(" : "print_int(") + arg + ");";
      if (/%f|%lf/.test(fmt)) return (nl ? "println_real(" : "print_real(") + arg + ");";
      if (/%s/.test(fmt)) return (nl ? "println(" : "print(") + arg + ");";
      return m; // unsupported format — compiler will report it
    });
  return code;
}

function preprocessC(src) {
  // Strip preprocessor lines (#include, #define, ...) — no # support
  const body = src.split("\n").filter(l => !l.trim().startsWith("#")).join("\n");
  // Inject runtime declarations unless the user already declared them
  return body.includes("println_int(") ? rewritePrintf(body) : rewritePrintf(C_RUNTIME_DECLS + body);
}

// ─── Binary content detection ───────────────────────────────────
// If a text read contains NUL bytes or an unusual ratio of control
// characters, it's binary — don't dump it as garbage.
function looksBinary(text) {
  if (!text || text.length === 0) return false;
  let control = 0;
  const sample = Math.min(text.length, 4096);
  for (let i = 0; i < sample; i++) {
    const c = text.charCodeAt(i);
    // NUL, control chars, or UTF-8 replacement char (0xFFFD = mangled binary)
    if (c === 0 || (c < 32 && c !== 9 && c !== 10 && c !== 13) || c === 0xFFFD) {
      control++;
    }
  }
  return control > sample * 0.10;  // >10% binary-ish chars → binary
}

// ─── Built-in Commands ─────────────────────────────────────────

const builtins = {
  async ls(args) {
    // Parse flags: -l (long format with permissions/size/date)
    let long = false;
    const dirs = [];
    for (const a of args) {
      if (a === "-l" || a === "--long" || a === "-la" || a === "-al") {
        long = true;
      } else if (a.startsWith("-")) {
        stderr.write(`ls: invalid option -- '${a}'\n`);
        return 2;
      } else {
        dirs.push(a);
      }
    }
    if (dirs.length === 0) dirs.push(".");
    let hadError = false;
    for (const dir of dirs) {
      try {
        const output = await fs.formatList(dir, { long, width: Number(env.COLUMNS) || 80 });
        if (!output) continue;
        if (dirs.length > 1) stdout.write(`${dir}:\n`);
        stdout.write(output);
        // Note when a remote listing came from the persistent ls cache
        // (24h TTL) — "cached 3h ago" beats a silent, unexplained list.
        // A fresh fetch also writes the cache (age ≈ 0) and a cd into a
        // remote dir fetches + caches too, so "cached" is decided by
        // whether THIS listing hit the API (rate info) or not (cache
        // age) rather than by a fixed age cut-off.
        const cacheNote = await fs.cacheInfo(dir);
        const rate = await fs.rateInfo(dir);
        if (cacheNote && cacheNote.stale) {
          // Last-resort fallback (API down / rate-limited)
          write(`  (cached ${formatAge(cacheNote.age)} — API unavailable, stale)\n`, "info");
        } else if (rate && rate.limit > 0) {
          // Fresh request — report the API's rolling-hour usage from the
          // response headers (exact for the IP, not an estimate).
          const used = Math.max(0, rate.limit - rate.remaining);
          write(`  (${rate.name}: ${used}/${rate.limit} API requests used ${rate.period})\n`, "info");
        } else if (cacheNote) {
          // Served from cache — a just-completed cd fetched and cached
          // this dir, so an ls right after hits the cache (age < 1min).
          write(`  (cached ${formatAge(cacheNote.age)})\n`, "info");
        }
      } catch (e) {
        hadError = true;
        stderr.write(`ls: ${dir}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  async cat(args) {
    if (args.length === 0) {
      // No files — read from stdin (pipe input)
      stdout.write(stdinBuffer);
      if (stdinBuffer && !stdinBuffer.endsWith("\n")) stdout.write("\n");
      return 0;
    }
    let hadError = false;
    for (const file of args) {
      const ext = file.split(".").pop().toLowerCase();
      const isImage = ["png", "jpg", "jpeg", "gif", "svg", "webp", "bmp", "ico"].includes(ext);
      const isAudio = ["mp3", "wav", "ogg", "m4a", "flac", "wma"].includes(ext);

      if (isImage || isAudio) {
        try {
          const blob = await fs.readBlob(file);
          // Set a proper MIME type so the browser renders correctly
          const extMime = {
            png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
            gif: "image/gif", svg: "image/svg+xml", webp: "image/webp",
            bmp: "image/bmp", ico: "image/x-icon",
            mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg",
            m4a: "audio/mp4", flac: "audio/flac", wma: "audio/x-ms-wma",
          }[ext];
          const typedBlob = blob.type
            ? blob
            : new Blob([blob], { type: extMime || "application/octet-stream" });
          const url = URL.createObjectURL(typedBlob);
          const el = isImage
            ? `<img src="${url}" style="max-width: 80vw; max-height: 60vh; border-radius: 4px; margin: 4px 0;" />`
            : `<audio controls src="${url}" style="width: 100%; max-width: 400px; margin: 4px 0;"></audio>`;
          const span = document.createElement("span");
          span.innerHTML = el;
          term.insertBefore(span, promptLine);
          term.scrollTop = term.scrollHeight;
          // Revoke blob URL after a delay to free memory
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) {
          hadError = true;
          stderr.write(`cat: ${file}: ${e.message}\n`);
        }
      } else {
        try {
          let content = await fs.read(file);
          // Refuse to dump binary content as text — show a warning instead
          if (looksBinary(content)) {
            stderr.write(`cat: ${file}: binary file (use 'cp ${file} /pc' to download or view via edit)\n`);
            continue;
          }
          stdout.write(content);
          if (!content.endsWith("\n")) stdout.write("\n");
        } catch (e) {
          hadError = true;
          stderr.write(`cat: ${file}: ${e.message}\n`);
        }
      }
    }
    return hadError ? 1 : 0;
  },

  async echo(args) {
    stdout.write(args.join(" ") + "\n");
    return 0;
  },

  async pwd(args) {
    stdout.write((fs.view ? fs.view(fs.cwd) : fs.cwd) + "\n");
    return 0;
  },

  async true(args) {
    // Always succeeds (exit 0) — handy with `&&`
    return 0;
  },

  async false(args) {
    // Always fails (exit 1) — handy with `||`
    return 1;
  },

  async cd(args) {
    const dir = args[0] || env.HOME;
    try {
      await fs.list(dir);
      fs.cwd = fs._resolve(dir);
      env.PWD = fs.cwd;
      // cd into a remote mount may have just fetched (and cached) the
      // listing — surface the API usage from that fetch, like ls does.
      // (ls right after will show "cached just now" instead.)
      const rate = await fs.rateInfo(dir);
      if (rate && rate.limit > 0) {
        const used = Math.max(0, rate.limit - rate.remaining);
        write(`  (${rate.name}: ${used}/${rate.limit} API requests used ${rate.period})\n`, "info");
      }
      return 0;
    } catch (e) {
      stderr.write(`cd: ${dir}: ${e.message}\n`);
      return 1;
    }
  },

  async export(args) {
    // export [NAME[=VALUE]...] — set environment variables.
    // `export` or `export -p` prints all variables in POSIX form.
    // `export NAME=value` sets NAME to value (split on the first '=');
    // `export NAME` sets NAME to an empty string, like bash.
    // Invalid identifiers are reported and skipped; exit status is 1
    // if any argument was invalid.
    if (args.length === 0 || (args.length === 1 && args[0] === "-p")) {
      for (const key of Object.keys(env).sort()) {
        stdout.write(`export ${key}=${env[key]}\n`);
      }
      return 0;
    }
    let hadError = false;
    for (const arg of args) {
      if (arg === "-p") continue; // harmless to accept alongside assignments
      const eq = arg.indexOf("=");
      const name = eq === -1 ? arg : arg.slice(0, eq);
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        hadError = true;
        stderr.write(`export: '${arg}': not a valid identifier\n`);
        continue;
      }
      env[name] = eq === -1 ? "" : arg.slice(eq + 1);
    }
    return hadError ? 1 : 0;
  },

    let hadError = false;
    for (const file of args) {
      try {
        await fs.stat(file); // fail on nonexistent paths, like real rm
        await fs.remove(file);

      catch (e) { hadError = true; stderr.write(`rm: ${file}: ${e.message}\n`); }

    if (args.length === 0) { stderr.write("mkdir: missing operand\n"); return 2; }

    for (const dir of args) {

        const r = fs._resolve(dir);
        const parent = fs._resolve(r + "/..");

        stderr.write(`mkdir: ${dir}: ${e.message}\n`);

  async cp(args) {
    if (args.length < 2) { stderr.write("cp: missing operand\n"); return 2; }
    const src = args[0];
    let dest = args[1];
    // If dest is a directory (trailing /), a bare mount point like /pc,
    // or the current dir '.' — append the source basename
    const base = src.split("/").pop();
    if (dest.endsWith("/") || dest === "/pc" || dest === "." || dest === "..") {
      dest = dest.endsWith("/") ? dest + base : dest + "/" + base;
    }
    try {
      // Binary-aware copy: use readBlob/writeBlob when the backend supports it
      try {
        const blob = await fs.readBlob(src);
        await fs.writeBlob(dest, blob);
      } catch {
        const content = await fs.read(src);
        await fs.write(dest, content);
      }
      if (dest.startsWith("/pc")) {
        stdout.write(`Downloading: ${dest.split("/").pop()}\n`);
      }
      return 0;
    } catch (e) {
      stderr.write(`cp: ${src}: ${e.message}\n`);
      return 1;
    }
  },

  async mv(args) {
    if (args.length < 2) { stderr.write("mv: missing operand\n"); return 2; }
    try {
      const content = await fs.read(args[0]);
      await fs.write(args[1], content);
      await fs.remove(args[0]);
      return 0;
    } catch (e) {
      stderr.write(`mv: ${args[0]}: ${e.message}\n`);
      return 1;
    }
  },

  async head(args) {
    // head [-n N] [file...] — print the first N lines (default 10).
    // With no file arguments, reads from stdin (i.e. a pipe).
    let count = 10;
    const files = [];
    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "-n" || a === "--lines") {
        count = parseInt(args[i + 1], 10);
        if (isNaN(count)) {
          stderr.write(`head: invalid number of lines: '${args[i + 1]}'\n`);
          return 2;
        }
        i++;
      } else if (/^-\d+$/.test(a)) {
        count = parseInt(a.slice(1), 10);
      } else if (a.startsWith("-")) {
        stderr.write(`head: invalid option -- '${a}'\n`);
        return 2;
      } else {
        files.push(a);
      }
    }
    if (count < 0) count = 0;

    const printLines = (content) => {
      if (content === "") return;
      const lines = content.split("\n");
      if (lines[lines.length - 1] === "") lines.pop(); // drop trailing newline
      if (lines.length === 0) return;
      stdout.write(lines.slice(0, count).join("\n") + "\n");
    };

    if (files.length === 0) {
      printLines(stdinBuffer);
      return 0;
    }
    let hadError = false;
    for (const file of files) {
      try {
        const content = await fs.read(file);
        if (files.length > 1) stdout.write(`==> ${file} <==\n`);
        printLines(content);
      } catch (e) {
        hadError = true;
        stderr.write(`head: ${file}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  async grep(args) {
    // grep [-i] [-n] [-v] [-c] [-l] [-r] [-e PATTERN] [--] PATTERN [FILE...]
    // With no FILE arguments, searches stdin (pipe input).
    let ignoreCase = false, lineNumber = false, invert = false;
    let count = false, filesWithMatches = false, recursive = false;
    let pattern = null, patternExplicit = false;
    const patterns = [];
    const files = [];
    let optsDone = false;

    const shortFlags = {
      i: () => ignoreCase = true,
      n: () => lineNumber = true,
      v: () => invert = true,
      c: () => count = true,
      l: () => filesWithMatches = true,
      r: () => recursive = true,
      R: () => recursive = true,
    };

    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "--" && !optsDone) { optsDone = true; continue; }
      if (!optsDone && (a === "-i" || a === "--ignore-case")) ignoreCase = true;
      else if (!optsDone && (a === "-n" || a === "--line-number")) lineNumber = true;
      else if (!optsDone && (a === "-v" || a === "--invert-match")) invert = true;
      else if (!optsDone && (a === "-c" || a === "--count")) count = true;
      else if (!optsDone && (a === "-l" || a === "--files-with-matches")) filesWithMatches = true;
      else if (!optsDone && (a === "-r" || a === "-R" || a === "--recursive")) recursive = true;
      else if (!optsDone && (a === "-e" || a === "--regexp")) {
        if (i + 1 >= args.length) {
          stderr.write(`grep: option requires an argument -- '${a}'\n`);
          return 2;
        }
        pattern = args[++i];
        patterns.push(pattern);
        patternExplicit = true;
      } else if (!optsDone && a.startsWith("--")) {
        stderr.write(`grep: unrecognized option '${a}'\n`);
        return 2;
      } else if (!optsDone && a.startsWith("-") && a.length > 1) {
        // Bundled short flags, e.g. -in or -cv
        let ok = true;
        for (const ch of a.slice(1)) {
          if (shortFlags[ch]) shortFlags[ch]();
          else { ok = false; break; }
        }
        if (!ok) {
          stderr.write(`grep: invalid option -- '${a}'\n`);
          return 2;
        }
      } else if (!patternExplicit && pattern === null) {
        pattern = a;
        patterns.push(a);
      } else {
        files.push(a);
      }
    }

    if (patterns.length === 0) {
      stderr.write("grep: missing pattern\n");
      return 2;
    }
    // Multiple -e patterns match if ANY of them matches (OR)
    const patternSource = patterns.map(p => `(?:${p})`).join("|");

    let re;
    try {
      re = new RegExp(patternSource, ignoreCase ? "i" : "");
    } catch (e) {
      stderr.write(`grep: invalid regular expression: '${patterns.join("', '")}'\n`);
      return 2;
    }

    // Remote mounts would require crawling the network; refuse that and
    // only grep them when a specific file is named.
    const REMOTE = ["/http/", "/github/", "/mount/github/", "/gitlab/", "/mount/gitlab/", "/git/", "/mount/git/"];
    const isRemote = (p) => REMOTE.some(pre => p === pre.slice(0, -1) || p.startsWith(pre));

    const showLabel = files.length > 1 || recursive;

    const processContent = (content, label) => {
      const lines = content.split("\n");
      if (lines[lines.length - 1] === "") lines.pop(); // drop trailing newline
      const hits = [];
      for (let i = 0; i < lines.length; i++) {
        if (re.test(lines[i]) !== invert) hits.push({ num: i + 1, text: lines[i] });
      }
      if (count) {
        stdout.write((showLabel ? label + ":" : "") + hits.length + "\n");
      } else if (filesWithMatches) {
        if (hits.length > 0) stdout.write(label + "\n");
      } else {
        for (const h of hits) {
          stdout.write(
            (showLabel ? label + ":" : "") +
            (lineNumber ? h.num + ":" : "") +
            h.text + "\n"
          );
        }
      }
      return hits.length;
    };

    if (files.length === 0) {
      const hits = processContent(stdinBuffer, "(standard input)");
      return hits > 0 ? 0 : 1;
    }

    // grep exit status: 0 if any line matched, 1 if none did, 2 on error
    let hadError = false;
    let anyHits = 0;

    // Recursively collect files under a directory
    const walk = async (dir) => {
      if (isRemote(dir)) {
        hadError = true;
        stderr.write(`grep: skipping remote mount ${dir} (name specific files to search them)\n`);
        return;
      }
      let entries;
      try { entries = await fs.list(dir); } catch (e) {
        hadError = true;
        stderr.write(`grep: ${dir}: ${e.message}\n`);
        return;
      }
      for (const entry of entries) {
        const clean = entry.replace(/\/$/, "");
        const full = (dir === "/" ? "/" : dir + "/") + clean;
        let st;
        try { st = await fs.stat(full); } catch { continue; }
        if (st.type === "dir") await walk(full);
        else {
          try {
            const content = await fs.read(full);
            anyHits += processContent(content, full);
          } catch (e) {
            hadError = true;
            stderr.write(`grep: ${full}: ${e.message}\n`);
          }
        }
      }
    };

    const seen = new Set();
    for (const file of files) {
      const r = fs._resolve(file);
      if (seen.has(r)) continue;
      seen.add(r);
      if (recursive && isRemote(r)) {
        hadError = true;
        stderr.write(`grep: skipping remote mount ${r} (name specific files to search them)\n`);
        continue;
      }
      try {
        const st = await fs.stat(file);
        if (st.type === "dir") {
          if (recursive) await walk(r);
          else {
            hadError = true;
            stderr.write(`grep: ${file}: Is a directory\n`);
          }
          continue;
        }
        const content = await fs.read(file);
        anyHits += processContent(content, r);
      } catch (e) {
        hadError = true;
        stderr.write(`grep: ${file}: ${e.message}\n`);
      }
    }
    if (hadError) return 2;
    return anyHits > 0 ? 0 : 1;
  },

  async find(args) {
    // find [path...] [expression]
    //   -name PATTERN    match basename, * and ? wildcards (repeatable, AND)
    //   -iname PATTERN   case-insensitive -name
    //   -type f|d        match files or directories
    //   -maxdepth N      descend at most N levels below the start points
    //   -mindepth N      don't apply tests above level N (default 0)
    //   -print           print matching paths (default action)
    const paths = [];
    const namePatterns = [];      // { re } — all must match (AND)
    const types = new Set();
    let maxDepth = Infinity, minDepth = 0;
    let print = true;

    // Remote mounts would require crawling the network; refuse that and
    // only match them when a specific file is named.
    const REMOTE = ["/http/", "/github/", "/mount/github/", "/gitlab/", "/mount/gitlab/", "/git/", "/mount/git/"];
    const isRemote = (p) => REMOTE.some(pre => p === pre.slice(0, -1) || p.startsWith(pre));

    // Build a regex from a shell glob (* and ? wildcards)
    const globToRe = (glob, caseInsensitive) => {
      let reStr = "";
      for (const ch of glob) {
        if (ch === "*") reStr += ".*";
        else if (ch === "?") reStr += ".";
        else reStr += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      return new RegExp("^" + reStr + "$", caseInsensitive ? "i" : "");
    };

    for (let i = 0; i < args.length; i++) {
      const a = args[i];
      if (a === "-name" || a === "-iname") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '${a}'\n`);
          return;
        }
        namePatterns.push({ re: globToRe(args[++i], a === "-iname") });
      } else if (a === "-type") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '-type'\n`);
          return;
        }
        const t = args[++i];
        if (t !== "f" && t !== "d") {
          stderr.write(`find: unknown type '${t}' (use 'f' for file or 'd' for directory)\n`);
          return;
        }
        types.add(t);
      } else if (a === "-maxdepth" || a === "-mindepth") {
        if (i + 1 >= args.length) {
          stderr.write(`find: missing argument to '${a}'\n`);
          return;
        }
        const n = parseInt(args[++i], 10);
        if (isNaN(n) || n < 0) {
          stderr.write(`find: invalid depth '${args[i]}'\n`);
          return;
        }
        if (a === "-maxdepth") maxDepth = n;
        else minDepth = n;
      } else if (a === "-print") {
        print = true;
      } else if (a === "--") {
        // Everything after -- is a start path
        for (const rest of args.slice(i + 1)) paths.push(rest);
        break;
      } else if (a.startsWith("-")) {
        stderr.write(`find: unknown option '${a}'\n`);
        return;
      } else {
        paths.push(a);
      }
    }

    if (paths.length === 0) paths.push(".");

    // Do tests apply at this depth? (-mindepth/-maxdepth gate traversal
    // too, so we never descend past -maxdepth)
    const matched = (name, type, depth) => {
      if (depth < minDepth) return false;
      if (types.size > 0 && !types.has(type)) return false;
      for (const p of namePatterns) {
        if (!p.re.test(name)) return false;
      }
      return true;
    };

    let skippedRemote = false;

    // Recursive walk. `dir` is a resolved absolute path; `depth` is the
    // depth of `dir` itself (start points are depth 0).
    const walk = async (dir, depth) => {
      if (isRemote(dir)) {
        hadError = true;
        if (!skippedRemote) {
          stderr.write(`find: skipping remote mount ${dir} (name specific files to search them)\n`);
          skippedRemote = true;
        }
        return;
      }
      let entries;
      try { entries = await fs.list(dir); } catch (e) {
        hadError = true;
        stderr.write(`find: ${dir}: ${e.message}\n`);
        return;
      }
      for (const entry of entries) {
        const isDir = entry.endsWith("/");
        const name = isDir ? entry.slice(0, -1) : entry;
        const full = (dir === "/" ? "/" : dir + "/") + name;
        let st = null;
        try { st = await fs.stat(full); } catch { /* fall back to entry form */ }
        const type = isDir || (st && st.type === "dir") ? "d" : "f";
        if (matched(name, type, depth + 1) && print) {
          stdout.write(full + (type === "d" ? "/" : "") + "\n");
        }
        if (type === "d" && depth + 1 < maxDepth) {
          await walk(full, depth + 1);
        }
      }
    };

    let hadError = false;
    const seen = new Set();
    for (const path of paths) {
      const r = fs._resolve(path);
      if (seen.has(r)) continue;
      seen.add(r);
      let st;
      try { st = await fs.stat(r); } catch (e) {
        hadError = true;
        stderr.write(`find: ${path}: ${e.message}\n`);
        continue;
      }
      const type = st.type === "dir" ? "d" : "f";
      const base = r.split("/").pop() || "/";
      if (matched(base, type, 0) && print) {
        stdout.write((r === "/" ? "/" : r + (type === "d" ? "/" : "")) + "\n");
      }
      if (type !== "d") continue;
      if (isRemote(r)) {
        hadError = true;
        stderr.write(`find: skipping remote mount ${r} (name specific files to search them)\n`);
        continue;
      }
      if (0 < maxDepth) await walk(r, 0);
    }
    return hadError ? 1 : 0;
  },

  async browse(args) {
    const target = args[0] || fs.cwd;
    const r = fs._resolve(target);
    let url = null;

    // Map virtual paths to real URLs
    const repoMatch = r.match(/^\/(?:github|mount\/github|gitlab|mount\/gitlab)\/([^\/]+)\/([^\/]+)/);
    if (repoMatch) {
      const base = (r.startsWith("/gitlab") || r.startsWith("/mount/gitlab"))
        ? "gitlab.com" : "github.com";
      url = `https://${base}/${repoMatch[1]}/${repoMatch[2]}`;
    } else if (r.startsWith("/http/")) {
      url = "https://" + r.slice(6);
    } else if (r.startsWith("/git/") || r.startsWith("/mount/git/")) {
      const backend = fs._getBackend("/git/");
      const rel = r.startsWith("/git/") ? r.slice(4) : r.slice("/mount/git/".length);
      if (backend && backend.browseUrl) url = await backend.browseUrl(rel);
    } else if (r.startsWith("/mount/github/")) {
      const m = r.match(/^\/mount\/github\/([^\/]+)\/([^\/]+)/);
      if (m) url = `https://github.com/${m[1]}/${m[2]}`;
    }

    // Fallback: user/org page for bare /github/{user} or /gitlab/{user}
    if (!url) {
      const userMatch = r.match(/^\/(?:github|mount\/github|gitlab|mount\/gitlab)\/([^\/]+)/);
      if (userMatch) {
        url = `https://github.com/${userMatch[1]}`;
        // If it's a gitlab path, use gitlab URL
        if (r.startsWith("/gitlab") || r.startsWith("/mount/gitlab")) {
          url = `https://gitlab.com/${userMatch[1]}`;
        }
      }
    }

    if (url) {
      window.open(url, "_blank");
      stdout.write(`Opening: ${url}\n`);
      return 0;
    }
    stderr.write(`browse: no URL mapping for ${r}\n`);
    return 1;
  },

  async play(args) {
    if (args.length === 0) { stderr.write("play: missing filename\n"); return 1; }
    let hadError = false;
    for (const file of args) {
      try {
        const blob = await fs.readBlob(file);
        const url = URL.createObjectURL(blob);
        const el = document.createElement("audio");
        el.controls = true;
        el.autoplay = true;
        el.src = url;
        el.style.width = "100%";
        el.style.maxWidth = "400px";
        el.style.margin = "4px 0";
        term.insertBefore(el, promptLine);
        term.scrollTop = term.scrollHeight;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (e) {
        hadError = true;
        stderr.write(`play: ${file}: ${e.message}\n`);
      }
    }
    return hadError ? 1 : 0;
  },

  bash2js 'echo hello world'   transpile an inline bash script
  bash2js -f script.sh         transpile a file from the virtual FS
  cat script.sh | bash2js      transpile from a pipe

Pipeline:  bash → ESTree (debashl.wasm) → JS (sh2.* runtime);
         falls back to sh2perl → perl2js if debashl is unavailable
The generated JS targets the rt runtime + env; save it to a .js file
and run it as a command.
`);
      return 0;
    }
    let source = null;
    if (args[0] === "-f" || args[0] === "--file") {
      const file = args[1];
      if (!file) { stderr.write("bash2js: -f needs a file name\n"); return 2; }
      try {
        source = await fs.read(file);

        stderr.write(`bash2js: ${file}: ${e.message}\n`);

  async bash(args) {
    // bash 'echo hello world' — transpile AND execute bash source
    // bash script.sh          — execute a bash script from the VFS
    // bash -c 'echo hi'       — same as inline (-c accepted for familiarity)
    // cat script.sh | bash    — execute from a pipe
    //
    // Type bash, get generated JS executed:
    //   bash → ESTree (debashl.wasm) → JS (sh2.* runtime) — with a
//   fallback to the Perl path (sh2perl.wasm → perl2js) → run in the shell
    if (args[0] === "-h" || args[0] === "--help") {
      stdout.write(`bash — run bash commands by transpiling them to JS

Usage:
  bash 'echo hello world'  transpile + execute inline bash
  bash -c 'echo hi'        same as inline
  bash script.sh           execute a bash script file from the virtual FS
  cat script.sh | bash     execute from a pipe
  bash -                   execute from a pipe (explicit)

Pipeline:  bash → ESTree (debashl.wasm) → JS (sh2.* runtime);
         falls back to sh2perl → perl2js if debashl is unavailable → executed
Loops, conditionals, variables, arithmetic and pipes work:
  bash 'for i in 1 2 3; do echo $i; done'
  bash 'x=1; while [ $x -lt 3 ]; do echo $x; x=$((x+1)); done'
  bash 'echo hi | grep h'
`);
      return 0;
    }
    let source = null;
    if (args[0] === "-c" || args[0] === "-e") {
      source = args.slice(1).join(" ");
    } else if (args[0] === "-f" || args[0] === "--file") {
      const file = args[1];
      if (!file) { stderr.write("bash: -f needs a file name\n"); return 2; }
      try {
        source = await fs.read(file);
      } catch (e) {
        stderr.write(`bash: ${file}: ${e.message}\n`);
        return 1;
      }
    } else if (args.length === 0 || args[0] === "-") {
      if (stdinBuffer) {
        source = stdinBuffer; // piped in
      } else {
        stderr.write("bash: no script given (pass one as an argument, use -f FILE, or pipe it in)\n");
        return 2;
      }
    } else if (!args[0].startsWith("-")) {
      // A file name runs the script from the VFS (`bash script.sh`);
      // anything else is inline bash source (`bash 'echo hi'`).
      // A word that looks like a script path but doesn't exist is an
      // error; multi-word source (paths inside it, like `if [ -f /x`) is
      // always treated as inline bash.
      const file = args[0];
      let fileSource = null;
      try {
        fileSource = await fs.read(file);
      } catch {
        // not a file — fall through to inline source
      }
      const looksLikePath = !/\s/.test(file) && (file.includes("/") || /\.sh$/.test(file));
      if (fileSource !== null) {
        source = fileSource;
      } else if (looksLikePath) {
        stderr.write(`bash: ${file}: No such file or directory\n`);
        return 1;
      } else {
        // Inline source: the first arg is the script; the rest are the
        // positional parameters ($1, $2, ...) like `bash -c '...' a b`.
        source = args[0];
      }
    } else {
      source = args.join(" ");
    }
    try {
      // Remaining args after the source become positional params ($1..$9).
      // For `bash script.sh a b`, args[0] was the file; pass the rest.
      const scriptArgs = source === args.join(" ") || args[0] === "-c" || args[0] === "-e"
        ? args.slice(args[0] === "-c" || args[0] === "-e" ? 1 : 0)
        : args.slice(1);
      return await runBash(fs, source, {
        wasmRunner,
        stdout,
        stderr,
        runCmd: runNestedCommand,
        args: scriptArgs,
        argv0: args[0] && !args[0].startsWith("-") ? args[0] : "bash",
      });
    } catch (e) {
      if (e instanceof InterruptError) throw e;
      stderr.write(`bash: ${e.message}\n`);
      return 1;
    }
  },

  async asciinema(args) {
    // asciinema rec <file.cast>   — record this session
    // asciinema stop              — stop recording, save the cast
    // asciinema play <file.cast>  — replay a cast with real timing
    // asciinema cat <file.cast>   — dump the raw cast JSON
    //

    // vi/edit sessions render their buffer into the cast as a TUI-style
    // terminal region so editors aren't a silent gap.
    const sub = args[0];

    if (sub === "rec" || sub === "record") {
      const file = args[1];
      if (!file) { stderr.write("asciinema: rec needs a file name (foo.cast)\n"); return 2; }
      if (recording.active) { stderr.write("asciinema: already recording\n"); return 1; }
      // Banner first (not captured), then start recording
      write(`asciinema: recording to ${file} — type 'asciinema stop' to finish\n`, "info");
      // Resolve the path NOW (against the cwd where rec was issued) so
      // the cast file goes where the user asked even if they cd elsewhere
      // before 'asciinema stop'.
      startRecording(fs._resolve(file));
      return 0;
    }

    if (sub === "stop") {
      if (!recording.active) { stderr.write("asciinema: not recording\n"); return 1; }
      const result = stopRecording();
      if (!result) return 1;
      try {
        await fs.write(result.filepath, result.content);
        stdout.write(`asciinema: recording saved to ${result.filepath}\n`);
        return 0;
      } catch (e) {
        stderr.write(`asciinema: ${e.message}\n`);
        return 1;
      }
    }

    if (sub === "play") {
      const file = args[1];
      if (!file) { stderr.write("asciinema: play needs a file name\n"); return 2; }
      try {
        const content = await fs.read(file);
        await playCast(content);
        return 0;
      } catch (e) {
        stderr.write(`asciinema: ${e.message}\n`);
        return 1;
      }
    }

    if (sub === "cat") {
      const file = args[1];
      if (!file) { stderr.write("asciinema: cat needs a file name\n"); return 2; }
      try {
        stdout.write(await fs.read(file));
        return 0;
      } catch (e) {
        stderr.write(`asciinema: ${e.message}\n`);
        return 1;
      }
    }

    if (sub === "-h" || sub === "--help" || sub === undefined) {
      stdout.write(`asciinema — record and replay terminal sessions\n\n`);
      stdout.write(`  asciinema rec <file.cast>   record this session to a cast file\n`);
      stdout.write(`  asciinema stop              stop recording and save\n`);
      stdout.write(`  asciinema play <file.cast>  replay a recording with real timing\n`);
      stdout.write(`  asciinema cat <file.cast>   dump the raw cast JSON (v2 format)\n`);
      stdout.write(`\n  Recordings are standard asciinema v2 cast files:\n`);

    stderr.write(`asciinema: unknown subcommand '${sub}' (try: asciinema --help)\n`);

  async locate(args) {
    if (args.length === 0) { stderr.write("locate: missing pattern\n"); return 2; }
    const pattern = args[0];
    // Build a regex from the pattern (support * and ? wildcards)
    let reStr = "";
    for (const ch of pattern) {
      if (ch === "*") reStr += ".*";
      else if (ch === "?") reStr += ".";
      else reStr += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
    const re = new RegExp(reStr, "i");

    const results = new Set();
    const visited = new Set();

    async function walk(dir) {
      if (visited.has(dir)) return;
      visited.add(dir);
      let entries;
      try { entries = await fs.list(dir); } catch { return; }
      for (const entry of entries) {
        const clean = entry.replace(/\/$/, "");
        const full = (dir === "/" ? "/" : dir + "/") + clean;
        if (re.test(clean)) {
          results.add(full + (entry.endsWith("/") ? "/" : ""));
        }
        if (entry.endsWith("/")) {
          await walk(full);
        }
      }
    }

    // 1. Walk local mounts only — /github & /gitlab would trigger a
    //    network crawl of every repo; remote content is searched via
    //    the visited-cache below instead.
    const tops = ["/tmp", "/home", "/bin", "/usr/bin", "/dev", "/http"];
    for (const top of tops) {
      await walk(top);
    }

    // 2. Raw localStorage scan — catch files not reachable via the dirs
    //    index (e.g. written to a path whose parent dir wasn't recorded)
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("fs:file:")) {
          const p = key.slice("fs:file:".length);
          const name = p.split("/").pop();
          if (re.test(name)) {
            results.add("/home" + p);
          }
        }
      }
    } catch {}

    // 3. GitHub/GitLab visited-path cache — can't enumerate all of GitHub,
    //    so search what has actually been browsed in this session.
    const remote = ["/github", "/gitlab", "/git"];
    let remoteSearched = false;
    for (const mount of remote) {
      try {
        const backend = fs._getBackend(mount + "/");
        if (backend && backend.listVisited) {
          const visited = await backend.listVisited();
          for (const p of visited) {
            const clean = p.replace(/\/$/, "");
            const name = clean.split("/").pop();
            if (re.test(name)) {
              results.add(mount + clean + (p.endsWith("/") ? "/" : ""));
            }
          }
          remoteSearched = true;
        }
      } catch {}
    }

    if (remoteSearched) {
      write("# note: /github & /gitlab results limited to files visited this session\n", "info");
    }

    if (results.size === 0) {
      stdout.write(`locate: no files matching "${pattern}"\n`);
      return 1;
    }
    stdout.write([...results].sort().join("\n") + "\n");
    return 0;
  },

  async chmod(args) {
    // chmod OCTAL file... — only the owner (or tinysh/root) may change a
    // file's mode. Modes are Unix-style: 600 = owner rw, 644 = +other r,
    // 755 = dir default, 700 = private dir.
    if (args.length === 0 || args[0] === "-h" || args[0] === "--help") {
      stderr.write("chmod OCTAL file...  (e.g. chmod 600 secret.txt · chmod 755 dir)\n");
      return args.length ? 0 : 2;
    }
    if (!/^[0-7]{3,4}$/.test(args[0])) {
      stderr.write(`chmod: invalid mode '${args[0]}' — use octal (600, 644, 755)\n`);
      return 2;
    }
    const mode = parseInt(args[0], 8);
    const user = env.USER || "tinysh";
    let hadError = false;
    for (const file of args.slice(1)) {
      const a = fs.attrOf(file);
      if (!a) {
        stderr.write(`chmod: ${file}: No such file or directory\n`);
        hadError = true;
        continue;
      }
      if (user !== "tinysh" && user !== "root" && user !== a.owner) {
        stderr.write(`chmod: ${file}: operation not permitted (owned by ${a.owner})\n`);
        hadError = true;
        continue;
      }
      fs.setAttr(file, { owner: a.owner, mode });
    }
    return hadError ? 1 : 0;
  },

  async su(args) {
    // su                  → drop to nobody (unprivileged)
    // su <name>           → switch to that user (su tinysh / su root → back)
    // su -                → same as bare su (login-shell style)
    let target = (args[0] || "nobody").trim().toLowerCase();
    if (target === "-") target = "nobody";
    if (!/^[a-z_][a-z0-9_-]*$/.test(target)) {
      stderr.write(`su: invalid user name '${target}'\n`);
      return 1;
    }
    if (env.USER === target) {
      stdout.write(`su: already running as ${target}\n`);
      return 0;
    }
    if (!suState.prev) {
      suState.prev = { user: env.USER, home: env.HOME, cwd: fs.cwd };
    }
    env.USER = target;
    const home = target === "tinysh" ? "/home" : "/home/" + target;
    env.HOME = home;
    try {
      await fs.stat(home);
    } catch {
      // First visit — create the home with a welcome note.
      try {
        await fs.write(home + "/README.txt",
          `Welcome, ${target}!\n` +
          `This is your home directory (${home}).\n` +
          `You are ${target === "nobody" ? "an unprivileged user" : "running as " + target} on tinysh.\n` +
          `Run 'su tinysh' to return to the admin account.\n`);
      } catch {}
    }
    // The new home is owned by the target user (su runs as admin, so
    // the writes above would otherwise attribute it to tinysh — leaving
    // the account unable to write in its own home).
    fs.setAttr(home, { owner: target, mode: 0o700 });
    try { fs.setAttr(home + "/README.txt", { owner: target, mode: 0o644 }); } catch {}
    if (target === "tinysh" && suState.prev) {
      fs.cwd = suState.prev.cwd;   // return to where we were before su
      suState.prev = null;
    } else {
      fs.cwd = home;
    }
    env.PWD = fs.cwd;
    const unpriv = ["nobody", "daemon", "guest", "www-data"].includes(target);
    stdout.write(`su: switched to ${target} — ${unpriv ? "unprivileged" : "user"}\n`);
    stdout.write(`    HOME=${env.HOME} · run 'su tinysh' to return\n`);
    updatePrompt();
    return 0;
  },
